  { id:"2501", title:"电能质量指标", tags:["电能质量","THD","谐波"], content:"电能质量是电力系统的重要技术指标，直接关系到用电设备的正常工作和系统的安全经济运行。\n主要指标：(1)电压偏差——实际运行电压与额定电压的差值百分比。GB/T 12325规定：35kV及以上±5%，10kV及以下±7%，低压220V +7%/-10%。(2)频率偏差——GB/T 15945规定正常允许±0.2Hz（小容量系统±0.5Hz）。频率偏差反映了系统有功功率的总体平衡关系（有功不足→频率下降，有功过剩→频率上升）。(3)谐波/间谐波——电压/电流波形畸变的程度，用THD（Total Harmonic Distortion，总谐波畸变率）衡量。GB/T 14549规定：0.38kV电压THD≤5%，6~10kV≤4%，35~66kV≤3%，110kV及以上≤2%。奇次谐波3~19次按次数依次递减幅值限值，偶次谐波限值取相邻奇次谐波限值的50%。(4)三相不平衡——用负序/零序电压电流与正序分量的百分比衡量。GB/T 15543规定：电网负序电压不平衡度≤2%，短时≤4%。(5)电压波动与闪变——GB/T 12326规定：电压变动频度r≤1000次/h时，变动限值0.5~4.0%（按频度分挡递减）。闪变Pst（短时闪变严酷度）≤1.0，Plt（长时闪变严酷度）≤0.8。(6)暂态过电压及操作过电压、雷电过电压、暂时过电压谐振过电压等，与电力系统绝缘配合密切相关。\n监测手段：电能质量在线监测装置（固定安装在重要枢纽变电站、大容量非线性用户接入点PCC、新能源并网点等典型监测点），手持式分析仪（Fluke 435/437等，用于现场单点排查和故障录波分析）。\n标准体系：GB/T 14549公用电网谐波、GB/T 15543三相电压不平衡、GB/T 12326电压波动和闪变、GB/T 15945电力系统频率偏差、GB/T 18481暂时过电压和瞬态过电压。IEC 61000系列电磁兼容（EMC）标准，包含辐射/传导发射和抗扰度等级类别。", module:"m6", submodule:"6.1 问题分类", related:["→ 关联：规范与标准 — GB/T 14549"] },
  { id:"2502", title:"无功补偿原理", tags:["无功补偿","功率因数","SVG"], content:"无功补偿是电能质量治理的基础手段，用于补偿电力系统中的感性无功功率（主要由变压器、异步电动机、电感器等感性负载消耗），提高功率因数、降低线路损耗、改善电压质量。\n补偿原理：(1)并联电容器——产生容性无功功率（Q_C=U²/XC=ωCU²正比于电压平方，当电压降低时无功输出以平方关系快速减小导致无功输出不足），补偿感性负载的滞后无功，提高cosφ。结构简单、投资低，但补偿容量随电压降低而平方降低（电压无功调节特性呈负调压效应）。(2)自动投切电容器组——接触器或晶闸管开关自动分组投切电容器，根据无功需求（功率因数/无功功率检测）自动投切不同容量组合的电容器组，解决固定电容器欠补偿或过补偿问题。响应时间秒级（接触器投切分组），可控硅晶闸管开关投切可实现20ms~40ms级快速过零投切无涌流。(3)SVG（静止无功发生器）——基于IGBT电压源型变流器VSC，通过PWM调制产生与系统同步的电压或电流，动态发出容性或感性无功电流，连续平滑调节。响应时间≤5ms。\n功率因数标准：电力用户功率因数≥0.9（根据《功率因数调整电费办法》，0.9为基准功率因数值，即一般工业用户。高压供电工业用户要求cosφ≥0.9，大用户（160kVA以上高压供电）功率因数标准执行0.9；100kVA及以上其他用户cosφ≥0.85；农业用户≥0.80）。当cosφ低于此标准时供电公司加收力率调整电费。\n补偿容量计算：Q_c=P×(tanφ₁−tanφ₂)，其中P为有功功率，φ₁为补偿前功率因数角，φ₂为补偿后目标功率因数角。实际工程设计时按变压器容量的20%~40%粗略估算配置电容器补偿容量。\n串联电抗器配置：为防止5次/7次及以上谐波谐振放大，电容器回路需串联一定电抗率（6%电抗器主要抑制5次7次及以上谐波谐振放大、7%及以上电抗器抑制3次谐波谐振放大，13%电抗率全滤除高次但整体造价高系统应用较少）。电容器支路与系统感抗形成的并联谐振频率需避开电网主要谐波次数。", module:"m6", submodule:"6.2 无功补偿", related:[] },
  { id:"2503", title:"SVG静止无功发生器", tags:["SVG","VSC","动态补偿"], content:"SVG（Static Var Generator，静止无功发生器）是基于电压源型变流器（VSC，Voltage Source Converter）的先进动态无功补偿装置，可快速连续发出容性或感性无功功率。相比传统的SVC（晶闸管控制电抗器TCR+晶闸管投切电容器TSC组合型），SVG在响应速度、补偿范围、谐波特性等方面有显著优势。\n工作原理：SVG通过IGBT全控器件＋PWM调制，使VSC输出与系统电压同频的交流电压（或电流），通过改变输出电压的幅值和相位（相对系统电压），调节SVG与系统之间交换的无功功率。输出电压幅值<系统电压→吸收感性无功（相当于电感器）；输出电压幅值>系统电压→发出容性无功（相当于电容器）。SVG采用电流直接控制或电压间接控制策略，电流内环+电压外环双闭环控制。\n主要拓扑：(1)低压SVG——两电平VSC（380V/690V）或三电平NPC/飞跨电容VSC（690V），并联多重化提高容量，容量±50kVar~±2Mvar，台式或机架式安装。(2)高压SVG——链式H桥级联（Cascaded H-Bridge，CHB）多电平VSC：每相由N个H桥功率单元（IGBT模块+直流电容）串联形成6~10kV/10~35kV直连。MMC模块化多电平换流器也是中高压SVG采用拓扑，适用于±1~±300Mvar容量范围、6kV/10kV/35kV电压等级，适应大型轧钢电弧炉/新能源场站等快速大容量无功补偿需求。SVG同时具备有源滤波APF部分功能（可滤除一定比例的谐波电流），是综合电能质量治理设备。\n性能对比SVC：项目SVG（静止无功发生器）——SVC（静止无功补偿器TCR+FC/TSC）。响应时间：SVG ≤5ms（一个周波以内可完成调节），SVC 10~30ms（晶闸管触发延迟+半个周波过零闭锁自然换相）。谐波特性：SVG 自身产生的谐波很小（多电平PWM，输出谐波少，THD<3%），SVC TCR过程中产生大量3/5/7次谐波需配置相应次数滤波器组。调节范围：SVG 从容性额定到感性额定连续平滑补偿（正反双向额定无功均可稳定输出，无级差），SVC 感性补偿依赖TCR（需配合FC提供的固定容性容量使用），调节范围受晶闸管限制有一定盲区。占地面积：SVG 约为SVC的1/3~1/2。\n工程应用：新能源（风电/光伏）场站并网点AVC无功调节（电压-无功综合控制响应满足并网要求，快速跟踪AVC主站下发的电压或无功指令），大型工业（电弧炉/轧机/提升机等快速冲击性负荷的电压波动和闪变抑制），城市电网变电站（动态无功支撑，兼顾提高功率因数、降低线损和改善稳态电压质量）。", module:"m6", submodule:"6.2 无功补偿", related:["→ 关联：产品知识库 §9.5 电能质量设备"] },
  { id:"2504", title:"谐波源识别", tags:["谐波源","6脉波","特征次谐波"], content:"谐波源是电力系统中产生非正弦电流/电压波形的设备或负载。识别各类谐波源的特征和谐波频次分布，是谐波治理方案设计（滤波器选型配置、有源补偿装置容量确定）的前提。\n主要谐波源类型和特征次谐波：(1)变频器VFD——6脉波变频器（通用低压变频器标准内置三相桥式不可控整流或PWM整流）产生特征次谐波6k±1（即5、7、11、13、17、19...次），5次谐波电流含量最大（约基波的33%理论值），7次次之（理论14%）。12脉波变频器（12脉波整流由两个6脉波整流桥串联或并联构成，整流变压器需有两组移相30°二次绕组），特征谐波为12k±1（即11、13、23、25...次），谐波含量显著降低（可降至6脉波的10%~15%）。变频器产生的谐波与负载率也有关系（轻载时谐波畸变往往恶化（相对基波占比）。变频器输入电流THD（总谐波失真）：不加电抗器→THDi约80%~120%（6脉波）；加3%交流电抗器→THDi降至30%~40%；加直流电抗器+交流电抗器→THDi可降至25%~30%；加有源前端AFE整流（IGBT PWM整流器）→THDi<5%。\n(2)整流器/直流电源——各工业直流电源（电镀电解、充电桩）、UPS不间断电源输入整流器。6脉波或12脉波三相桥式整流，特征谐波与变频器相同。单相整流器（电视机/办公设备、小功率开关电源）产生3次谐波为主，3次谐波在N线上叠加会显著增加N线电流（可能超过相线电流导致N线过热，GB 50054要求N线截面与相线相同或采取其他滤波措施）。(3)电弧炉EAF——电弧炉在熔化期（废钢熔化）会产生极不稳定的谐波（2~7次全范围均有较大的谐波电流，偶次谐波和间谐波丰富（与其他谐波源的不同）、伴随剧烈的电压波动和闪变（0.5~10Hz的电压调制变化）和三相不平衡（电极升降和电弧电阻不均匀、废钢塌料造成的电极短路）。电弧炉是电能质量污染最严重的工业负载之一，需配置SVC或SVG+FC固定滤波器综合治理。(4)UPS不间断电源——在线双变换UPS的输入整流器（6/12脉波晶闸管或IGBT整流），产生谐波同变频器/整流器。现代UPS采用IGBT PWM整流器（输入功率因数接近1，输入THDi<5%），几乎不产生谐波（高效率在线双变换UPS基本上都配备了IGBT整流方案谐波含量都很小)。(5)焊接机/中频炉/感应加热等——根据具体拓扑和工作频段产生不同频次的谐波和间谐波。中频炉（工作频率150~2500Hz不等）产生供电频率+工件中频频率的间谐波成分。(6)光伏逆变器并网——逆变器SPWM调制高频（3~20kHz）开关输出，大部分谐波被LCL滤波器滤除，对3~50次电网谐波影响很小；但逆变器输出直流分量需小于0.5%（注入电网的直流分量使配变半波饱和产生严重谐波），以及弱电网阻抗相互作用导致高频谐振可能恶化背景谐波。\n谐波影响：电流谐波在线路上产生谐波压降，导致电压波形畸变→电容器过载（谐波电流加速电容器过载发热，可能引起鼓包漏液着火爆炸，谐波谐振情况下放大更危险）；变压器谐波附加损耗、发热增加；电机谐波转矩降功发热；继电保护误动/拒动；通信干扰（电力线谐波对邻近通信线路的电磁感应干扰）；电能表计量误差。\n谐波源定位：采用电能质量分析仪（Fluke 435或类似高精度三相电能质量分析仪）在PCC点（公共连接点）测量电压/电流波形、谐波频谱、功率方向，参考GB/T 14549和IEC 61000-4-7谐波测量指导书。", module:"m6", submodule:"6.3 谐波治理", related:["→ 关联：电气自动化 §3.2 变频器"] },
  { id:"2505", title:"有源电力滤波器APF", tags:["APF","有源滤波","谐波治理"], content:"APF（Active Power Filter，有源电力滤波器）实时检测电力系统中的谐波电流，产生与负载谐波电流大小相等、方向相反的补偿电流注入电网，实现谐波电流的动态实时抵消，达到滤波的目的。\n工作原理：APF通过电流互感器CT检测负载电流→DSP/FPGA实时计算谐波和无功分量（基于瞬时有功无功理论pq法、同步坐标系d-q法或FFT快速傅里叶变换提取谐波指令电流）→采用PWM调制控制IGBT逆变器输出与谐波指令电流极性相反的补偿电流注入电网→电网侧电流被补偿后恢复为标准正弦波。控制策略：开环（检测LOAD电流计算谐波指令）+闭环（同时检测补偿后的电网电流作为反馈校正，实现精确谐波补偿）。\n功率电路拓扑：三相四线制（三桥臂split电容+第四桥臂/△/Y形变压器或四桥臂四桥臂拓扑三种方案，三电平NPC优于两电平用于低压APF），电压等级380V/400V/480V，容量50~600A（单机），模块化可并联至3000A+。三电平NPC型APF比两电平输出波形谐波小（等效输出波形为多电平，谐波含量低、du/dt小、损耗小），效率更高。\n补偿能力：(1)谐波补偿——2~50次谐波（范围可设，特定次数或全频谱），单次谐波补偿率≥95%，电网THDi降至5%以下（根据补偿容量和背景谐波设定根据负载谐波电流大小匹配APF容量）。(2)无功补偿——APF在额定容量范围内可同时补偿谐波和无功（无功补偿量为有功以外的视在剩余容量），功率因数可调至0.99。(3)三相不平衡补偿——三相负载不平衡时通过控制APF输出对应不平衡电流，治理三相的不平衡度。APF补偿响应速度<10ms（瞬时值电流控制，一个工频周波内达到稳态补偿效果）。\n应用场景：(1)数据中心UPS输入谐波治理——UPS采用6/12脉冲整流器时输入谐波远大于THDi限值，APF治理UPS及IT设备谐波、消除N线三次谐波过流过热。(2)工业变频器集中治理——变频器集中使用场所（纺织/化纤/钢铁/制药/暖通空调）谐波集中，APF集中治理或就地补偿（变频器输入端注入），将THDi从30%~80%降至5%以下。(3)医疗设备谐波——CT机/MRI/加速器等大型医疗设备（因为设备内部有高频大功率开关电源/脉冲电源等）间歇冲击谐波（APF快速跟随补偿，避免谐波对其他精密医疗仪器（如心电仪、监护仪）的干扰。(4)商业建筑/大型商场——LED大屏、电梯、变频空调、UPS、调光设备的大量使用导致谐波叠加，建筑总进线处安装APF或分配电柜分散治理。\n标准规范：GB/T 14549公用电网谐波限值、GB/T 37408有源电力滤波器技术规范、IEC 61000-3-2/3-4谐波电流发射限值（低压供电系统）。", module:"m6", submodule:"6.3 谐波治理", related:["→ 关联：产品知识库 §9.5 电能质量设备"] },
  { id:"2506", title:"低电压治理措施", tags:["低电压","调压","串补"], content:"低电压（末端电压偏低）是中低压配电网的常见电能质量问题，主要表现为用户端电压长期低于额定电压的-10%（GB/T 12325规定：220V用户电压允许偏差+7%/-10%）。农村电网、偏远山区、长距离供电线路末端的季节性负荷高峰电压问题尤其突出。\n治理措施：(1)加强无功补偿——在配变低压侧或线路中途安装并联电容器组（自动投切型），补偿无功电流减少线路无功传输产生的电压降ΔU≈(PR+QX)/U。根据线路参数和负荷情况确定无功补偿容量及安装位置。线路适当位置加装杆上无功补偿装置（电容器完全自动投切型）。\n(2)线路改造——增大导线截面（减小R和X）、缩短供电半径（优化配网网架结构，增设变电站布点或变压器布点）、加装线路调压器（自动感应调压器/有载调压器/串联补偿调压器）。(3)变压器调压——变电站主变有载调压分接头（通过OLTC自动或手动调节变压器高压侧抽头改变配网侧电压等级比例），配电变压器无载调压分接头（停电状态下调整变压器变比，每年在冬/夏最大负荷季之前根据电压监测数据季节性调整，调整量±2×2.5%或±4×2.5%）。\n(4)串联补偿装置（串补/线路补偿）——在线路上串入电容器（将线路中串联电容器以降低线路感抗，提高X/R比，利用线路感抗进行容性补偿抵消部分线路感抗），缩短线路等效电气距离，降低电压损耗。与并联补偿不同的是，串补无功补偿量与负荷电流平方成正比（即负荷电流升高→串补补偿量自动能力增高→自适应调压效果好），对末端电压提升作用明显，适合长距离配网线路。串补装置含电容器组+保护用氧化锌避雷器MOV+旁路开关+阻尼装置（限制故障下过电流冲击）。(5)分布式电源接入——光伏/储能接入配电网为用户提供自用电源，降低从电网吸收的有功功率和线路电流（不消耗线路有功传输容量），从而减少线路压降。\n低电压判别：按照GB/T 12325，低压用户电压低于198V（220V-10%），中压10kV用户低于9.3kV（10kV-7%）即判定为低电压。农村电网低电压台区（变压器低压侧出口母线/台区总表处电压低，反映来线电压偏低或多台区共用长距离母线供电等背景原因）按高损耗台区和单相供电等按类型评估改善。\n排查流程：电能质量在线监测系统或人工测量→确认用户端电压有效值低于限值→分析统计出现低电压的时长和频次→判断是系统/线路/变压器的原因还是用户内线的原因→制定改造方案。", module:"m6", submodule:"6.4 低电压治理", related:[] },
  { id:"2507", title:"有载调压变压器", tags:["OLTC","有载调压"], content:"OLTC（On-Load Tap Changer，有载调压分接开关）是变电站和配电系统中重要的电压调整设备，可在变压器带负荷状态下（无需停电切换分接头）自动或手动切换变压器高压绕组的分接头位置，改变变比以调节低压侧输出电压。\n工作原理：变压器高压绕组设有若干个抽头（分接位（抽头位置）），每个抽头对应不同匝数的绕组段。有载调压开关在切换分头时采用过渡电路（电抗式或电阻式），通过主触头和辅助触投触头配合，在切换瞬间在两个相邻分接头之间接入过渡电阻或过渡电抗以限制环流、电弧和过渡过程，实现不断电平滑切换。电阻式OLTC使用最广泛，过渡电阻限制切换过程中的循环电流宽度。\n分接范围：标准分接范围±8×1.25%（共17档，对应调压范围±10%，第9档为额定档位，满档位可上升/下降各8级调整电压），每档调节电压约1.25%。也有±9×1.67%和±6×2.5%等非常用规格的调压变压器。\nOLTC类型：(1)真空管有载分接开关——切换开关和分接选择器浸泡在变压器油（绝缘和灭弧的油介质）中，真空灭弧室控制切换过程电弧电弧，无油中电弧产物，维护工作量低，是目前新装变压器的主流开关方案。(2)油中有载分接开关——传统油浸式OLTC（过渡电阻在切换过程中在在绝缘油中产生电弧并分解油质，需定期过滤或更换绝缘油），逐步被真空管型替代。\n控制方式：(1)自动电压调节AVR（Automatic Voltage Regulator）——控制器检测变压器低压侧母线电压的瞬时值/时间积分值与目标电压设定值比较判据，经延时（如20~60s防抖和机构动作时间）后向OLTC电动机机构（DCM电动机构）发出升/降指令。（2）并联运行控制——多台变压器并列运行时，OLTC调压需同步控制（主从控制模式或自动均衡控制器分配Q环流补偿或电压无功综合控制VQC根据9区图/17区图/动态分区图逻辑实现变电站电压无功自动控制：在电压和功率因数（或无功）二维坐标平面内分区域以延时投切电容器组分接头升降归入下限区域类逐项对应动作）。\n应用：变电站主变有载调压（所有110kV及以上变压器基本都配置有载调压装置，35kV变电站随升压增容逐步推广有载调压）；配电线路调压器（在10kV长线路中段安装线路调压器，含自耦变压器+OLTC自动调压，串联在线路中，自动感应调压可补偿线路末端电压，调压范围通常±10%）。\n标准：GB/T 1094变压器，GB/T 10230分接开关、DL/T 574有载分接开关运行维修导则。", module:"m6", submodule:"6.5 调压设备", related:["→ 关联：工业电气成套 §7.2 配电变压器"] },
  { id:"2508", title:"柔性直流输电", tags:["柔直","VSC-HVDC","MMC"], content:"柔性直流输电（VSC-HVDC，Voltage Source Converter based High Voltage Direct Current，基于电压源型换流器的高压直流输电）是新一代直流输电技术，相比传统基于晶闸管的LCC-HVDC（电网换相换流器型直流输电，LCC电流源型逆变器+晶闸管换流阀，运行中依赖交流电网的短路容量换相），VSC-HVDC具有独立控制有功/无功、无需交流侧提供换相电压（可向无源网络供电）、谐波水平低等显著优势。\n核心换流器拓扑——MMC（Modular Multilevel Converter，模块化多电平换流器）：每相由上、下两个桥臂组成，每个桥臂由N个半桥或全桥子模块（SM，Submodule）串联而成。半桥子模块（HB，Half-Bridge Sub-module）：两个IGBT（V1/V2）+一个直流电容。通过V1和V2的开关配合，子模块可输出0（V2导通、V1关断）或U_c（电容电压，V1导通、V2关断）两种状态，损耗较小，但不能清除直流故障电流（直流侧短路时，避雷器灭弧或跳交流开关清除故障）。全桥子模块（FB，Full-Bridge Sub-module）：四个IGBT+一个直流电容，可输出−U_c / 0 / +U_c三种状态（利用逆电压输出能力清熄直流故障关断IGBT封锁直流故障电流），适用于直流电网和架空线场合（对直流故障清除能力有高要求）。每个桥臂子模块数N（几十一百级），可输出非常逼近正弦波的阶梯波，谐波含量极低，几乎无需滤波器。\nMMC-HVDC关键特性：(1)有功/无功独立解耦控制（d-q坐标系下电流内环+功率外环双闭环控制，P有功/无功/Q可四象限运行；(2)可为无源网络供电（PCC点电压由换流器独立建立，不依赖交流电网同步）；(3)换流站占地面积小（≈LCC-HVDC的一半）；(4)模块化设计（子模块为标准化功率单元，冗余设计寿命周期内不更换主回路功率模块损坏后可用现场备用模块替换，备用率为5%~10%）；(5)具备黑启动能力。\n工程应用：(1)海上风电柔性直流送出——远海风电场（离岸80km以上）采用柔直送出方案比交流海缆方案经济性更优。风场交流汇集→海上换流站（升压+整流至直流）→直流海缆（±200/±320/±525kV）→陆上换流站（逆变+降压并入主网）。国内工程：如东海上风电柔直工程、青洲海上风电柔直外送工程。\n(2)异步联网——LCC-HVDC传统直流已经用于长距离、大容量异步联网（背靠背、远距离）。VSC-HVDC的优势是互联两个不同步或不同频率的交流网络，潮流控制灵活，可快速双向功率调节，互不干扰。如南方电网鲁西背靠背柔性直流工程（云南主网与广西电网异步互联）。欧洲：INELFE（法国-西班牙间VSC-HVDC联络）。\n(3)城市配网柔性互联——柔直背靠背装置位于城市不同变电站、分区负荷之间的柔性互联，基于MMC，替代传统联络开关，实现多条馈线负荷的动态分配和N-1转供。正常工况下柔直互联装置可灵活调节两段母线间的交换功率，实现负载均衡；故障时互联侧快速支援备用变压器短时转供，实现备自投功能。\n标准：GB/T 30553高压直流输电系统用电压源型换流器、IEC 62747高压直流输电（HVDC）用电压源换流器（VSC）术语德。", module:"m6", submodule:"6.6 柔性直流", related:["→ 关联：新能源与储能 — 海上风电送出"] },
  { id:"3007", title:"特高压工程案例", tags:["特高压直流","案例"], content:"昌吉-古泉±1100kV特高压直流工程——目前世界上电压等级最高、输送容量最大、输送距离最远的特高压直流输电工程。起于新疆昌吉换流站，止于安徽古泉换流站（±1100kV/10GW/3324km）。2020年建成投运，由中国国家电网公司建设运营。直流线路全长3324km，输送容量1200万kW（约相当于6个百万千瓦级核电基地）。接入±1100kV高端换流变压器+6英寸晶闸管/8000A/8500V的大功率晶闸管（电触发）换流阀。国内±1100kV特高压直流换流变压器和阀厅采用GIS套管+户外直流场户外场+滤波器组。\n酒泉-湖南±800kV特高压直流——输送容量800万kW，线路长度2383km，将西部绿电（酒泉风电+光伏+火电打捆外送）输送至湖南负荷中心。\n巴西美丽山±800kV特高压直流——国家电网公司海外投资和总承包的特高压输电项目。美丽山二期（2019年投入商业运行）将亚马逊河流域水电能源输送到里约热内卢负荷中心，输送容量400万千瓦（二期最终容量），线路长度2538km。\n白鹤滩-江苏±800kV特高压直流工程——世界首个混合级联特高压直流工程：送端白鹤滩换流站（LCC常规直流）—受端江苏换流站（VSC柔直）+分层接入（接入500kV/220kV交流电网），输送容量800万kW。这一LCC+MMC混合级联方案兼具常规直流大容量容量经济性（送端LCC换流站成本低）和受端柔直灵活控制（受端MMC换流器可实现黑启动/孤岛接入/动态无功支撑）两点优势，是特高压直流技术的重要创新。\n标准：GB/T 24841±800kV特高压直流换流站设计导则、DL/T 1786特高压直流工程系统设计内容深度规定。", module:"m6", submodule:"6.7 工程案例库", related:["→ 关联：产品知识库 §9.1 高压开关产品"] },
  { id:"3008", title:"智能变电站工程案例", tags:["智能站","IEC61850"], content:"智能变电站是智能电网的重要节点，全站采用IEC 61850标准实现信息统一建模、网络化通信、智能化设备与高级应用。智能变电站典型三层两网架构：\n三层：(1)过程层——电子式互感器（ECT/EVT）、智能终端（合并单元+智能终端实现一次设备数字化采集、控制输出——传统互感器也可通过合并单元实现常规互感器+合并单元模式接入过程层）、智能开关设备（隔离/接地/断路器配置智能终端）。(2)间隔层——保护装置、测控装置、故障录波、电能表等二次设备。实现对应间隔的保护测控和对一次设备开关的发信跳合闸。(3)站控层——监控系统主机、远动通信装置、PMU同步相量测量装置、GPS对时、时间同步、五防工作站、保护信息子站网关、数据服务器、操作员工作站。\n两网：(1)GOOSE网络（Generic Object-Oriented Substation Event，通用面向对象变电站事件）——传输跳闸合闸信号、联闭锁信号、间隔联动、变压器挡位等一次设备状态量信号；采用多播发布/订阅通信机制（跳闸命令延时<3ms）；(2)SV网络（Sampled Value，采样值）——传输电子式互感器采集的电流电压数字采样值。采样率80点/周波（25Hz及工频50Hz四倍频谐波）用于保护控制，256点/周波用于电能质量分析。SMV9-2LE（标准采样值格式）的光纤以太网。\n工程示例：浙江金华500kV芝堰智能变电站（国家电网首批新一代智能变电站扩大示范工程），采用全站IEC 61850 Ed2.0，间隔层保护测控一体化装置，过程层合并单元+智能终端就地安装（下放到开关场智能汇控柜），全站光纤替代传统电缆（减少电缆90%）。重庆合川220kV智能变电站（国家电网新一代智能变电站试点），采用预制舱式二次组合设备，工厂化调试缩短现场施工周期。\n标准：GB/T 30155智能变电站技术导则、DL/T 860变电站通信网络和系统（IEC 61850 IDT）、Q/GDW 11156智能变电站继电保护技术规范（国网企标，含合并单元智能终端和继保接口规范）。", module:"m6", submodule:"6.7 工程案例库", related:["→ 关联：规范与标准 §8.4 — IEC 61850"] },
  { id:"3009", title:"大型储能电站案例", tags:["储能电站","液冷"], content:"大型储能电站（电化学储能电站）是新型电力系统灵活调节能力的重要支撑，调峰填谷和一次调频是主要收益来源。\n典型案例一：某省网侧200MW/400MWh磷酸铁锂储能电站——容量200MW/400MWh（充放电2h，时长是当前配储标准主流时长），采用LFP电池+液冷温控技术，35kV并网接入110kV变电站。储能系统由电池预制舱（20尺或40尺。标准20尺预制舱约2.5~5MWh容量，本案例共约80~160台20尺标准预制舱+PCS升压一体化箱变（100kW~3.45MW功率等级）+35kV储能升压变压器系统组成。PCS采用1500Vdc方案（直流侧母线电压提升至1500V，电流在容量不变时降低为原来750Vdc方案的50%，线缆和开关电气损耗降低，功率密度提升30%以上）。液冷温控系统：电池簇液冷板与BTU（电池热管理机组）水泵循环接口连接，冷却液（乙二醇水溶液）流过液冷板将电芯热量带走，冷却液比热容高，散热效率高、电池间温差<3℃、功耗比风冷降低约30%~40%。\n运营模式：(1)调峰（两充两放：早晚高峰放电，午间和深夜充电，峰谷价差×充放电电量×系统效率≈收入）。(2)一次调频/二次调频（储能可响应AGC调度指令，储能电站以毫秒级~秒级响应参与调频市场，比火电机组响应速度快、调节精度高——调频补偿标准高的电力市场辅助服务收益可观)。（3）容量租赁（储能容量租赁给新能源场站完成强制配储要求，获得固定租赁收益）。(4)备用容量（有偿旋转备用市场）。\n当前全国各省均出台新能源配储（10~20%/2h）政策要求，各地储能电站建设进入快速扩张期，注意PCS变流器的构网型支撑功能、电池簇级管理BMS架构以及EMS系统统一监控。\n标准：GB/T 36276电力储能用锂离子电池、GB/T 36548电化学储能系统接入电网测试规范、GB/T 36558储能系统通用技术条件、GB 51048电化学储能电站设计规范。\n安全和消防：储能预制舱舱间防火间距/防火墙要求、电池模块OSB+灭弧探针+全氟己酮/水喷雾/气溶胶消防方案、消防主机与BMS联动监控热失控早期预警信号（温度/烟感/VOC/气溶胶复合探测）。", module:"m6", submodule:"6.7 工程案例库", related:["→ 关联：新能源与储能 §5.3 储能技术"] },
  { id:"3010", title:"工业园区配网项目", tags:["配网自动化","FA"], content:"工业园区配网项目通常以提升供电可靠性和实现配电自动化（DA，Distribution Automation）为主要建设目标，特别关注配电自动化的馈线自动化FA（Feeder Automation）功能。\n典型配置：(1)配电室/开关站10kV一次网络环网化改造——采用环网柜（SF6绝缘/固体绝缘环网柜，负荷开关+熔断器组合柜，体积小/绝缘好/免维护/分断能力高）实现双电源供电或手拉手环网供电。每个配电室/开关站设置两路进线，正常情况下开环运行（联络开关断开，通过线路保护和备自投功能实现故障自愈切换）；当一路电源失电时，母联备自投自动闭合或由配网自动化系统自动转供操作。(2)配电自动化终端配置——在各配电室/环网柜/柱上开关安装DTU（开闭所终端单元，采集多个回路的模拟量和状态量，并可对一个开闭所的多个间隔进行就地/遥控操作）/FTU（馈线终端单元，安装于柱上开关/分段开关，采集本条线路的电压电流并就地遥控分合闸带重合功能，支持就地FA出口和通信主站遥控需求）/TTU（配变监测终端，配电台区变压器电气量采集和运行工况监测）。(3)配电自动化主站/子站——主站调度端（调配一体化主站系统，含SCADA/FA/GIS/PMS/DMS等高级应用功能，通常主站在地市供电局配调中心）；子站或终端利用光纤以太网（自愈环网）或5G无线专网等通信介质传输。\n馈线自动化FA功能——当配电网发生故障（瞬时性或永久性故障）时：(1)就地型FA：通过馈线终端FTU之间彼此配合（不依赖主站）实现故障检测和隔离（例如：电压时间型分段就地协同、集中式智能分布型FA）。柱上开关或环网柜配备FTU配合高精度零序CT识别单相接地故障选线选段、相间过流保护识别相间短路故障跳闸，利用智能分布式FA（相邻FTU之间GOOSE对等通信交换故障方向信息时间<100ms）实现故障隔离+负荷转供，恢复非故障区域供电，全流程时间<300ms（速动型）或3s~1min（缓动型）。(2)主站型FA：配电自动化主站接收各FTU/DTU上传的故障信号和遥测量，进行故障定位、隔离和非故障区域恢复供电方案辅助决策，供调度员判断发令遥控操作；功能部署由主站系统软件完成，对通信覆盖率的依赖度高。\n其他建设内容：配电室环境监控（温湿度/水浸/烟感/视频门禁及联动）、电能质量监测（从10kV进线及重要出线回路安装电能质量在线监测装置，及时发现谐波污染源）、智能巡检（室内挂轨机器人/轮式机器人、红外测温+局放TEV超声波在线捕捉局部放电信号+可见光+AI设备状态识别）。\n标准：GB 50052供配电系统设计规范、DL/T 5729配电网规划设计技术导则、DL/T 721配电网自动化技术导则。", module:"m6", submodule:"6.7 工程案例库", related:["→ 关联：电力系统 §2.4 配电系统"] },
  { id:"3011", title:"海上风电送出工程", tags:["海上风电","海缆"], content:"海上风电送出工程将海上风电场发出的电能输送到陆上电网，是海上风电建设的核心环节。送出方案可根据风电场离岸距离及输送容量分为高压交流（HVAC）和柔性直流（VSC-HVDC）两种主流方案。\n交流送出方案（适用于离岸距离<80km）：(1)海上风电机组→机端升压变（0.69kV/35kV或66kV，66kV集电系统比35kV系统可减少海缆数量降低损耗+节省用海面积，是新一代海上风电集电系统的趋势）→中压集电海缆（阵列海缆回路，各风机之间通过35kV或66kV交流XLPE绝缘海底电缆连接，接线方式为放射形/环形/组合形）→海上升压站（220kV/330kV/500kV后现在也有配置350kV一步升压的成熟方案）→高压交流海缆送出（220kV或500kV三芯交联聚乙烯XLPE绝缘交流海底电缆，采用光纤复合海缆光电合一）→陆上集控中心（升压或降压，接入电网）。(2)海上升压站包含主变压器（容量根据风场总装机容量设计，如350MW~1000MW，典型220kV级升压变容量×1~3台）、GIS（220kV/66kV全封闭组合电器，SF6气体绝缘，紧凑防腐蚀）、接地变兼站用变、柴油发电机应急电源、航标灯直升飞机平台航标警示等辅助设施。\n柔性直流送出方案（离岸距离>80km，交流XLPE海缆的充电无功电流不能忽略限制有功输送距离或者交流输送不能满足送电需求）：(1)海上换流平台（直流平台的重量和尺寸巨大—如±320kV/1000MW海上换流平台，重约25000吨+上部组块30000吨，整个平台由导管架固定于海底。配置换流变+MMC换流器（IGBT功率模块堆叠+液冷系统+直流电抗器+直流GIS）+控保系统（换流阀阀基控制器VBE）+交/直流场设备+辅助系统（海水冷却系统、消防系统、直升机甲板等）。(2)直流海缆（±200kV/±320kV/±525kV直流XLPE绝缘海底电缆，输送容量达1~2GW，直流耐受电压+极性反转试验和长期工作电压累积电荷空间电荷效应）。(3)陆上换流站（逆变将直流转回交流并网）及陆上集控中心。柔直送出优势：传输距离不受电缆容性电流限制（无交流型式的的充电无功损耗问题）、可向无源电网受端孤岛供电（可做黑启动电源）、提供动态无功补偿电压支撑（无需再在并网点额外配置动态无功补偿SVG和滤波器）。\n关键工程：(1)英国Hornsea Project海上风电（~1.2GW，交流送出+陆上并网）。(2)德国北海海上风电集群柔直送出（多个海上风场和海上直流汇集环网+陆上换流站的MMC-HVDC方案）。(3)中国广东青洲三/青洲五六七海上风电（500MW/1000MW级，±500kV~±800kV级LCC/MMC混合级联直流送出或纯柔直方案）。(4)三峡阳江沙扒海上风电（1700MW，220kV交流海缆送出+陆上集控中心方案）。\n标准：GB/T 32348海底电力电缆输电工程施工及验收规范、DL/T 2368海上风电场工程海底电缆设计规范、GB/T 37559海上风电场接入电力系统技术规定。", module:"m6", submodule:"6.7 工程案例库", related:["→ 关联：新能源与储能 §5.2 风力发电、§6.6 柔性直流"] },

  // ===== m7: 工业电气成套 =====
  { id:"2601", title:"高压开关柜", tags:["开关柜","KYN28","五防"], content:"高压开关柜用于3.6kV~40.5kV电力系统的接受和分配电能，对电路进行控制、保护和监测。KYN28-12中置柜是应用最广泛的12kV户内金属铠装中置移开式开关柜（型号含义：K—金属铠装、Y—移开式、N—户内、28—设计序号、12—额定电压12kV）。柜体由固定的柜架（2mm覆铝锌板/冷轧钢板折弯拼装，完全金属封闭）和可移动的手车（断路器手车+PT手车+隔离手车+熔断器+接地手车手车）组成，断路器手车在工作/试验/检修位置之间可移动并且不同位置之间有机械闭锁防误操作。\n主要一次方案：进线（架空进线/电缆进线）、出线（馈线回路）、母联（母线分段，两台柜横向并列实现双电源切换或母线联络）、PT（电压互感器+熔断器手车柜）、避雷器柜。\n额定参数：额定电压12kV/24kV/40.5kV；额定电流630/1250/2000/3150/4000A；额定短路开断电流25/31.5/40kA（有效值）；额定短路耐受电流4s。\n配用的真空断路器主流型号：VS1（12kV固封极柱真空断路器，操动机构弹簧储能式/永磁操动式，采用APG自动凝胶工艺将真空灭弧室+上下出线完全固封在环氧树脂内，绝缘水平高）+底盘车（丝杆推进机构）。\n五防联锁（GB 3906和DL/T 404对高压开关柜的强制性安全设计要求）：(1)防止误分误合断路器——断路器只有通过操作手柄或电动分合闸机构才能操作。(2)防止带负荷分合隔离开关（或隔离插头）——断路器处于合闸位置时断路器手车不能从试验位置摇进到工作位置也不能从工作位置摇出（机械闭锁功能）。(3)防止带电挂地线（含接地开关）——断路器手车在工作位置时，接地开关不能操作合闸（机械闭锁，合上接地开关后才能打开柜后封板维护电缆室）。(4)防止带地线合断路器（或隔离开关）——接地开关在合闸位置时断路器手车不能从试验位置摇入工作位置。(5)防止误入带电间隔——手车在工作位置时电缆室柜门由机械闭锁锁住不能打开。\n标准：GB 3906 3.6~40.5kV交流金属封闭开关设备和控制设备、DL/T 404户内交流高压开关柜订货技术条件。", module:"m7", submodule:"7.1 高低压开关柜", related:["→ 关联：产品知识库 §9.1 高压开关产品"] },
  { id:"2602", title:"低压配电柜", tags:["低压柜","MNS","GCS"], content:"低压配电柜适用于额定电压交流380V/400V/690V、频率50Hz的三相配电系统，作为电力系统的终端配电设备，负责电能的分配、控制、保护和监测。\n主流型号：(1)MNS（ABB引进技术）——模数化结构（抽屉单元+垂直母线+水平主母线），每个抽屉单元单元间隔独立（功能单元均在抽屉内），抽出式柜型，主母线水平安装于柜顶部且采用钢制隔离措施最高可达每个抽屉和功能室的完全分隔，改进的MNS2.0/MNS3.0为现在ABB新一代平台。额定电流水平母线至4000A（个别到6300A），短路耐受强度高。抽屉推进机构具有连接/试验/分离三位置定位并有机械联锁防止误抽出或误插入。(2)GCS（国产自主型，国家联合设计）——抽出式柜型，主母线额定电流至4000A，垂直母线额定电流1000A抽屉尺寸统一模数为160mm（1/2单元、1单元、2单元、3单元抽屉尺寸）。抽屉单元具有可靠的机械联锁（主开关合闸状态下抽屉不能抽出/插入—GV2/GV3型行程开关联锁）。(3)GCK（国产经济型抽屉柜）——抽屉高度250mm/400mm（1E/2E抽屉高度），固定分隔式（抽屉结构）+简单节能，适用于中小型配电。(4)GGD（固定式开关柜，非抽屉式，老式固定安装方案结构，GCK/GCS/MNS之前设计的主流国产柜型）——固定式结构：断路器固定安装在柜内安装板上，结构简单、成本低（便宜）、维护检修需要停电（主开关进线母排接地前安全步骤繁琐）。目前新的低压配电室主流都选用抽出式MNS或GCS柜，固定式GGD在改造维修和低成本小工程仍有少量使用。\n主要功能单元：进线柜（框架断路器ACB，如DW45智能型万能式断路器，电子脱扣器LSIG可选，框架壳架电流2000A/3200A/6300A，3极/4极）、馈线柜（塑壳断路器MCCB，如CM1/TM30/NSX系列，配电保护型或电动机保护型脱扣器）、电容补偿柜（自动功率因数补偿，智能电容器组/传统CJ19投切接触器+热继电器+电容器+串联电抗器+熔断器）、母联柜（双电源切换时连接两段低压母线）、有源滤波柜（APF/SVG柜，集中补偿柜谐波和无功。谐波治理和无功补偿常见的低压配电柜辅助功能回路）和马达控制柜（MCC，详见7.3节）。\n标准：GB/T 7251.1低压成套开关设备和控制设备第1部分总则、GB/T 7251.12低压成套开关设备和控制设备第12部分：成套电力开关和控制设备（PSC，即低压开关柜全套产品型式试验要求——柜体内部温升+介电性能+短路耐受强度+防护等级验证满足），JB/T 9661低压抽出式成套开关设备。", module:"m7", submodule:"7.1 高低压开关柜", related:[] },
  { id:"2603", title:"干式变压器", tags:["干式变","SCB","环氧浇注"], content:"干式变压器（干式变）铁心和绕组不浸在绝缘油中，依靠空气对流冷却，具有无油、难燃、防火性能好、环保等突出优点，广泛应用于高层建筑、商业中心、地铁、数据中心和医院等对防火有严格要求的场所。\n结构类型：(1)环氧树脂浇注型（SCB系列为主流）——高压绕组在真空状态下用环氧树脂加石英粉混合料浇注/APG自动凝胶成型工艺固化（低压绕组一般采用铜箔绕制+端封树脂形成铜箔层式结构），形成坚固的绝缘筒体。环氧浇注绕组机械强度高、抗短路能力强、防潮性能好，可自然冷却后直接投入运行。主流SCB系列容量50~10000kVA，电压6/10/35kV。(2)敞开式（浸渍型，NOMEX绝缘纸+真空压力浸渍VPI绝缘漆工艺）——绕组采用NOMEX纸包绝缘导线，再整体真空浸渍绝缘漆后烘干成型。绝缘等级H级（180℃）允许短期220℃上限。过载能力强，适合高温环境，但防潮和防尘能力弱于环氧浇注型。\n冷却方式：AN（自然空气冷却，容量较小功率密度低时选用）或AF（强制风冷，加装轴流冷却风机在变压器底部向上吹风，开启强制风冷后容量可提高40%~50%）。温控系统：干变预埋Pt100铂热电阻在低压绕组线饼间或铁心中，由温控器多路巡检实时显示三相绕组温度，并发出超温报警跳闸信号，同时根据预设温度点自动启停冷却风机。干式变压器过负荷能力比油浸变弱（过载15%不超过30min需密切关注绕组温度不超过报警阈值）。\n绝缘等级：F级（155℃）为标准绝缘耐温水平，H级（180℃）为更高耐温等级（可用于高温环境或更高过负荷安全裕量场景）。\n标准：GB/T 10228干式电力变压器技术参数和要求、GB 20052电力变压器能效限定值及能效等级（1级2级3级对应不同时空载与负载损耗限值，新建项目需满足2级能效要求）、JB/T 501干式变压器计算负荷导则。干式变压器外壳防护等级IP20/IP23（IP20防直径12.5mm异物，IP23防淋水）。", module:"m7", submodule:"7.2 配电变压器", related:["→ 关联：电气基础理论 §1.3 变压器工作原理"] },
  { id:"2604", title:"油浸式变压器", tags:["油浸变","非晶合金","瓦斯"], content:"油浸式变压器绕组和铁心浸在绝缘油（矿物变压器油/天然酯植物油/合成酯油）中以实现绝缘和散热冷却功能，具有成本低、过载能力强、散热好、寿命长等优势，广泛应用于户外变电站和配电系统中。\n能效系列：S9（已淘汰）→S11→S13→S15（SCBH15非晶合金，空载损耗最低），在变压器型号代号S后附加数字代表空载/负载损耗后续变化。S13型相对S11空载损耗降低约20%，负载损耗相当。非晶合金变压器（型号含SCBH15/非晶/非晶合金带材铁心）的铁心由超薄非晶合金带材（Fe基/Co基非晶态合金薄带20~30μm厚度）卷绕制成，空载损耗比S9降低约70%，比S13降低约30%，特别适合负载率低的配电台区和农网/光伏场景。\n冷却方式（依据变压器总体功率）：(1)ONAN（油浸自冷，依靠油自然对流循环+散热器/片式散热器自然冷却。中低压配变常用，容量≤10MVA）。(2)ONAF（油浸风冷，在散热器/片冷装置上加装轴流风机强制吹风加强散热，可提高容量30%以上）。(3)OFAF（强迫油循环风冷，油泵强迫油在变压器和散热器之间循环流动+风机对散热器吹风，用于大容量变压器OFWF(强迫油循环水冷)+大变压器配置）。(4)ODAF（强迫导向油循环风冷，多重导向油路直接引导油流过绕组内部热点，强油循环提高散热能力，大型变压器主力方式）。\n保护与监测：(1)瓦斯保护（气体继电器，即安装在变压器油箱与油枕之间连接管上的浮子式或挡板式流速继电器瓦斯继电器）——轻瓦斯：变压器内部故障产生少量气体聚积→气体继电器浮子下降接通轻瓦斯报警信号；重瓦斯：内部严重故障产生大量气体+油流高速冲击→挡板动作→重瓦斯瞬时跳闸切除变压器（油速整定值0.6~1.5m/s）。(2)温度保护——油面温度计+绕组热点温度间接计算（光纤测温直接监测绕组热点温度是新一代趋势）运行中的负荷电流可折算绕组热点温度限制于绝缘耐热等级（油浸A级105℃）温控上限。(3)油保护——储油柜（油枕）+呼吸器（硅胶吸潮干燥）+压力释放阀（油箱内部压力异常升高时迅速打开排油泄压）。\n标准：GB/T 1094电力变压器（第1~5部分：总则/温升/绝缘/分接/承受短路能力）、GB 20052电力变压器能效限定值及能效等级、GB/T 6451油浸式电力变压器技术参数和要求。", module:"m7", submodule:"7.2 配电变压器", related:[] },
  { id:"2605", title:"MCC马达控制中心", tags:["MCC","马达控制"], content:"MCC（Motor Control Center，马达控制中心）是集中安装和配电电动机回路的成套控制设备，也可称为马达控制柜。MCC按回路组合配电柜架布置多回路集成设计，在单个机柜内集成多路马达的供电、保护、控制和监测功能，广泛用于需要集中控制多台电动机的工业场合（泵站、风机、压缩机、传送带、水处理、化工/石化/钢厂等）。\n柜型：GCK/GCS/MNS低压抽出式配电柜马达控制单元，按功能单元间隔抽屉化（各回路采用抽屉式单元，检修更换不影响其他回路）。MCC回路以抽屉单元为最小分隔，按电流大小选择不同模数的抽屉（1/2单元<32A、1单元63A、2单元125A、3单元250A）。每个MCC抽屉内配置：塑壳断路器或微型断路器（短路和过载保护，整定电流由马达额定电流×1.0~1.05）+交流接触器（电动机频繁启停控制和分合闸）+热继电器（过负荷保护，曲线与电动机热特性匹配）或电动机保护器（智能电动机保护控制器替代热继，提供更精确的过载保护、三相不平衡、堵转、缺相、漏电等多种保护功能，兼有电流测量、RS485通信/Modbus等接口）+变频器或软启动器（按需要选配，大功率电机要求大降压启动或变频调速的工况在MCC之外按配电柜设计）。\n控制方式（二次回路）包括：(1)就地控制——MCC柜门上安装就地的按钮/转换开关/指示灯（启动/停止按钮、故障复位、运行指示、综合故障指示），岗位操作人员在MCC室启停电机。(2)远程自动控制——由DCS/PLC/上位机通过硬线（DI/DO控制电缆接MCC柜内中间继电器线圈）或通信（Profibus DP/Profinet输出接触器分合闸命令输入反馈运行状态）实现远程启停。就地/远程切换通过控制柜门上SA转换开关实现。\n典型回路配置：电机功率5.5~200kW常用回路类别举例。MCC回路还支持现场总线通信（Modbus/Profibus）远程故障诊断和实时电气参数参数和参数设定+电流消耗监测+远程状态诊断，以及马达保护器+RS485接入DCS实现电机的能效管理。\n标准：GB/T 7251.8低压成套开关设备和控制设备第8部分：智能型成套设备通用技术要求、GB/T 14048.4低压开关设备和控制设备第4部分：接触器和电动机起动器。", module:"m7", submodule:"7.3 MCC", related:["→ 关联：电气自动化 §3.2 变频器、§3.3 伺服系统"] },
  { id:"2606", title:"UPS不间断电源", tags:["UPS","蓄电池"], content:"UPS（Uninterruptible Power Supply，不间断电源）在电网电力中断或电压跌落在容许范围外时，通过蓄电池储能+逆变器切换输出持续稳定高质量交流电，保证关键设备（IT设备、弱电系统、工业过程控制系统、医疗设备、应急照明等）的连续正常运行。\n工作模式分类：(1)双变换在线式（Online Double Conversion，主流推荐方案，99%的关键负载应采用此架构）——整流器AC/DC将交流转为直流给蓄电池充电并同时提供直流母线给逆变器、逆变器DC/AC将直流转变为纯净稳定交流供给负载，始终在线双变换输出无中断，实现对电网电压波动、谐波、干扰的完全隔离和稳压稳频输出。效率96%~97%（效率取决于负载率，经济负载率为50%~75%时效率最高，可升级紧凑型UPS支持高达97%以上效率）。旁路模式：逆变器故障/过载/检修时静态开关自动切换至工频旁路（市电直通，无净化，切换时间<1ms可满足负载短暂不间断供电要求）。\n(2)后备式（Standby/Offline）——市电正常时直接旁路输出蓄电池充电不逆变工作、市电中断后约4~10ms切换继电器+逆变器投入。结构简单价低（用于个人电脑/家用路由器等非关键设备），有切换中断时间不适用于服务器、精密设备等高要求负载。\n蓄电池组：(1)铅酸蓄电池——阀控式密封铅酸蓄电池VRLA (AGM/GEL), 12V/9~250Ah单体。后备时间15min~8h（根据蓄电池容量配置计算，电池组容量(Ah)=UPS额定功率(W)×后备时间(h)÷(电池组电压(V)×放电效率(0.9)×利用率0.6~0.8受电池放电倍率限制）。浮充电压2.23V/节（25℃），寿命3~6年（受环境温度和充放电机制管理影响，环境温度每升高10℃，寿命减少50%）。(2)锂电池（Li-ion，特别是磷酸铁锂LFP）——体积小重量轻，循环寿命长，BMS全方位（过充保护/过放保护/高温保护/低温保护+均衡管理），能量密度是铅酸的3~5倍，寿命8~15年。虽初始投资成本高于铅酸蓄电池，但全生命周期成本性价比已有竞争力，在数据中心UPS领域新建项目过半均采用锂电方案。\n旁路切换：在线式UPS当逆变器故障/过载自动切换至旁路回路，切换时间<1ms（静态开关STSW静态转换开关，以晶闸管对实现负载从逆变器到旁路的转移，切换过程无中断但精细可靠）。\n标准：GB/T 7260不间断电源设备（系列标准，含UPS性能标准允许参数、电磁兼容性EMC限值、安全标准及环境要求等）、YD/T 1095通信用不间断电源（UPS）标准（电信行业对输入谐波电流/旁路要求/智能监控要求等）。", module:"m7", submodule:"7.4 UPS/EPS", related:["→ 关联：弱电与智能化 — UPS为弱电系统供电"] },
  { id:"2607", title:"EPS应急电源", tags:["EPS","应急电源"], content:"EPS（Emergency Power Supply，应急电源）专门为消防应急负荷（消防水泵/喷淋泵/防排烟风机/应急照明/疏散指示/防火卷帘/消防电梯等）供电，确保火灾等紧急情况下消防救援设备能持续可靠运行。\nEPS与UPS的核心区别：\n- 负载特性：EPS专供消防负载（电动机类感性负载+照明类负载混合），对输出波形和电压暂态精度要求略低于UPS但对冲击性负载（电机起动）短时过载能力强（可承受120%额定容量持续60s，150%额定容量持续10s）。但消防泵不是变频启动，EPS至电机的线路较长且电机启动电流可达7Ie，EPS需要容量考虑启动倍数（配置容量需考虑电机启动倍数的叠加）。\n- 切换时间：EPS切换时间标准要求≤0.25s（EPS由市电旁路供电+充电器浮充电池，当检测到市电失电时，逆变器立即启动并切换继电器至应急供电模式）。0.25s保证了消防应急照明（GB 17945要求应急照明灯具转换时间≤0.25s）和消防控制室设备不因消失时间过长丢失数据或误动作（但EPS切换时间在设计上小于0.25s（最快<0.1s））。\n- 运行模式：EPS日常处于市电旁路直通方式+充电器给蓄电池组浮充，EPS始终处于热待机状态（逆变器不工作处于停机状态但控制系统准备就绪，相比UPS双变换在线工作）。在市电正常时，EPS的逆变器不工作（不常开），而UPS双变换在线式逆变器始终工作逆变供电（常态节能EPS优于UPS）。当市电中断，EPS控制板快速启动逆变器（DC/AC转换+电池组输出400/230V）并通过切换继电器（EPS的切换电器为接触器/继电器，其切换时间≤0.25s可满足消防标准）。\n- 负载维持时间：消防规范要求EPS应急供电持续≥90min（一类高层建筑根据项目类型不同要求90分钟~180分钟）。电池配置：铅酸蓄电池为主，近年来部分EPS厂家开始采用磷酸铁锂电池，但消防认证仍以铅酸为主。\n主要参数：容量2.2~500kW（按消防负荷计算，持续30~180min），电压等级AC380V三相/AC220V单相，充电时间<24h充满，逆变切换时间≤0.25s（满足GB 17945消防应急照明和疏散指示系统标准），逆变器输出波形失真≤5%，动态电压瞬变±10%（1个周波恢复）。\n标准：GB 17945消防应急照明和疏散指示系统、GB 51309消防应急照明和疏散指示系统技术标准、GB/T 16806消防联动控制系统（含消防应急电源性能要求）。", module:"m7", submodule:"7.4 UPS/EPS", related:["→ 关联：规范与标准 §8.5 — GB 50303施工验收规范"] },
  { id:"2608", title:"GB 50054低压配电设计规范", tags:["GB50054","低压配电"], content:"GB 50054《低压配电设计规范》是低压配电工程设计的最基本国家标准，规定了低压配电系统的设计原则、设备选择、导体选择、配电装置布置、保护配合等方面的技术要求。本规范适用于新建、改建和扩建工程中交流1000V及以下、直流1500V及以下的低压配电设计。\n核心要求：(1)配电装置布置——配电柜前方操作通道（双面布置柜体面对面//单列布置柜体固定面墙面）：固定式柜前操作通道≥1500mm（柜体单列柜前1500mm+固定面墙），抽出式柜前操作通道双列面对面≥2000mm、单列靠墙≥1500mm。后方维修通道（柜后维修/墙间距）：柜后壁与墙之间净距≥1000mm，控制设备背后≥800mm。这些净距保障了操作人员安全操作维护间距避免触电。（2)导体选择：按载流量（IEC 60364电缆载流量表）选择导体截面，同时需校验电压降（≤5%，即低压配电线路末端电压损失不超过额定电压的5%）和短路热稳定（最小截面S≥I_k×√t/K，热稳定系数与导体材质和绝缘相关）。中性导体N截面与相线相同（当相线截面≤16mm²铜或25mm²铝时），当相线截面大于16mm²铜/25mm²铝倍时N线截面可适当减小但不得小于相线的50%。保护接地导体（PE）和PEN线截面也有相应规定。\n(3)保护配合——过负荷保护：配电线路的过负荷电流-时间特性必须满足反时限特性（I²t曲线），保证负载电流超过导体载流量的一定倍数时保护电器在规定时间内切断电路。短路保护：预期短路电流下开关设备的分断能力≥安装处预期短路电流，并在规定时间内切断。保护配合的核心准则：上下级保护电器的动作选择性（级联/选择性保护）——上级保护电器在故障时不应在下一级保护范围（负荷侧）故障时越级跳闸优先选择性跳闸。末端回路采用微断MCB，分支回路采用MCCB塑壳断路器（带电子脱扣器带LSIG保护曲线设定）或熔断器组，进线采用ACB框架断路器带保护单元。\n(4)配电柜的防护——配电柜防护等级≥IP2X（手指防触电），户外≥IP54（防尘+防溅水）。配电柜内部金属带电部分绝缘处理、安全净距尺寸、绝缘支撑件爬电距离均需满足。\n标准版本：GB 50054-2011（现行版，2011年发布，2012年6月实施），替代旧版GB 50054-95。配套的工程建设国家标准电气图集参见国家建筑标准设计图集《常用低压配电设备安装》和系列图集。与GB 50052（供配电系统设计规范）、GB 50055（通用用电设备配电设计规范）、GB 50058（爆炸危险环境电力装置设计规范）等设计规范配合使用，构成完整的低压配电设计标准体系。", module:"m7", submodule:"7.5 设计规范", related:["→ 关联：规范与标准 — 完整的标准体系"] },

  { id:"2701", title:"GB 50052供配电系统设计规范", tags:["GB50052","负荷分级"], content:"GB 50052《供配电系统设计规范》是电力工程设计的基本国家标准，规定了供配电系统设计的基本原则、负荷分级及供电要求、电源系统、电压等级选择、电能质量要求等。是GB系列标准中供配电设计的基础性技术法规。\n负荷分级（按对供电可靠性的要求和中断供电在经济/政治/公共安全上造成的损失程度分类）：(1)一级负荷——中断供电将造成人身伤亡、重大设备损坏、重大经济损失、重大政治影响（如大型医院手术室、大型金融数据中心、机场指挥塔、大型体育场馆比赛厅等）。供电要求：两个独立电源供电（来自两个独立的变电站或同一变电站的不同母线（进线分段））、必须配置应急电源（UPS/EPS/发电机）。特级重要电力用户（一级负荷中特别重要的负荷）：在上述双重电源供电基础上，还必须增加独立于正常电源的应急电源（柴油发电机或蓄电池EPS/UPS），且应急电源的负荷切换时间需满足设备允许中断供电时间的要求。(2)二级负荷——中断供电将产生较大经济损失、造成公共场所秩序混乱（如大中型商场、高层住宅、普通医院、重要实验室等）。供电要求：两回路线路供电（双回路供电，可由同一变电站的不同母线或同一母线分段供电），条件受限时可专线架空电缆供电。(3)三级负荷——不属于一级和二级的一般电力负荷，无特殊供电要求（普通居民、一般办公、车间辅助电气及不属于一二级的各类普通电气设备），允许单回路供电。\n电压等级选择：配电电压优选10kV（北方有些地区特别是矿业保留6kV电压——6kV系统）、20kV（上海等大城市推广）、35kV及110kV（根据区域供电网络统一规划）。(1)同一地区及同一规划区内电压等级应统一；(2)高压伸入负荷中心，减少配电级数降低线损（低压配电半径一般不宜超过250m）。接地系统形式：TN（TN-C/TN-S/TN-C-S，电源端中性点直接接地+设备外壳接PE/PEN）、TT（设备独立接地）、IT（中性点不接地或经阻抗接地，用于对供电连续性要求特别高的场所（如矿山/医院手术室/重要试验室）)。\n电能质量：要求供配电系统设计满足各种电能质量指标（频率偏差、电压偏差/波动/闪变/谐波/三相不平衡）在GB/T相关标准范围内。如有大容量谐波源应配置谐波治理或隔离措施。\n配套规范体系：GB 50052-2009（现行版本，2009年发布，替代95版）。涉及设计文件中引用该规范中的负荷等级划分、供电方式选择、电能质量标准适用时，需结合GB 50054/GB 50016/GB 51348等完成全套的设计逻辑。", module:"m8", submodule:"8.1 国家标准", related:["→ 关联：电力系统 §2.4 配电系统、项目与方案 §10.1 设计方案"] },
  { id:"2702", title:"GB 50060高压配电设计规范", tags:["GB50060","高压配电"], content:"GB 50060《3~110kV高压配电装置设计规范》规定了3~110kV交流高压配电装置设计的基本要求，包括配电装置的型式选择、安全净距、导体和设备选择、配电装置布置、对建/构筑物的要求等。适用于发电厂和变电站工程中3~110kV高压配电装置的设计。室外配电装置的安全净距（A1值，相-地/相-相最小空气间隙）：3~10kV→200mm，35kV→400mm，66kV→650mm，110kV→1000mm（中性点直接接地系统）/900mm（中性点不接地系统）。不同相导体间（A2值）在上述数值基础上再加裕度。\n配电装置型式：根据环境条件和占地面积需求选择，包括户内配电装置（开关柜/手车柜/固定柜，柜体柜深根据断路器形式/电缆进出线方式确定），户外AIS（空气绝缘敞开式，用支持绝缘子+软导线/管母线）+断路器+隔离开关支柱绝缘子上方钢芯铝绞线构架布置，GIS（SF6全封闭气体绝缘组合电器户外安装）。在土地资源紧张的城区、变电站对电磁辐射敏感区、强污染、高海拔、重污秽地区，宜优先选用GIS或户内布置方案。\n导体选择：载流量按最高允许工作温度+综合校正（环境温度/日照/风速/多回路并列/敷设条件综合校正系数，绝缘导线及封闭母线还需考虑散热）。短路热稳定校验（短路电流热脉冲I²t小于导体及连接件允许承受的耐受电流值）。\n配电装置的布置间距必须满足有序停电检修（设备搬运通道，断路器等设备抽出搬运空间及起吊要求）、操作巡视维护的最小间距和通道宽度。GB 50060-2008与相关行业规程（如DL/T 5352高压配电装置设计规程、DL/T 5218-2009220kV~750kV变电站设计技术规程对应更高电压等级的设计要求。", module:"m8", submodule:"8.1 国家标准", related:[] },
  { id:"2703", title:"DL/T 5153火力发电厂设计规范", tags:["DL/T5153","火力发电"], content:"DL/T 5153《火力发电厂厂用电设计技术规定》是关于火电厂厂用电系统设计的行业标准。适用于汽轮发电机组容量12MW及以上的火力发电厂厂用电系统设计。\n厂用电接线：(1)高厂变供电——发电机出口通过高厂变（高压厂用变压器）从发电机-变压器组之间分支引接，为厂用6kV/10kV母线供电；当发电机停机时，通过启动/备用变（起备变）从电网反送电作为厂用替代电源。厂用电母线按锅炉/汽机/公用系统/输煤/除灰等机组分段，每台机组设两段厂用母线（互为备用或手动切换）。(2)低压厂用电——从6kV/10kV母线经低压厂用变压器至400V/380V低压母线。低压厂用PC（动力中心）母线采用单母线分段，MCC（马达控制中心）从PC供电。重要负荷（如汽轮机润滑油泵、给水泵润滑油泵、EH油泵、DCS电源、事故保安电源）应双电源供电（自动切换）。(3)事故保安电源——快速启动柴油发电机组（15s内自动启动并加载到额定电压）作为全厂停电时交流保安负荷（汽轮机和给水泵等的盘车电机、旋转油泵、UPS、DCS控制和仪表电源、消防应急负荷等）的应急供电电源。蓄电池组直流系统（110V/220V DC）为开关分合闸、保护、控制系统、事故照明提供电力（充满电的蓄电池可在全厂失电情况下维持控制保护系统供电1~2h）。\n变压器选择：高厂变/起备变容量＝厂用负荷同时率系数×总负荷。典型选择原则：高厂变容量按厂用电负荷计算成果的10%裕量再叠加余量。低压厂用变压器优先采用干式变SCB系列。(2)厂用电压：高压厂用电电压等级定为6kV（200MW以下机组）或10kV（300MW及以上机组），低压厂用电采用380/220V三相四线制。\n电缆选型：动力电缆采用阻燃型交联聚乙烯XLPE绝缘电力电缆（ZR-YJV系列），重要回路（消防/保安/控制保护等）采用矿物绝缘防火电缆（BTTZ/RTTZ）或低烟无卤阻燃耐火电缆（低烟无卤WDZB/ZA系列）。\n标准：DL/T 5153-2014（现行版本）。与DL/T 5218、GB 50660大中型火力发电厂设计规范、DL/T 5041火力发电厂厂内通信设计技术规定配套使用。", module:"m8", submodule:"8.2 行业标准", related:[] },
  { id:"2708", title:"DL/T 5202电能量计量系统设计规范", tags:["TMR","关口计量"], content:"DL/T 5202《电能量计量系统设计技术规程》是关于电厂和变电站电能量计量系统（也称TMR，Tele Meter Reading System）设计的行业标准。TMR系统由电量采集终端（ERTU电能采集终端/多功能关口电能表）、通信网络和主站系统组成，实现对电厂上网电量、网间交换电量、下网电量等关口计量点的电能数据的自动采集、处理和统计分析。\n关口计量点(出线或主变高压侧用于计量贸易结算的发/用电量。关口计量表计精度通常要求0.2S级或0.5S级（有功电能表精度，0.2S优于0.5S。S表示特殊用途电能表，需满足宽量程(1%In~Imax)低负载下仍保持高精度要求)。关口电能表如兰吉尔ZMG405/Red JL931、威胜、科陆电子等，目前逐步为数字化电能表+合并单元的数字式计量方式（IEC 61850数字采样）。PT/CT精度：计量用电压互感器PT准确度0.2级/0.5级，计量用电流互感器CT准确度0.2S/0.5S级，并满足二次压降限值（计量PT二次回路压降不超过额定二次电压的0.25%）。\n系统架构：各关口计量点电能表（RS485/DL/T 645规约输出电度量）→ERTU（电量采集终端，采集多块电能表每15分钟冻结的电能量数据，集中打包）→调度数据网（专用网络或拨号/4G背靠背通信）→调度端主站系统（完成归集/存储/处理，并传输至交易中心和结算系统）。(2)数据周期：电量数据采集周期15min（满足电力市场结算要求），电量数据保存≥1年，主站可完成统计分析、线损统计、母线平衡分析、网损计算。\n标准：DL/T 5202-2016（现行版，替代旧版2004）、DL/T 645多功能电能表通信规约（目前广泛应用的为DL/T 645-2007，是TMR系统数据通信帧格式和数据结构基本规范），以及GB/T 17215.321交流电测量设备特殊要求第321部分：静止式有功电能表（0.2S级/0.5S级）精度等级考核标准。", module:"m8", submodule:"8.2 行业标准", related:[] },
  { id:"2704", title:"国家电网企标Q/GDW", tags:["Q/GDW","国网企标"], content:"Q/GDW系列是国家电网公司企业标准，对电气设备技术条件、配电网设计、变电站建设、智能电网技术、继电保护及安全自动装置等领域的技术指标和功能要求进行了细化规定，是国家电网公司系统内设备招标和工程设计的技术依据（在国网项目中具有强制效力）。\n主要标准分类：(1)设备类——Q/GDW 11220智能变电站继电保护技术规范（规范了智能变电站保护装置与合并单元/智能终端之间的接口及GOOSE/SV配置要求）、Q/GDW 11005柱上开关技术规范（适用于配网10kV柱上SF6和真空断路器、负荷开关）、Q/GDW 11612配电自动化终端/子站标准化设计技术规范（统一规范DTU/FTU/TTU硬件接口尺寸/通信协议/数据模型及SCADA相关性能指标）。(2)设计类——Q/GDW 11260配电网规划设计技术导则（指导地市/县级配电网网架规划和供电安全准则）、Q/GDW 156高标准农田配套电网建设技术导则（适用于电力接入和农田水利配套）、Q/GDW 121国家电网公司配电网工程典型设计（包括10kV架空线路/电缆线路/配电站房/箱式变电站典型设计图集和应用方案）。(3)技术规范通则——Q/GDW 10001智能变电站技术规范（整体站技术原则含三层两网等）。(4)网络安全与信息——Q/GDW 11224电力监控系统网络安全防护要求。\n新能源并网要求：Q/GDW 12197光伏电站接入电网技术规定、Q/GDW 1392风电并网调度运行管理规定。\n特高压：Q/GDW 144特高压交流输电技术标准体系、Q/GDW 145±800kV特高压直流输电工程系统研究内容深度。\nQ/GDW标准体系与国家/行业标准的关系：在国家/行业标准（GB/DL/T）基础之上，结合国网公司实际运行经验和设备运行可靠性管理更高要求，提出更严格的技术参数和设备质量保障（出厂试验例行、选型、型式试验、监造以及抽检等相关细则），Q/GDW通常是国网电气设备招标技术规范的依据（需纳入技术规范书）。", module:"m8", submodule:"8.3 国网企标", related:["→ 关联：项目与方案 §10.3 国网项目流程"] },
  { id:"2705", title:"IEC 61850变电站通信标准", tags:["IEC61850","GOOSE","智能站"], content:"IEC 61850《变电站通信网络和系统》是国际电工委员会发布的变电站自动化系统通信标准，也是智能变电站通信体系的核心技术基础。IEC 61850实现了不同厂家二次设备（保护/测控/录波/计量/PMU/合并单元/智能终端等）之间的互操作性和即插即用。\n三个核心通信服务：(1)GOOSE（Generic Object-Oriented Substation Event，通用面向对象变电站事件）——用于高速传输跳闸合闸/联闭锁/状态开入开出等间隔层设备间的状态信息和跳闸指令。通信采用多播发布/订阅模式+重发机制（T0瞬发+快速重发T1（2ms）+ T2（4ms）+ T3（8ms）+ T4逐渐减慢至稳态心跳T0（1000ms））。跳闸信号传输延时<3ms（满足继电保护速动性要求——从发送到接收的端到端时间不超过3ms）。(2)SV（Sampled Value，采样值）——过程层合并单元将ECT/EVT（电子式互感器）或常规互感器经采集器采集的电压电流瞬时值利用IEC 61850-9-2的采样值映射到以太网帧，发送至间隔层的保护/测控/录波/计量等装置（数据帧的采样计数器以及数据的有效品质标示用于接收端判断数据的同步性及数据有效性）。采样频率：保护用80点/周波（4000Hz，用于工频电流的稳态和暂态保护如距离差动保护等算法；IEC 61850-9-2LE定义80点/周波为保护应用推荐格式），电能质量/计量用256点/周波（12800Hz，用于谐波分析和计量精度）。通信采用发布/订阅模式，通过IEEE 1588精确时间协议（PTP，Precision Time Protocol，网络对时精度可达1μs以下）实现全站采样同步，替代传统CT/PT模拟电缆和同步对时硬接线。(3)MMS（Manufacturing Message Specification，制造报文规范）——基于TCP/IP的客户端/服务器模式，用于站控层与间隔层之间的通信（监控后台上送全站实时遥测遥信、下发遥控指令、定值下装、录波数据读取、装置参数配置等）。MMS在TCP/IP以太网上映射到OSI应用层。\nSCD配置描述：IEC 61850-6定义了SCL（Substation Configuration Language，变电站配置描述语言），基于XML的变电站系统配置文件。全站配置流程：智能变电站系统配置器将全站ICD（IED能力描述文件 IED各厂家提供）→SSD（变电站一次系统一次接线拓扑）+ CID（设备）→SCD全站系统配置文件(含全站GOOSE和SV发布/订阅信息、通信网络参数和装置实例信息)。\n标准版次：IEC 61850 Ed1.0（2003年发布，奠定智能变电站通信基础和三层两网体系）、Ed2.0（2010年修订，新增强健的GOOSE重传机制、采样值冗余链路恢复、电站自动化安全扩展要求等内容）、Ed3.0（面向未来泛在电力物联网/能源互联网方向的扩展，增加分布式能源DER、储能、电动汽车充电站、STATCOM等电力电子设备对象建模）。国内对应标准：DL/T 860（IDT IEC 61850）系列标准。", module:"m8", submodule:"8.4 国际标准", related:["→ 关联：电气自动化 §3.5 工业通信、电力系统 §2.6 继电保护"] },
  { id:"2706", title:"GB 50303建筑电气施工验收规范", tags:["GB50303","施工验收"], content:"GB 50303《建筑电气工程施工质量验收规范》规定了建筑电气工程（含变配电室、供电干线、电气动力、电气照明、备用不间断电源、防雷接地、弱电智能化系统等的电气安装部分）的施工质量要求和验收标准。适用于工业与民用建筑工程中电气分部工程的施工质量验收，是建筑工程整体质量验收（GB 50300系列标准）的重要组成部分，是电气工程竣工验收的强制性技术文件依据。\n主要验收内容：(1)变配电室——变压器、高低压柜、母线槽安装。验收要点：设备基础型钢接地（扁钢截面≥100mm²）、柜体垂直度（每米偏差≤1.5mm）、绝缘测试（低压≥0.5MΩ，高压按DL/T 596标准执行）。变压器安装后，需完成冲击合闸试验（新装变压器应进行5次冲击合闸，且第一次受电后持续运行时间不应少于10min，检查励磁涌流值衰减及保护装置动作情况）。(2)电气动力——电机试运转（空载/负载）、电缆敷设、桥架安装。电机试运转前检查绝缘电阻（≥1MΩ/1kV，最低≥0.5MΩ）、转向、空载电流平衡。电缆沟/桥架安装验收包括金属桥架可靠跨接接地、防腐层完好。(3)照明——灯具、开关、插座安装相序及绝缘测试、接地可靠性。并核对每回路绝缘（导线间/导线对地绝缘≥0.5MΩ）、漏电保护RCD动作特性（额定剩余动作电流30mA/100mA/300mA 脱扣时间<0.1s）、灯具固定（吊灯灯具质量≥3kg时，应预埋吊钩或螺栓）。(4)防雷接地——避雷带引下线截面积（圆钢≥φ8mm明敷或φ10mm？实际为热镀锌圆钢φ12mm直埋、-25mm×4mm镀锌扁钢）、接地电阻值≤设计值（综合接地体满足接地电阻≤1Ω）。(5)智能化布线——弱电线缆与强电线缆平行间距和交叉间距（电源线与信号线最小平行净距/穿管屏蔽要求受具体工程条件约束）、智能化设备接地及等电位连接、屏蔽接地等。\n隐蔽工程验收（电气工程关键质量控制节点，必须在掩埋/封闭前完成验收并签单）：防雷接地引下线焊接/接闪器/等电位连接排→接地电阻测试（满足≤设计值）。\n标准：GB 50303-2015（现行版本，适用建筑电气装置分部工程的检验批/分项/分部工程验收），配合GB 50300建筑工程施工质量验收统一标准的验收流程规定。", module:"m8", submodule:"8.5 施工验收", related:["→ 关联：工业电气成套 §7.5 设计规范、弱电与智能化"] },
  { id:"2707", title:"GB/T 4728电气简图用图形符号", tags:["GB/T4728","电气制图"], content:"GB/T 4728《电气简图用图形符号》标准（IDT/等同采用IEC 60617标准）规定了绘制电气系统图、电路图、接线图和功能图等简图时所使用的统一图形符号。对于电气工程设计、绘图、技术交流、文档编制和设备标识的标准化具有重要意义，同一个符号在不同国家可能有不同变形，但在采用IEC标准的中国电气图纸中已高度统一。\n符号分类（GB/T 4728共13个部分，其最常用的分类符号类别大致如下——\n(1)限定符号和常用符号要素——基本线型、端子极性（+/-）、接地符号、屏蔽。\n(2)导线、连接件和电路——导线、端子和线路分支接点、连接件（插头/座/端子排/电缆连接盒）。\n(3)开关、控制和保护器件——断路器符号（一般符号、带自动脱扣、具有过流/过压/分励脱扣标注的断路器）、隔离开关（开启式/单断——隔离器、隔离开关）、接触器（主触头/辅助常开常闭触头）、继电器（线圈/触点）、熔断器、各个类别保护装置符号（热继/过流/过压/欠压/差动等）。\n(4)电阻器、电容器、电感器和变压器——电阻器（固定、可调、滑线变阻、热敏电阻）、电容器（普通/极性/可调/微调/穿心/温度补偿电容器）、电感器、变压器符号（双绕组/三绕组/自耦/互感器/星三角连接标注）。\n(5)半导体器件和电子管——二极管（普通/稳压/隧道/肖特基/发光/LED/光电）、晶体管（NPN/PNP 双极型，N沟/P沟 JFET/MOSFET）、晶闸管（单向/双向/可关断/光控可控硅）、运算放大器、门电路符号（AND/OR/NAND/NOT/异或门及功能复杂组合逻辑器件功能框符号，依据IEC 60617-12和第13部分二元逻辑/模拟器件的图形符号规则进行功能描述）。\n(6)电能的发生和转换——发电机/电动机符号（三相/单相、交流/直流、绕线/鼠笼、同步/异步、发电机/M/G和旋转电机功能框GB/T 4728.6变压器和电抗器的补充符号均可适用）、变流器、蓄电池。(7)电信及其他领域专用符号（如天线/放大器/滤波器/传输路径/交换系统/传感器触发电极/功能框等）。\n制图原则：电气图应层次清晰（系统图/布置图/原理图/接线图/电缆清册/端子排图按层级展开）。CAD绘图软件（EPLAN/AutoCAD Electrical/天正电气/中望电气）均配备国标图库，按GB/T 4728的符号字体标准化绘图。\n标准版本：GB/T 4728.1~13,IDT IEC 60617（系列标准，包含GB/T 4728所有13个技术部分的标准号），最新修订版保持与IEC 60617新版同步。电气制图工程师应掌握其中的主要常用符号并持续对照新版本（EPLAN/ AutoCAD Electrical内置的GB符号库更新需要跟进最新IEC 60617标准更新的符号修改。", module:"m8", submodule:"8.6 制图标准", related:["→ 关联：项目与方案 §10.1 设计方案图纸绘制"] },

  { id:"2801", title:"特高压GIS", tags:["特高压","GIS","1100kV"], content:"1100kV GIS（Gas Insulated Switchgear，气体绝缘全封闭组合电器）是目前世界上电压等级最高的GIS产品，核心用于特高压交流输电工程（如1000kV特高压交流试验示范工程——晋东南-南阳-荆门、淮南-南京-上海1000kV特高压交流工程等特高压骨干网架）。\n核心参数：额定电压1100kV，额定电流6300A，额定短路开断电流63kA，SF6气体额定压力0.6~0.7MPa，绝缘水平（雷电冲击耐压2250kV/工频耐压960kV，操作冲击耐压1800kV）。\n技术特点：超长断口的断路器（双断口/四断口串联）灭弧室结构+大功率液压弹簧操动机构，双断口或四断口结构开断SF6灭弧，大型绝缘件（环氧浇注盆式绝缘子/支撑绝缘子）和长行程绝缘拉杆设计和制造要求极高。GIS全封闭SF6绝缘，不受大气环境（污秽、结冰覆冰、高海拔、强风沙）影响，直接接至主变压器/高压电抗器/架空出线套管。\n目前国内具备1100kV GIS供货能力的企业：中国西电、平高电气（已掌握双断口/四断口）和新东北电气（与ABB技术合作）。国网特高压GIS招标格局基本稳定，中标方按批次约为中国西电、平高电气和新东北电气及山东电工电气等，国电南瑞（南瑞继保）在特高压二次设备和断路器保护控制方面有较大份额。\n标准：GB/Z 24843特高压设备标准系列、IEC 62271-203高压开关设备和控制设备第203部分：额定电压52kV及以上气体绝缘金属封闭开关设备。", module:"m9", submodule:"9.1 高压开关产品", related:["→ 关联：电力系统 §2.2 输电系统"] },
  { id:"2802", title:"252kV高压开关", tags:["SF6","断路器","252kV"], content:"252kV高压开关（含SF6罐式断路器和GIS）广泛应用于220kV变电站，作为进出线/母联/分段/主变进线等回路的控制和保护设备。\n252kV罐式SF6断路器——瓷套管/复合套管出线（罐式断路器将灭弧室和电流互感器封装在接地的钢罐壳体内，是耐地震能力强、适合高寒/高海拔/重污秽地区的防震型断路器）。配用弹簧/液压弹簧操动机构（弹簧操动机构结构简单可靠性高，操作功耗小。液压弹簧操动机构出力大、机械特性稳定，适合252kV开关的高操作功要求）。额定电流3150/4000A，额定短路开断电流50kA，额定短路耐受电流3s。SF6气体额定压力0.6MPa（20℃表压）。\n252kV GIS——额定电流4000A/6300A，开断电流50kA/63kA。间隔回路包括断路器+隔离开关/接地开关+电流互感器+电压互感器+快速接地开关+SF6/空气套管。国内主要生产商：中国西电(XD)、平高电气（PG）、新东北电气（NHVS）、泰开高压（TK）、河南平芝（PZY，平高与东芝合资）等。\n新发展趋势：252kV真空断路器正在研发和逐步试点——真空开断可完全避免SF6温室气体的使用（SF6的GWP（全球变暖潜值）是CO₂的25200倍，SF6气体在电力开关设备中的排放问题是行业关注的环保议题，工信部正在逐步推动中高压环保开关设备——真空开断+固体绝缘/干燥空气绝缘方案）。", module:"m9", submodule:"9.1 高压开关产品", related:[] },
  { id:"2803", title:"126kV高压开关", tags:["126kV","GIS"], content:"126kV GIS/罐式断路器是中国110kV电压等级变电站最主流的开关设备（110kV是我国区域配电网和大型用户变电站的常用电压等级）。产品设计已高度系列化、标准模块化，不同厂家126kV GIS间隔宽度尺寸约0.8~1m，额定电流2000/3150A，开断电流40kA。\n126kV GIS一个间隔典型配置：进线间隔（断路器/隔离开关/CT/VT/接地开关/快速接地开关/出线套管）；主变进线间隔（断路器/隔离开关/CT/接地开关/连接变压器）；母设间隔（隔离开关/快速接地开关/接地开关/电压互感器）；母联/分段间隔（断路器+隔离开关+接地开关）；出线间隔（断路器/隔离开关/CT/快速接地开关/出线套管）；备用间隔和过渡母线/分段扩展接口。\n126kV罐式SF6断路器：额定电流3150A，开断40kA。126kV三极机械联动操作，配弹簧操动机构。\n可靠性：GIS的绝缘和灭弧核心部件全密封在0.45~0.6MPa SF6气体中，不受外界环境影响。GIS间隔的漏气率≤0.5%/年，机械寿命≥10000次操作（断路器主回路）或≥3000/5000次额定短路电流开断（电寿命）。\n126kV环保型GIS（洁净空气绝缘+真空开关）已有多家厂家推出（平高电气、正泰电气、山东电工电气、上海西门子开关等逐步试点应用，以响应绿色电网建设号召，温室气体SF6替代逐步推进）。\n标准：GB 1984高压交流断路器、GB 7674六氟化硫封闭式组合电器、IEC 62271-100高压交流断路器。", module:"m9", submodule:"9.1 高压开关产品", related:[] },
  { id:"2809", title:"真空断路器VS1", tags:["真空断路器","VS1"], content:"VS1型真空断路器是12kV户内开关柜（KYN28中置柜）最广泛使用的真空断路器。VS1将真空灭弧室+绝缘拉杆+上下出线导电回路通过APG自动凝胶工艺（环氧树脂+固化剂+填料混合浇注/凝胶）固封在环氧树脂中，形成极柱结构(固封极柱，Solid Insulated Pole)。绝缘水平高、抗凝露、抗污秽、零件数量少可靠性高。\n操动机构：(1)弹簧操动机构（VS1断路器标准配置）——储能电机给合闸弹簧储能，合闸时弹簧能量驱动凸轮机构带动真空灭弧室动导电杆合闸（合闸弹簧释放能量，同时带动分闸弹簧储能），合闸同时分闸弹簧储能使断路器处于准备分闸随时可能状态。失电情况下手动储能手柄储能+手动合分闸操作，可作用于紧急操作。弹簧操动成本适中、操作功耗低、寿命可靠。(2)永磁操动机构——利用永磁体保持在合闸/分闸位置（不需要保持机械脱扣和锁扣装置），通过分合闸线圈改变磁场方向实现操动。主要特点：零件数少（仅20多个运动件相比弹簧机构的200多个零件）、寿命长（可达10万次以上机械寿命）、可靠性高，但价格较高需配置充电控制器+超级电容/蓄电池。目前逐步推广但尚未完全替代弹簧操动。\n关键参数：额定电压12kV，额定电流630/1250/2000/3150A（至3150A / 4000A（VS1-12/6300-63大容量断路器）），额定短路开断电流25kA/31.5kA/40kA（标准型），机械寿命弹簧机构30000次（永磁机构≥100000次），电寿命（开断额定短路电流能力30~50次）。\n生产厂家：国产因VS1为全国联合设计产品，主流厂家有正泰电器、浙江紫光电器、库柏(宁波)和众多成套厂自主装配的VS1极柱搭配各品牌弹簧操动机构的方案，国内真空灭弧室知名品牌有宝光股份、旭光电子、华光等。ABB推出的VD4（真空断路器，配用ABB原装弹簧操动机构）在国内高端12kV开关柜（如UniGear ZS1）中是主要代表型号（VD4作为高端市场标杆产品，价格高于VS1）。", module:"m9", submodule:"9.1 高压开关产品", related:["→ 关联：工业电气成套 §7.1 — KYN28配VS1"] },
  { id:"2901", title:"特高压GIS市场竞争格局", tags:["特高压","市场格局"], content:"特高压GIS是电力设备技术难度最高、市场和政策壁垒最强的输变电主设备之一。国内具有1100kV GIS供货业绩的企业集中度高。\n主要参与企业：(1)中国西电（XD）——特高压GIS和变压器市场份额居于行业前列。西电西开电气设计制造特高压GIS设备，对特高压产品有较全面的试验运行业绩覆盖。隶属于中国电气装备集团。(2)平高电气（PG）——1100kV GIS、断路器、隔离开关等特高压开关类产品标准制造商，隶属于中国电气装备集团。(3)新东北电气（NHVS）——从ABB引入特高压GIS技术，是国内首个获得1100kV GIS型式试验制造厂，在国网特高压集中招标批次中有较多中标业绩。(4)山东电工电气（隶属于国家电网产业板块）——在特高压变压器铁心及开关部分产品具有竞争力，子公司山东日立等。\n合资/外资品牌：(1)ABB（HITACHI Energy/日立能源）——特高压GIS技术和产品处于全球领先地位，但有较高的本地化制造要求（在中国有合资公司如厦门ABB高压/重庆ABB等间接供货）。(2)西门子能源——高压开关设备（如SIEMENS Energy 3AE系列断路器/高压GIS）和中国西门子变压器，近年来在特高压领域和国网直接中标较少，主要以设备供应和技术合作为主。(3)三菱电机/东芝/日立——在跨国公司中均与国内开关设备企业有不同程度的合作或合资。\n竞争特点：(1)特高压GIS的投标高度依赖运行业绩——国网招标时要求投标方有已运行业绩+同容量型式试验报告，新入局者业绩门槛极高。(2)国网对GIS设备采用集中招标模式（年度批次+集中规模招标，按最高限价和商务技术评分决定中标候选排名）。(3)单间隔1100kV GIS价格数千万人民币，特高压GIS单间隔报价较高（百万至千万级按配置复杂程度有巨大差异）。(4)中国电气装备集团（由中国西电集团、平高集团、山东电工电气集团、许继集团、南瑞集团等重组整合而成）对GIS开关产业资源整合带来市场格局变化。", module:"m9", submodule:"9.2 高压开关市场", related:[] },
  { id:"2804", title:"储能PCS变流器", tags:["PCS","储能"], content:"储能PCS（储能变流器，Power Conversion System）是电化学储能系统的关键设备。我司（按行业一般产品）规划/自有品牌PCS产品序列通常覆盖50~3500kW功率范围，采用模块化设计（常见规格可选50kW/100kW/200kW/250kW/3450kW功率模块），通过模块化并联组成标准容量储能单元（如每台PCS由一个或多个功率单元+控制柜+交流滤波+开关柜组成）。\n直流电压范围：DC750~1500V（与磷酸铁锂电池簇电压匹配，1500Vdc体系是当前大储系统主流标准电压平台。直流电压范围宽有利于接更多电芯串联数量，降低电池簇并联电流及汇流复杂度，降低直流侧电缆损耗、提高储能系统效率。\n构网型控制（Grid-forming）：先进的储能PCS控制器实现构网型控制策略（P-f/Q-U下垂特性模拟同步发电机外特性，建立电压源特性。在弱电网或者离网场合下独立建立交流母线电压和频率。支持VSG（虚拟同步发电机）控制算法，参与电网一次调频和惯量响应（有功响应<30ms，无功响应<5ms）。具备黑启动能力（从电池储能系统零起建立微网电压及频率，分级恢复启动柴油发电机/风机/光伏微网等）。构网型储能PCS是新型电力系统储能的主要技术方向。\n通信与调度：PCS通过RS485/CAN/以太网与BMS和EMS/上位机通信，接收AGC或/和EMS功率调度指令（有功/无功参考值），上传运行状态信息与告警。电池侧绝缘监测（实时监测电池簇正/负极对地绝缘电阻，低于整定值时告警停机保护），并具备交流侧/直流侧过欠压保护、过频/欠频保护、过温保护、防孤岛保护等完备的安全保护功能。\n对比储能PCS与光伏逆变器：两者AC/DC拓扑均为VSC双向变流器，但储能PCS需支持电池充放电的频繁双向切换和并/离网模式切换（充/放电电压范围更能和电池电压匹配），光伏逆变器以MPPT控制组件输出和并网发电为主要功能（单向功率流）。\n标准：GB/T 34120电化学储能系统储能变流器技术规范、NB/T 42014电化学储能变流器并网性能测试规范。", module:"m9", submodule:"9.3 储能设备", related:["→ 关联：新能源与储能 §5.3 — PCS原理"] },
  { id:"2805", title:"预制舱式储能系统", tags:["预制舱","储能系统"], content:"预制舱式储能系统（Battery Energy Storage Container System，集成式储能集装箱）将电池模组、BMS、温控系统、消防系统、配电系统、辅助系统（照明/门禁/传感器/视频）等集成在标准尺寸的预制舱（20尺或40尺集装箱）内，在工厂内完成组装和全部系统联调试，运输到现场后仅需完成舱体就位+外部电缆连接+PCS汇流柜连接+EMS通信系统组网即可投运，极大减少现场施工量并缩短并网周期。\n典型配置：\n- 20尺标准集装箱储能系统：额定容量约2.5~5MWh（因所选电池pack串并联形式，根据电芯能量密度和系统机架排布方案决定），可容纳约8~12个电池簇（每个簇约200~400kWh，由几十节电芯串联，簇与簇之间隔离熔断器/直流断路器）。适用中小规模或分布式储能。\n- 40尺标准集装箱储能系统（适用于大中型新能源配储/独立共享储能/电网侧储能电站）：额定容量约5~10MWh。配套设备包含汇流柜、BMS主控（汇集各簇从控BMU的电压/电流/温度/SOC/SOH等数据，与PCS和EMS/站控系统通信）、温控系统和消防系统、辅助用电照明/排污等辅助系统。\n子系统：(1)电池模组系统——电池pack（电芯间>2mm间隙预留热膨胀+汇流排焊接+LFP电芯+阻燃绝缘片）通过汇流排（叠片铜排/铝排，表面绝缘包覆）串联/并联构成电池簇。每个模组带独立的从控BMU（采集电芯单体/并联单元的温度电压，具备通道式单体电池均衡功能和温度数据异常上送）。\n(2)温控系统——液冷：液冷机组（BTU）+液冷板（水冷板贴附在电池PACK底部或之间），冷却液（乙二醇水溶液25%~50%）通过液冷板与电芯热交换带走热量（液冷温差<3℃）。送风和回风风道引导冷却/加热气流经过电池模组进行热管理（电池电芯最佳工作温度范围15~35℃）。\n(3)消防系统——复合探测器（感烟感温+CO+H₂+VOC气体传感器/电解液泄漏探测，多级预警）+全氟己酮/七氟丙烷/气溶胶消防。消防分区：电池包内/电池柜/舱体内部管道。灭火后消防复燃预警及强制排风。\n标准与认证：UN 38.3（锂电池运输安全要求满足联合国危险品运输测试准则）、GB/T 36276（电力储能用锂离子电池）、GB/T 36548（电化学储能系统接入电网测试规范）、GB 51048（电化学储能电站设计规范）。美国/国际标准：UL 1973（储能电池安全标准），UL 9540（储能系统安全），NFPA 855（储能系统安装消防标准）。国内储能电站消防设计要求按GB 51048及国家能源局相关消防技术规范。", module:"m9", submodule:"9.3 储能设备", related:["→ 关联：新能源与储能 §5.3、电能质量治理 §6.7"] },
  { id:"2808", title:"开关柜智能操控装置", tags:["操控装置","开关柜"], content:"开关柜智能操控装置（Intelligent Switchgear Controller/Switchgear Intelligent Monitoring Device）是安装在高中压开关柜面板上的多功能控制监测模块，替代传统的单一功能元器件（如带电指示器、温湿度控制器、转换开关等），一体化集成了开关柜本地操作控制、一次模拟图动态显示、带电指示及闭锁、温湿度控制、人体感应智能照明、语音防误提示、RS485通信等多种功能。\n主要功能：(1)一次模拟图显示——开关柜一次接线图（主母线+断路器+隔离开关+接地开关+CT/VT+出线电缆等完整回路）面板上以LED或LCD动态模拟显示断路器和隔离开关的分/合闸状态（根据断路器手车位置（工作/试验/分闸/合闸）和接地开关的分合状态，通过采集辅助开关位置接点信号以LED或LCD图形断面变化和符号颜色变化实时呈现）。(2)带电指示——感应式高压带电传感器（与高压带电显示传感器配套（电容式分压传感器安装于母线侧/出线侧，检测线路带电状态），正常时各相LED指示灯亮表示对应相线带电（当三相或某一相未带电时对应相LED灭）。当线路带电时输出强制闭锁接点（闭锁电磁锁，防止带电合接地开关）。(3)温湿度控制——内置温湿度传感器（或外置线式温湿度探头置于开关柜电缆室/断路器室/母线室内），根据预设限值逻辑自动启停加热器（用于驱除凝露/防污秽/加热排湿）或排风扇降温。数据具备RS485 Modbus上传和后台分析。(4)人体感应——通过红外传感器检测柜前是否有人体接近，当有人靠近时自动开启柜内照明（LED灯板），人离开后延时熄灭，节能并与开关柜照明回路配合。(5)语音提示——当检测到操作（如接地开关合闸、手车位置变化）或误操作时，装置内置语音芯片播放提示（\"本回路已带电\"、\"请分接地开关\"等），辅助五防联动。\n通信：RS485接口+Modbus RTU规约接入后台监控系统，上传装置实时测量数据（温度/湿度/带电状态）和报警信息。\n智能操控装置已成为开关柜的标准配置（各类10~35kV户内开关柜），功能集成度高、节省柜面空间、简化接线。代表厂家和型号：珠海优特（UT系列）、深圳中电电力、石家庄科林、河南英特电气等。", module:"m9", submodule:"9.4 自动化设备", related:["→ 关联：工业电气成套 §7.1 开关柜"] },
  { id:"2806", title:"SVG静止无功发生器", tags:["SVG","无功补偿"], content:"SVG（Static Var Generator，静止无功发生器）是新一代动态无功补偿装置，采用MMC级联H桥或两电平/三电平VSC拓扑，无级连续可调发出容性或感性无功功率，产品系列容量覆盖±50kVar~±300Mvar。\n低压SVG（380V/480V/690V，单机±50kVar~±2Mvar）：采用模块化设计（如50~200kVar功率模块），三相三线/三相四线可选（用于三相四线制电能质量综合治理的SVG配备分裂电容或△型变压器使运行灵活），高速DSP+FPGA控制器，兼具谐波补偿（2~25次）、三相不平衡补偿和快速无功补偿（响应<5ms）。适用于工商业/商业楼宇/医疗/数据中心低压配电系统。\n高压SVG（6/10/35kV直挂，±1~±300Mvar）：采用链式H桥级联CHB拓扑，每相由N个H桥功率单元串联实现高压直接并网（无需升压变压器级联，单元数取决于并网电压等级）。35kV SVG每相约30~40个H桥单元+控制柜。阀组布置中每级的IGBT模块+直流电容器+控制板+取能电源在一个功率单元盒内。控制系统：主控柜+光纤分配柜（主控柜通过光纤与每个H桥单元通信——PWM占空比指令下发+单元状态/电压/故障信息回复）。(1)响应速度<5ms（从检测到无功变化到SVG完全补偿）。(2)无功从-100%~+100%连续无级可调（满足风电场/光伏电站快速AVC无功电压控制对SVG大步进连续调整能力的要求(3)具备有功谐波补偿和三相不平衡补偿的附加能力（部分容量用于滤波和平衡补偿）。链式SVG也常被称为STATCOM（Static Synchronous Compensator）或SVG+APF混合型。\n冷却方式：风冷（紧凑型，中小容量模块SVG常见，风机+散热器+IGBT单元热管散热）或水冷（大容量SVG（±50Mvar以上）内循环纯水+外循环水冷却塔/风冷散热器，IGBT通过水冷板+纯水冷却循环带走热量，散热效率高适合大功率）。\n标准：GB/T 20297静止无功发生器（SVG）功能和性能要求、GB/T 32823电网电能质量治理设备技术规范。代表制造企业：四方股份、特变电工新能源、许继电气、思源电气、盛弘电气、新风光电子、国电南瑞等。", module:"m9", submodule:"9.5 电能质量设备", related:["→ 关联：电能质量治理 §6.2 SVG原理、§6.6 MMC拓扑"] },
  { id:"2807", title:"有源电力滤波器APF", tags:["APF","有源滤波"], content:"APF（Active Power Filter，有源电力滤波器）产品系列覆盖三相三线/三相四线制低压配电系统（380V/400V/480V/690V），标准模块容量50~600A。通过多台APF模块并联可扩展补偿容量至3000A以上（适用于大容量谐波补偿要求的集中补偿方案）。\n核心拓扑：(1)两电平VSC（成熟拓扑，成本低适用于200A以下模块，输出谐波含量直接与载波频率和LCL滤波器有关）。(2)三电平NPC（Neutral Point Clamped，中点钳位型VSC拓扑）——较两电平拓扑输出谐波含量低（等效电平数3电平）、输出电压du/dt小（电机/变压器绝缘友好）、单管耐压要求减半、滤波电感减小。是目前50A~600A工业型APF模块主流拓扑方案。(3)SiC器件APF（碳化硅MOSFET替代Si IGBT）——开关频率可大幅提升至50~100kHz，无源滤波器尺寸减小70%以上、损耗降低、效率提升1%~2%。已进入商业化初期、成本高。\n补偿范围：(1)谐波补偿：2~50次（可设定补偿特定次，也可全补偿），谐波补偿效率>97%。(2)无功补偿：额定容量剩余部分可补偿无功功率。(3)三相不平衡补偿。补偿响应时间<10ms（全响应至额定补偿电流均值5%误差以内），谐波电流滤除率>95%（THDi降至<5%或更低，取决于APF容量与负载谐波电流的比值）。\n控制算法：(1)谐波检测：瞬时无功功率理论（p-q法、i_d-i_q法）→经同步参考坐标锁相环鉴相，分离零序/基波正序/负序电流分量→FFT提取基波及谐波分量。(2)电流控制：滞环PWM跟踪控制（响应快无延时不依赖负载参数但开关频率不固定对单管开关管通断寿命有影响）或三角载波线性控制（开关频率固定开关管频率恒定)。\n安装方式：APF并接在负载侧（PCC点，CT安装于负载电源进线回路、APF输出侧/负载侧的相应位置正确捕捉负载谐波电流分量，向系统与负载之间就地注入补偿电流）或安装在总进线柜集中补偿、分配电柜局部补偿。安装CT必须采用高精度电流互感器（精度0.5级以上）且次级不能开路。\n主要国产品牌：盛弘电气Sinexcel（专业电能质量厂商）、英博电气/英博新能源（中博电气）、深圳盛弘（行业份额领先）、苏州工业园区苏容/英威腾、诺企电气（上海诺企NQ APF）、国电南自/四方股份（各有APF产品线）。各大低压配电成套厂会配置竞争品牌的APF模块／整柜。\n标准：GB/T 37408有源电力滤波器技术规范、NB/T 10286有源电力滤波器性能测试规程。", module:"m9", submodule:"9.5 电能质量设备", related:["→ 关联：电能质量治理 §6.3 APF原理"] },
  { id:"2902", title:"阳光电源", tags:["阳光电源","逆变器","储能"], content:"阳光电源股份有限公司（实际控制人曹仁贤，总部安徽合肥）是全球光伏逆变器和储能系统龙头，2024年逆变器全球出货量超130GW（累计，含风能变流器、制氢电源、电化学储能PCS及集成系统、电站EPC等综合板块），储能系统出货量国内稳居前三。新能源电源变换和储能系统集成完整产品线。\n核心产品：(1)光伏逆变器——SG系列组串式（8~350kW全功率覆盖）、SG系列集中式（500kW~3.15MW功率覆盖）。最大效率≥99%（SiC器件）。广泛应用的地面电站组串式逆变器包含SG320HX（320kW，1500Vdc，最大效率99.05%，12路MPPT/每路2串）等高端大功率型号。(2)储能变流器PCS——SC系列模块化PCS（50~3450kW），支持构网型控制（Grid-forming）。直流电压范围DC750~1500V，模块效率≥99%。广泛应用于表前和表后储能系统。阳光电源储能集成系统（PowerTitan系列液冷储能系统/ST3435CP-3450储能逆变升压一体机/PowerStack工商业储能系统）在国内及海外市场有大量项目。(3)新能源电站系统集成——风电变流器、氢能（制氢电源、电解槽）、电站EPC、储能电站系统集成。\n全球布局：中国合肥总部+研发中心，海外在印度、泰国、巴西、欧洲、美国等设有生产工厂和销售服务中心。在光伏逆变器领域全球份额领先（连续多年全球逆变器出货量前二，与华为FusionSolar交替第一），储能PCS国内市场持续排名第一。\n核心竞争力：早期技术积累+持续大额研发投入、1500Vdc系统全产品线覆盖、集中式储能系统集成技术/项目交付经验、完善的全球售后服务网络和本地化制造。\n对标竞品分析：阳光电源组串式逆变器和储能PCS是公司主要竞品——技术路线领先、成本与服务、产品可靠性与智能化（PID修复+I-V曲线扫描+智能组串诊断等）方面需重点跟进。", module:"m9", submodule:"9.6 竞品对比", related:["→ 关联：新能源与储能 §5.1 光伏逆变器"] },
  { id:"2903", title:"宁德时代", tags:["宁德时代","LFP","储能电池"], content:"宁德时代（CATL，Contemporary Amperex Technology Co.， Limited，总部福建宁德）是全球动力电池和储能电池领域市场份额最高的公司。在动力电池领域（全球份额30%+），在储能电池领域（2024年储能电池出货量全球第一）。\n核心产品线：(1)储能电池——磷酸铁锂电芯（LFP）EnerOne/EnerC/EnerD系列（280Ah/306Ah/314Ah/560Ah+超大容量电芯逐步量产。最新技术的超大容量电芯已在宁德时代的工厂实现量产并可大批量循环寿命超过10000次@70%SOH EOL的储能工况）。(2)钠离子电池/凝聚态电池——宁德时代已推出第一代钠离子电池（160Wh/kg能量密度）和凝聚态电池（500Wh/kg航空级）用于多元储能应用场景。\n核心技术：(1)CTP（Cell to Pack，无模组电池包）技术——取消电池模组级结构，直接将电芯集成到箱体（成组效率提升15~20%，系统能量密度>180Wh/kg），已发展到CTP 3.0（麒麟电池，第三代CTP，全球首创电芯大面冷却技术，体积利用率最高达72%，三元电池系统能量密度255Wh/kg）。(2)长寿命电芯——储能专用电芯循环寿命达15000次（@70%SOH寿命终止条件）或20年日历寿命（7000次循环以上的电池保证在良好维护管理使用条件下能够维持储能电站设计寿命的电箱性能）。(3)BMS主动安全——基于AI的电芯热失控模型（依据异常特征（电压下降斜率/温度快速上升/内阻变化等）提前数分钟预警热失控可能）。\n全球布局：中国溧阳/宁德/青海/宜宾等生产基地+德国图林根工厂/匈牙利工厂（欧洲电池生产基地）。宁德时代（全球龙头）是各储能系统集成商和主要整车企业的核心电池供应商。\n竞争格局：与比亚迪（刀片电池/储能魔方Cube系列）、亿纬锂能、国轩高科、瑞浦兰钧（在储能电芯的技术和价格竞争加剧）等国内头部储能电池厂商存在激烈竞争。在储能电芯应用领域我司（作为系统集成商/设备制造商）重点关注宁德时代的电芯性能和供应链保障，同时关注第二梯队供应商（如鹏辉能源、海辰储能、楚能新能源等）的性价比较方案。", module:"m9", submodule:"9.6 竞品对比", related:["→ 关联：新能源与储能 §5.3 LFP电池"] },
  { id:"2904", title:"华为数字能源", tags:["华为","数字能源","FusionSolar"], content:"华为数字能源（华为技术有限公司旗下数字能源业务板块）是全球组串式光伏逆变器龙头企业（与阳光电源交替居全球逆变器出货量前二），并在数据中心能源、站点能源、车载动力、储能及综合智慧能源领域全面布局。\n核心产品和方案：(1)智能光伏FusionSolar——组串式光伏逆变器系列（SUN2000系列：户用（3~30kW、多路MPPT及优化器（优化器选配））+工商业（50~100kW）+大型地面电站（175~300kW+，支持大功率组件和双面组件+智能组串分断+MPPT精度业界领先）。最大效率99%以上，1500Vdc系统全线覆盖。逆变器带PID修复、智能I-V曲线诊断、拉弧检测（AFCI功能保证屋顶直流线缆安全）和组串级监控。通信方案支持4G/WiFi/MBTC（华为PLC电力线载波通信或RS485方案）。(2)数字能源管理平台FusionSolar——云平台（实时监控、智能诊断、远程运维、故障告警、统计报表。支持移动APP。发电量评估和自动告警分析以AI技术提效）。智能光伏优化器（组件级优化器支持组件级MPPT和快速关断，满足美国NEC 2017/2020快速关断要求）。\n(3)储能系统——LUNA2000智能储能系统（户用（5~15kWh）+工商业）+大型储能系统和PCS技术与华为数字能源的紧密合作但不如逆变器那样全面自研（数字能源自研储能BMS和系统控制，电池外采集成PACK，大型储能系统集成起步晚于阳光电源但近年集中式/大储领域取得较快出货）。(4)智能充电网络和电动交通动力总成——直流快充/超充模块、充电桩及充电站解决方案。(5)数据中心能源——UPS（不间断电源，模块化UPS），iCooling（数据中心智能温控系统，基于AI优化）、模块化数据中心。\n方案特点与竞争力：华为数字能源依托华为在通信信息领域、芯片/功率半导体（SiC器件研发/数字电源控制芯片）和AI（智能IV曲线、智能电网预测、AI热管理模型）上的深厚布局，在数字技术融合能源电力方面有领先能力，逆变器数字化、智能运维和安全管理方面具有较强优势。\n对标：在光伏逆变器领域组串式方案要密切关注华为的技术迭代和产品组合。华为在光伏逆变器领域的品牌效应、服务体系和智能云平台生态（FusionSolar）给客户提供了很高黏性。", module:"m9", submodule:"9.6 竞品对比", related:["→ 关联：新能源与储能 §5.1 光伏逆变器"] },
  { id:"2905", title:"ABB高压开关", tags:["ABB","高压开关","VD4"], content:"ABB（现电网业务已整合至日立能源Hitachi Energy，但ABB仍是自动化与电力设备的世界500强品牌）是全球电气设备高端品牌代表之一。在高压开关设备和配用电领域，ABB产品线以高品质、高可靠性在中高端市场具有很强品牌效应。\n核心电气产品：(1)真空断路器VD4——12kV户内固封极柱真空断路器（与国产VS1对标但质量定位和材料工艺要求更高）。配用ABB原装弹簧操动机构（可靠性高、机械寿命≥30000次），固封极柱为APG工艺（材料配方独特）。Emax系列框架断路器（E2N/E2S/E3/E4/E6系列等，1600A~6300A）、Tmax系列塑壳断路器（XT1~XT5/XT7，热磁/电子脱扣器可选）。\n(2)ETC系列开关柜（UniGear ZS1——12kV金属铠装中置开关柜，ABB中压开关柜中国销售主力）+iVD4中压智能化断路器（支持数据互联+温度在线监测）+ZX系列GIS（ZX2/ZX10（12~40.5kV）气体绝缘中压开关柜/充气柜）。UniGear ZS1在我国外资/合资高端中压配电项目中市占率高（许多大型数据中心/半导体厂房/商业综合体/地标建筑的开关柜都指定使用ZS1）。\n(3)中压气体绝缘开关柜（ZX2/ZX10 12~40.5kV）——SF6或干燥空气绝缘，免维护，抗恶劣环境（高海拔/凝露/污秽/低温）。体积小适合空间受限场景。\n市场定位：ABB高压开关和配电产品在高端市场以性能稳定、操作机构寿命长、零件装配精密和全寿命周期运维成本低受到用户青睐（价格偏高）。对标分析：我司可对标ABB的开关柜/断路器在以下几个差异化定位：(1)适度的价格性能平衡；(2)国产化配套产业链优势（供货周期短/本地化响应快）；(3)关键技术对标VD4的弹簧操动可靠性和固封极柱工艺配方、绝缘性能、机械寿命；VS1对标VD4逐步提升可靠性，缩小差距。", module:"m9", submodule:"9.6 竞品对比", related:["→ 关联：产品知识库 §9.1 我司高压开关对标"] },
  { id:"2906", title:"台达电子", tags:["台达","UPS","PLC"], content:"台达电子（Delta Electronics，总部台湾台北）是全球电源管理与工业自动化领导厂商，在工业电源、UPS、PLC、变频器、伺服驱动、工业通信、视觉检测、工业机器人等自动化领域提供完整的产品线。在全球开关电源市场占有最大份额。\n核心产品和优势：(1)UPS不间断电源——台达UPS产品线从Ultron HPH/HP系列（20~300kVA三相高频在线式UPS）到DPH（模块化UPS，每个模块50~150kW，支持N+X冗余并联，热插拔模式，扩容和维护方便）覆盖从后备式到在线双变换大功率UPS全线。在工业、数据中心、通信电力等市场有较大份额。与APC（施耐德）、华为、科华数据、科士达、伊顿等竞争。(2)PLC——DVP系列（小型PLC，既有台达DVP全系列有ES/SS/EH/SV型号的可编程控制器，与三菱FX系列兼容性好）、AS系列（中型PLC，EtherCAT总线型，适合自动化产线控制与机器自动化）、NC系列（专用运动控制PLC）。(3)变频器——C2000系列（高功能/高精度矢量控制、电流矢量控制与V/F控制双模+内置DB及PG卡）、MS300系列（紧凑型变频器，面向轻工机械/纺织/包装机械小型单体设备）。(4)伺服驱动——ASDA-A3（中高阶，EtherCAT总线通讯，最小循环周期125μs，24bit单圈绝对值编码器，响应频率3kHz+）、ASDA-B3（经济型高速脉冲/位置定位应用）、ASDA-M系列（三合一驱动器(含PLC功能+I/O)，EtherCAT总线型，适合运动控制一轴一控方案）。\n台达的竞争优势：深度垂直整合——电源、电力电子、自动化和散热技术的系统性整合。对成本把控和制造规模有利，产品性价比较高。我司与台达有若干重叠领域（PLC/变频器/伺服/USP等），我司产品应找到差异化竞争（本地化服务/行业解决方案深度定制/渠道价格体系）。\n对标关注：台达的UPS和变频器产品在通用工业市场与我司产品线重合。台达的全球行销网络和电子制造规模效应是其成本优势。", module:"m9", submodule:"9.6 竞品对比", related:["→ 关联：工业电气成套 §7.4 UPS/EPS"] },
  { id:"2907", title:"汇川技术", tags:["汇川","变频器","伺服"], content:"汇川技术股份有限公司（深圳市汇川技术股份有限公司，总部深圳）是国产工业自动化产品的龙头，在变频器（市占率多年第一）、伺服系统、PLC、SCADA、高性能运动控制、新能源电驱、工业机器人与精密机械等领域全面布局。在国内自动化市场整体排名前列（2024年中国工业自动化市场国产品牌排名第一，国产替代的典型企业代表）\n核心产品和市场地位：(1)变频器——MD500系列（通用矢量变频器/开环矢量闭环矢量/VF模式+支持多种编码器/和PG卡，应用广泛，是汇川的长期畅销主力机型）、MD800系列（多机传动+共直流母线高性能变频器+可插拔式驱动卡+同步定位）、MD880系列（工程型高性能变频器，可完全替代西门子S120，多轴传动/共直流母线/可编程）、HD9X系列（高压变频器，功率单元级联型，6/10kV电压等级，适配风机水泵提升机等高压应用）。市场份额国内第一。(2)伺服系统——SV660系列（高性能EtherCAT总线伺服驱动器，最小循环周期125μs对EtherCAT驱动伺服性能对标松下MINAS A6和安川Σ-7）+SV680系列（新一代高性能伺服驱动器、3.5kHz响应频率、24bit多圈绝对值编码器、更先进抖动抑制算法等定位精度提升）。伺服电机（MS1系列电机配合SV660/SV680驱动器的整体解决方案，与台达ASDA-A3/安川Σ-7同档次性能比，在“EC电机+主轴直驱”等电主轴方案有和机床及机械行业的较高占有率）。(3)PLC（可编程控制器）——AM系列（中型PLC，基于Codesys平台，支持EtherCAT运动控制，面向中高端自动化应用和机器控制领域）、AC系列（小型PLC，对标三菱FX3U，满足一般逻辑控制和简单定位控制需求）。\n(4)新能源（新能源汽车电驱系统&充电桩）——电驱系统和电源系统（乘用车/商用车纯电/混动驱动）。新能源是汇川近年来的快速增长引擎。(5)工业机器人——SCARA机器人（四轴平面关节型，汇川的SCARA在市场以高速度/高性价比在一些3C装配线取放工序替代国际品牌）+六轴工业机器人（逐步推广）。\n竞争定位：汇川是国产替代策略的典型代表企业——在变频器和伺服各细分市场全面与国际品牌（西门子/ABB/安川/三菱等）对标。我司在PLC/变频/伺服领域与汇川存在直接竞争关系。汇川凭借全产品线体系构建（PLC+HMI+伺服+变频+视觉+机器人设备层面到SCADA/MES/MotionController控制层解决方案的平台化）、性价比优势和强大的销售渠道网络在国产品牌中有强劲竞争力。", module:"m9", submodule:"9.6 竞品对比", related:["→ 关联：电气自动化 — PLC、变频器、伺服系统"] },

  // ===== m10: 项目与方案 =====
  { id:"3002", title:"技术方案编制要点", tags:["技术方案","设计"], content:"技术方案（Technical Proposal）是电气工程投标和项目执行的核心文件，直接决定了项目技术路线、设备选型、系统配置和工程造价。一份高质量的技术方案应包含以下核心章节：\n(1)项目概况——简要描述项目名称、建设地点、建设规模、电气主接线方案（变配电所/升压站/开关站/配电室的规模数量布局等）、主要技术指标（总装机容量/变压器容量/负荷等级/供电电压等）。(2)设计依据——项目设计任务书和合同、国家/行业现行标准规范清单（GB/DL/IEC等标准代号及名称）、现场踏勘资料（场地/气象/地质/水文数据）。(3)技术路线——主接线方案选择（单母线/双母线/桥形接线/3/2接线等，附图说明其拓扑结构及特点分析），负荷等级论证（按GB 50052负荷分级原则分类一二三级负荷），系统运行方式（正常运行/检修/故障情况下主接线运行方式切换的可行性、次序说明）。短路电流及抗灾能力校验方案（母线短路电流耐受强度和断路器等主设备开断能力的选择）。(4)设备选型——主要电气设备（变压器/高压开关柜/GIS/低压配电柜/变频器/UPS/PCS等）的型号规格/技术参数/数量列表，设备选型的技术经济和对比分析要点（满足标准性能和项目特殊要求的响应以满足设计技术规格书为准、可自选方案的最优化推荐）。(5)系统图——电气主接线图、电气总平面图、配电系统图、照明系统图、电缆走向图（平面图/干线图等）、防雷接地平面图、消防电气图等。图纸目录与图号编码统一。(6)工程量清单——设备材料表（名称/型号/规格/数量/单位/备注），施工安装工程量（线缆长度/设备台数/支架数量/土方量/桥架米数等）。(7)技术经济指标——总投资额、单位造价（元/kVA）、年运行费用、节能测算（有功/无功损耗估算）、投资回收期（节能改造类项目需要）。\n技术方案常见格式：封面+目录+正文+附件（图纸/计算书/设备技术资料/产品认证报告/业绩证明材料）。方案编制应完全响应招标技术规范书（逐条对标梳理），并列出技术偏离表（正偏离和负偏离均需明确标注并说明优化或补偿理由）。", module:"m10", submodule:"10.1 设计方案模板", related:["→ 关联：规范与标准 — 引用GB/DL标准"] },
  { id:"3004", title:"电气施工图设计流程", tags:["施工图","设计流程"], content:"电气施工图设计是电气工程设计的最下游环节，将初步设计或方案设计转化为可指导现场施工安装的技术图纸文件。电气施工图设计的管理流程和技术流程如下：\n设计流程（分阶段）：(1)初步设计——根据设计任务书和方案设计确定主要电气技术原则：变配电所及发电机房的位置、负荷计算和变压器容量台数选择、高低压主接线型式、主要设备选型（开关柜/变压器/发电机/UPS/EPS/配电箱等）、干线走向等。初步设计阶段产出电气初步设计说明+电气系统图（主接线图、低压配电干线图、防雷类别及措施概要、照明标准及主要灯具选型、弱电各子系统方案）+初步设计概算。(2)施工图设计——在初步设计批复和深化设计基础上，细化到每一台设备/每一个回路的安装、接线和控制。施工图设计阶段按专业细化分册。典型电气施工图图纸目录（主要包括以下图纸种类和顺序）:电气设计总说明和图例（位于各专业施工图册首页，包含工程概况、设计依据、系统指标、设备安装要求和图例符号表）、高低压配电系统图（变配电系统单线图/主接线图，注明设备型号参数、保护配置、开关整定值、CT变比等）、电气照明平面图（各楼层照明/插座布置、灯具型号功率、回路编号、管线标注、地面/墙面插座出线口等）、电力平面图（设备配电箱/动力配电箱/控制箱的电源引接、线缆走向标注敷设方式/管径/电缆编号及规格尺寸等）、防雷接地平面图（避雷带/避雷网/接闪器布置、引下线位置、断接卡、接地极及接地干线布置、等电位联接做法/等电位箱位置等）、消防电气平面图（消防报警设备点位/手动报警按钮/警铃/声光报警器/消防广播/消防电话回路及布线、消火栓按钮启泵线/应急照明平面等）、弱电智能化系统图及平面图（综合布线/安防/楼控/能耗监测等）。\n(3)图纸会审——设计单位向施工和监理单位进行技术交底，各方会审提出问题（设计说明不清楚、系统图与平面图不一致、安装空间冲突、与土建装修条件或水暖条件冲突等），设计单位形成会审纪要并修改图纸。会审是施工前的关键质量控制节点。\n(4)设计交底——施工前由设计负责人对项目部/施工方进行设计意图、施工技术要求、关键部位工艺做法、安装注意事项的交底。\n制图标准：图纸幅面优先采用A0/A1/A2/A3，绘图图层/线型/文字字体/尺寸标注按照GB/T 50001《房屋建筑制图统一标准》和GB/T 18135《电气工程CAD制图规则》标准化。使用CAD电气专业软件（AutoCAD Electrical/天正电气/中望电气）出图。图纸目录（按系统图、平面图、大样图分区排列）和图纸编号（图号按设计院图号和专业-子项-图纸序列编码，例如D-01或E-001或电施-01/电施-02等区段）。\n图纸归档：每一阶段设计图纸须设计人/校对/审核/审定四级签字（四级校审制度），盖章后（设计出图专用章+注册电气工程师执业印章（强电及弱电由注册电气工程师签章盖章））方可交付施工。竣工图由施工单位在竣工后根据实际施工情况将变更部分标注或重新绘制归档。", module:"m10", submodule:"10.1 设计方案模板", related:["→ 关联：规范与标准 §8.6 GB/T 4728制图标准"] },
  { id:"3003", title:"商务标书编制", tags:["投标","商务标"], content:"商务标书是投标文件的重要组成部分，与报价（经济标）和技术方案（技术标）一起构成完整的投标文件。商务标书包括投标人资质能力审查文件、业绩证明和商务条款响应表，是招标人/评标专家进行投标人资格评审和实力评价的主要依据。\n核心内容：(1)投标函及法定代表人授权书（法定代表人签字并盖公司公章），投标保证金（按招标文件要求提交保额和形式（电汇/保函等））。(2)资质文件——企业法人营业执照副本（三证合一）、投标人法定代表人身份证明、企业资质证书（电力工程施工/设计/承装/修/试许可证明，如电力工程施工总承包/送变电专业承包、安全生产许可证等，根据项目范围和等级要求提供相应等级资质）、产品型式试验报告（投标设备应符合国家认证）、ISO体系认证证书（质量/环境/职业健康安全）、CCC强制认证（产品如在强制性认证目录范围内则须提供CCC证书）。(3)业绩证明——近3~5年同类项目业绩（合同关键页+竣工验收证明+用户评价证明），业绩规模/数量与拟投标项目匹配（以证明投标人有足够经验和能力履行合同）。(4)财务状况——经审计的近三年财务报表（资产负债表+利润表+现金流量表）、银行资信证明、企业信用报告（无重大违约/失信记录）。(5)技术偏离表——对招标文件技术规格书中每一项技术条款的响应情况逐条进行响应（响应/正偏离/负偏离）并明确说明。正偏离指投标产品指标优于招标要求（可加分）、负偏离指低于招标要求（必须说明理由/替代方案/接受降级处理等，过多负偏离可能导致投标被判定为非实质性响应）。\n(6)报价表——分项报价（设备/材料/安装/调试/培训/技术服务/税金/运保费等）+总价大写小写。单价乘以数量等于合价，全部合价相加等于总价（一字不差）。报价依据需附设备材料品牌型号规格的参考价或报价依据来源。(7)商务条款响应——对付款方式、交货期、质保期、售后服务响应时间的响应或偏离说明，对合同主要商务条款的完全响应（如付款条件/履约保函/质保金/逾期违约金/仲裁等通用商务条件）。(8)其他——项目经理及关键人员简历资质、施工机械/试验设备清单、投标人企业简介等。\n投标文件编制要求：逐条响应招标文件中的所有资格条件和商务要求（不能漏项、漏响应、缺失）。签字盖章齐全（骑缝章+每一页由法定代表人或授权代理人签字/加盖公章）。电子标按招标文件格式要求上传平台加密（如国网ECP2.0平台、南方电网供应链统一服务平台、各地方公共资源交易中心交易平台）。纸质标按招标文件（正本1份+副本若干份）封装为内层+外层密封包封，严格密封并加盖密封章。\n注意事项：需严格检查响应格式要求（文件格式（PDF/Word/盖章扫描件）、装订要求、密封要求、电子文件载体和数量要求（U盘/光盘）），以及投标保证金电汇底单是否在截止时间前到账。", module:"m10", submodule:"10.2 投标文件", related:[] },
  { id:"3001", title:"国网招投标流程", tags:["国网","招投标","ECP"], content:"国家电网公司（国网）的招投标流程是电力行业设备供应商最重要的商机获取渠道。国网的物资/服务采购主要集中招标平台为ECP2.0（国家电网新一代电子商务平台，https：//ecp.sgcc.com.cn），物资类招标按年度批次计划＋集中规模招标进行。国网招标/投标主要流程如下：\n(1)招标公告——国网在ECP2.0平台和中国招标投标公共服务平台发布招标公告（物资/服务批次名称、投标人资格要求、招标文件获取时间、投标截止时间、开标时间地点、投标保证金提交方式和联系人）。供应商需在ECP2.0平台完成注册审核（免费注册+企业资质提交审核）。\n(2)投标文件编制——购买招标文件（在ECP2.0线上操作）后按照规定格式要求编制投标文件。注意：国网对投标人的资质业绩要求严格（必须满足型式试验报告、CQC/PCCC产品认证、同类产品运行业绩等硬门槛），资格预审（国网对主要物资品类每年或每批次发布资格预审公告，潜在供应商需提前参加资格预审（同时在国网供应商资质能力核实系统提交资料、核实），未通过资格预审者无法参与相应投标）。投标文件须在截止时间前加密上传至ECP2.0（电子签章+网络加密投递开标前不可解密）。\n(3)开标——国网批次集中开标采用远程在线开标（视频直播开标过程），在ECP2.0平台上公布投标人名称和投标价格，各投标人远程解密。\n(4)评标——评标委员会由国网专家库抽取技术专家+商务专家+法律专家组成。评标原则：综合评估法（商务+技术+价格三部分加权打分，各部分权重按批次和产品略有差异，商务10%、技术40%~50%、价格40%~50%）。价格分评定通常采用平均价法（报价在基准价正负一定范围内平均价最好或区间内平均价法，一般扣除最高和最低后的平均价作为基准价为中间价或价格得分按照与基准价的偏差率计算低者为满分）或限价法——超过最高限价或明显低于成本价的投标报价无效。(5)中标公示和中标通知——评标结束后国网在ECP2.0平台公示中标候选人（不少于3日），公示结束后向中标人发中标通知书。\n(6)合同签订——在ECP2.0进行电子合同签署。履约保证金（一般为合同金额的10%，可以履约保函代替或银行转账）和质量保证金（5%左右质保期满后退还）按合同约定执行。(7)供货及验收——按中标交货期要求供货，国网各省公司物资部/项目单位组织物资到货验收，产品需符合招标技术规范和出厂资料要求。\n对其他电力行业项目同样适用本流程的中标逻辑（南方电网公司也有类似的供应链统一服务平台进行线上招投标，流程和国家电网基本一致，差别为具体平台界面和评标细则）。\n重点关注：国网供应商需留意国网供应商资质能力核实（供应商在国网供应商资质能力信息核实系统提交资质业绩材料，参与国网统一资质能力核实并提供支撑资料证明自己；需要具备履约能力核实和产品质量评估认定以获得国网供应商资质能力信息核实结果证明函件），该函件是供应商资质业绩的集中统一证明，是参与后续投标的重要支撑（并非每批次都需要重复提交，但产品质量及运行情况的定期核查将对中标产生影响）。", module:"m10", submodule:"10.3 国网项目流程", related:["→ 关联：规范与标准 §8.3 Q/GDW企标"] },
  { id:"3005", title:"EPC总承包模式", tags:["EPC","总承包"], content:"EPC（Engineering Procurement Construction，设计-采购-施工总承包）模式是电力工程项目中最常用的工程总承包方式之一（另外常见的还有交钥匙Turnkey、DB设计建造、PMC项目管理承包等模式）。在EPC模式下，总承包商按固定总价/固定工期合同承担工程的设计（Engineering）、采购（Procurement）和施工建设（Construction）全过程，对工程的安全性、质量、进度、造价向业主承担全部责任。\n组织架构：业主（投资方/项目公司/招标方）→EPC总承包商（一家企业或联合体牵头方）→分包商（设计分包/土建分包/电气安装分包/调试分包等）。总包对业主负总责、各分包对总包负责，业主不直接管理分包。\nEPC模式的特点和优势：(1)单一责任制——业主只需与总承包商对接，减少合同界面和协调工作量。(2)有利于设计优化和投资节约——设计和采购施工一体化，总承包商可优化设计（在功能标准不变前提下的价值工程优化）降低造价，提升总包利润空间。(3)固定总价/固定工期——业主投资风险可控（省去分别招标和界面索赔的麻烦），但也意味着总包承担更多的风险（设计错误的变更/物价上涨/地质条件变化/不可抗力等——可能通过EPC合同中的索赔条款限制总包的索赔项）。\n合同类型：EPC合同一般为固定总价合同（Lump Sum Turn Key，LSTK），部分为可调总价（随大宗材料/人工价格的指数调整）。付款节点按里程碑设置（如设计完成10%+主要设备到货20%+土建完成20%+安装调试完成30%+竣工验收20%）。\n适用范围：大型电站（火力发电厂/燃气联合循环/垃圾焚烧发电/生物质发电/光伏/风电）/变电站/化工/冶金等大型工业工程。EPC总包方应具备设计能力（电力/化工设计资质）和施工能力或总包管理能力（施工资质+项目管理团队+采购资源整合能力）。\n注意事项：(1)投标前应充分进行现场踏勘和招标文件澄清深入研读，识别自然环境/土地/许可等风险；(2)投标报价的工程量清单中细化暂列金额和报价涨幅空间；(3)明确合同变更索赔条款（业主要求变更/新增工程范围导致费用或工期调整索赔）和不可抗力（自然灾害/极端天气/政策停工/流行病等不可归责于双方的外部事件影响处理方式）的定义和分配。(4)关注分包合同与EPC主合同的背对背条款（总包与分包之间关键权利义务条款与总包合同一致/对应）。", module:"m10", submodule:"10.4 项目归档", related:[] },
  { id:"3006", title:"成本估算与报价", tags:["成本","报价","清单计价"], content:"电气工程项目成本估算是投标报价和项目经济管理的基础。准确的成本估算需基于设计图纸和工程量清单，结合设备材料市场价格、人工成本和施工经验进行详细核算。\n成本构成（典型电气项目）：\n(1)设备购置费——主要电气设备（变压器/高低压开关柜/GIS/UPS/变频器/配电箱/电缆/母线槽/桥架灯具/电线等）的出厂含税价+运输费+保险费+采保费（惯例取设备费1%~2%）。设备费通常占电气工程总造价的50%~65%。获取设备报价的方式：向生产厂家或代理商进行询价（不少于3家）、参考历史中标价/信息价/造价信息网发布的设备指导价。(2)安装工程费（包括人工费+施工机具费+辅材费+措施费）——包含设备安装（变压器/盘柜/配电箱/灯具/开关插座/电缆敷设/电缆头制安/桥架安装/防雷接地等所有电气施工内容的安装）、调试费（单体调试+系统调试/试验/送电调试等）、脚手架搭拆等措施费。\n(3)其他费用——管理费（企业管销费用，按直接费的比例取费，项目规模越大费率越低（定额计价管理费费率约25%~35%直接费成本））、设计费（EPC项目总包方自行承担设计或分包设计、深化设计等）、培训费、总承包服务费（EPC）、税金（增值税9%建筑业或13%设备采购，随一般纳税人和小规模纳税人差异有区别、城市建设维护税/教育附加/地方教育附加以增值税为基数乘以相应税率计算）。(4)利润——一般按直接费+间接费的5%~10%（竞争性报价一般取较低利润4%~8%或根据市场竞争的激烈程度调整）。\n计价方法：(1)定额计价——按项目所在省份建设行政主管部门发布的《建设工程计价定额》及同期造价信息进行算量套价（人工/材料/机械台班按定额消耗量标准计算）。适用于政府项目或预算控制项目。(2)工程量清单计价（GB 50500《建设工程工程量清单计价规范》）——招标控制价编制+投标报价分别按同一清单项目特征描述自主报价。投标报价采用综合单价（人工+材料+机械+管理费+利润+增值税等费用的全费用单价）。建设单位负责提供清单项目特征和工程量，风险由业主承担清单量算量不准调整风险，投标方承担组价风险（投标单价固定，按中标单价×实际完成工程量＝结算价）。\n投标报价策略：(1)对业主预算进行测算（围标控标风险）。(2)对技术要求高/我司有方案优势的报价适当提高利润（利用技术差异性优势取得高利润）。(3)低价竞标+变更索赔策略（低报固定总价，在实施中寻找变更机会合理索赔）。(4)注意不平衡报价法——总价不变但调整各单项报价：前期付款项目（如预付款、设备进场款）适当报高、后期项目（如质保期工作、调试收尾）适当报低，提前资金回流。注意招标文件禁止不平衡报价（或设置评分扣分等限制）。\n标准规范配套：GB 50500建设工程工程量清单计价规范、各省/行业定额（如电力工程定额和电网检修工程定额、建筑安装工程定额由各省/行业工程造价站发布）。", module:"m10", submodule:"10.5 技术报价", related:["→ 关联：产品知识库 — 设备选型价格"] }
];

// ===== App Logic =====
let activeModule = null;
let filteredEntries = [];

function getModuleEntries(moduleId) {
  return ENTRIES.filter(e => e.module === moduleId);
}

function escapeHtml(text) {
  if (!text) return "";
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderModuleSidebar() {
  const list = document.getElementById('moduleList');
  list.innerHTML = '';
  const searchTerm = document.getElementById('moduleSearch').value.toLowerCase().trim();

  MODULES.forEach(mod => {
    if (searchTerm && !mod.name.toLowerCase().includes(searchTerm)) return;

    const item = document.createElement('div');
    item.className = 'module-item' + (activeModule === mod.id ? ' active' : '');
    item.dataset.module = mod.id;

    const icon = document.createElement('div');
    icon.className = 'module-icon ' + mod.id;
    icon.textContent = MODULE_ICONS[mod.id];

    const info = document.createElement('div');
    info.className = 'module-info';
    info.innerHTML = '<div class="module-name">' + escapeHtml(mod.name) + '</div>';

    const badge = document.createElement('span');
    badge.className = 'entry-count-badge';
    badge.textContent = mod.count;

    item.appendChild(icon);
    item.appendChild(info);
    item.appendChild(badge);

    item.addEventListener('click', function() {
      activeModule = (activeModule === mod.id) ? null : mod.id;
      renderModuleSidebar();
      renderEntries();
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('open');
    });

    list.appendChild(item);
  });
}

function renderEntries() {
  const container = document.getElementById('entriesContainer');
  const searchTerm = document.getElementById('entrySearch').value.toLowerCase().trim();
  const currentModuleEl = document.getElementById('currentModule');
  const currentCountEl = document.getElementById('currentCount');
  const searchStats = document.getElementById('searchStats');

  let baseEntries = activeModule ? getModuleEntries(activeModule) : ENTRIES.slice();

  if (searchTerm) {
    baseEntries = baseEntries.filter(function(e) {
      return e.title.toLowerCase().includes(searchTerm) ||
             e.tags.some(function(t) { return t.toLowerCase().includes(searchTerm); }) ||
             e.content.toLowerCase().includes(searchTerm) ||
             e.id.includes(searchTerm);
    });
  }

  var byModule = {};
  baseEntries.forEach(function(e) {
    if (!byModule[e.module]) byModule[e.module] = [];
    byModule[e.module].push(e);
  });

  if (activeModule) {
    var mod = null;
    for (var i = 0; i < MODULES.length; i++) {
      if (MODULES[i].id === activeModule) { mod = MODULES[i]; break; }
    }
    currentModuleEl.textContent = mod ? mod.name : '';
    currentCountEl.textContent = '[ ' + baseEntries.length + ' / ' + (mod ? mod.count : 0) + ' entries ]';
  } else {
    var totalFiltered = searchTerm ? baseEntries.length : ENTRIES.length;
    currentModuleEl.textContent = '# all modules';
    currentCountEl.textContent = '[ ' + totalFiltered + ' / ' + ENTRIES.length + ' entries ]';
  }

  if (searchTerm) {
    searchStats.textContent = '// search: found ' + baseEntries.length + ' match(es)';
  } else {
    searchStats.textContent = '';
  }

  if (baseEntries.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">* * *</div><p>no entries found<br>try a different search or clear the filter</p></div>';
    return;
  }

  var html = '';
  var moduleIds = Object.keys(byModule).sort();

  for (var mi = 0; mi < moduleIds.length; mi++) {
    var modId = moduleIds[mi];
    var mod = null;
    for (var i = 0; i < MODULES.length; i++) {
      if (MODULES[i].id === modId) { mod = MODULES[i]; break; }
    }
    if (!mod) continue;
    var entries = byModule[modId];

    var bySub = {};
    entries.forEach(function(e) {
      if (!bySub[e.submodule]) bySub[e.submodule] = [];
      bySub[e.submodule].push(e);
    });

    var subKeys = Object.keys(bySub).sort(function(a, b) {
      var idxA = mod.submodules.indexOf(a);
      var idxB = mod.submodules.indexOf(b);
      return (idxA === -1 ? 999 : idxA) - (idxB === -1 ? 999 : idxB);
    });

    html += '<div class="module-section" data-module="' + modId + '">';
    html += '<div class="module-section-title">';
    html += '<span class="module-icon ' + modId + '" style="display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border:1px solid;border-radius:3px;font-size:0.7rem;font-family:var(--font-mono);flex-shrink:0;">' + MODULE_ICONS[modId] + '</span>';
    html += escapeHtml(mod.name);
    html += ' <span class="badge">' + entries.length + '</span>';
    html += '</div>';

    for (var si = 0; si < subKeys.length; si++) {
      var sub = subKeys[si];
      var subEntries = bySub[sub];
      html += '<div class="submodule-group">';
      html += '<div class="submodule-title">' + escapeHtml(sub) + '</div>';
      for (var ei = 0; ei < subEntries.length; ei++) {
        var entry = subEntries[ei];
        var globalIdx = baseEntries.indexOf(entry);
        html += '<div class="entry-card" data-index="' + globalIdx + '">';
        html += '<div class="entry-header">';
        html += '<div class="entry-title">' + escapeHtml(entry.title) + '</div>';
        html += '<div class="entry-id">' + escapeHtml(entry.id) + '</div>';
        html += '</div>';
        html += '<div class="entry-tags">';
        for (var ti = 0; ti < entry.tags.length; ti++) {
          html += '<span class="entry-tag">' + escapeHtml(entry.tags[ti]) + '</span>';
        }
        html += '</div>';
        html += '<div class="entry-content">' + escapeHtml(entry.content) + '</div>';
        if (entry.related && entry.related.length > 0) {
          html += '<div class="entry-related">' + entry.related.join(' · ') + '</div>';
        }
        html += '</div>';
      }
      html += '</div>';
    }

    html += '</div>';
  }

  container.innerHTML = html;
}

// Sidebar toggle
document.getElementById('sidebarToggle').addEventListener('click', function() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
});
document.getElementById('sidebarOverlay').addEventListener('click', function() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
});

// Search with debounce
var searchTimer = null;
document.getElementById('entrySearch').addEventListener('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderEntries, 150);
});

document.getElementById('moduleSearch').addEventListener('input', function() {
  renderModuleSidebar();
});

// Keyboard shortcut to clear
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.getElementById('entrySearch').value = '';
    renderEntries();
  }
});

// ===== Detail Modal =====
let modalEntryList = [];
let modalEntryIndex = -1;

function openModal(entry, list, index) {
  modalEntryList = list || [];
  modalEntryIndex = index;

  document.getElementById('modalModule').textContent = (function() {
    for (var i = 0; i < MODULES.length; i++) {
      if (MODULES[i].id === entry.module) return MODULES[i].name;
    }
    return '';
  })() + ' / ' + entry.submodule;

  document.getElementById('modalTitle').textContent = entry.title;
  document.getElementById('modalId').textContent = entry.id;
  document.getElementById('modalContent').textContent = entry.content;

  var tagsHtml = '';
  for (var i = 0; i < entry.tags.length; i++) {
    tagsHtml += '<span class="modal-tag">' + escapeHtml(entry.tags[i]) + '</span>';
  }
  document.getElementById('modalTags').innerHTML = tagsHtml;

  if (entry.related && entry.related.length > 0) {
    document.getElementById('modalRelatedSection').style.display = 'block';
    document.getElementById('modalRelated').innerHTML = entry.related.join('<br>');
  } else {
    document.getElementById('modalRelatedSection').style.display = 'none';
  }

  document.getElementById('modalSubmodule').textContent = entry.submodule;

  document.getElementById('modalPrev').disabled = (index <= 0);
  document.getElementById('modalNext').disabled = (index >= list.length - 1);

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft') document.getElementById('modalPrev').click();
  if (e.key === 'ArrowRight') document.getElementById('modalNext').click();
});

document.getElementById('modalPrev').addEventListener('click', function() {
  if (modalEntryIndex > 0) {
    var prev = modalEntryList[modalEntryIndex - 1];
    openModal(prev, modalEntryList, modalEntryIndex - 1);
  }
});

document.getElementById('modalNext').addEventListener('click', function() {
  if (modalEntryIndex < modalEntryList.length - 1) {
    var next = modalEntryList[modalEntryIndex + 1];
    openModal(next, modalEntryList, modalEntryIndex + 1);
  }
});

// Click entry card to open modal
document.getElementById('entriesContainer').addEventListener('click', function(e) {
  var card = e.target.closest('.entry-card');
  if (!card) return;

  var searchTerm = document.getElementById('entrySearch').value.toLowerCase().trim();
  var baseEntries = activeModule ? getModuleEntries(activeModule) : ENTRIES.slice();

  if (searchTerm) {
    baseEntries = baseEntries.filter(function(entry) {
      return entry.title.toLowerCase().includes(searchTerm) ||
             entry.tags.some(function(t) { return t.toLowerCase().includes(searchTerm); }) ||
             entry.content.toLowerCase().includes(searchTerm) ||
             entry.id.includes(searchTerm);
    });
  }

  var idx = parseInt(card.dataset.index, 10);
  if (!isNaN(idx) && baseEntries[idx]) {
    openModal(baseEntries[idx], baseEntries, idx);
  }
});

// Init
renderModuleSidebar();
renderEntries();
</script>
</body>
</html>
