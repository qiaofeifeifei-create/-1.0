<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电气工程知识库</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-primary: #0a0a12;
  --bg-secondary: #111122;
  --bg-card: #16162a;
  --bg-hover: #1e1e3a;
  --border: #2a2a4a;
  --accent: #00f0ff;
  --accent-dim: #0088aa;
  --accent-green: #00ff88;
  --accent-pink: #ff0088;
  --accent-purple: #aa66ff;
  --accent-orange: #ff8800;
  --text-primary: #e0e0f0;
  --text-secondary: #8888bb;
  --text-dim: #555577;
  --sidebar-width: 280px;
  --font-mono: 'Cascadia Code', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  --font-sans: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
html { font-size: 15px; }
body {
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  display: flex;
  min-height: 100vh;
  overflow-x: hidden;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }

.sidebar {
  position: fixed;
  top: 0; left: 0;
  width: var(--sidebar-width);
  height: 100vh;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 100;
  overflow: hidden;
}
.sidebar-header {
  padding: 20px 16px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sidebar-header h1 {
  font-family: var(--font-mono);
  font-size: 1rem;
  color: var(--accent);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.sidebar-header .subtitle {
  font-size: 0.75rem;
  color: var(--text-dim);
  font-family: var(--font-mono);
}
.sidebar-header .total-count {
  margin-top: 8px;
  font-size: 0.75rem;
  color: var(--accent-green);
  font-family: var(--font-mono);
}
.module-search {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.module-search input {
  width: 100%;
  padding: 8px 10px;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 0.8rem;
  outline: none;
  transition: border-color 0.2s;
}
.module-search input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 8px rgba(0,240,255,0.15);
}
.module-search input::placeholder { color: var(--text-dim); }
.module-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}
.module-item {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  cursor: pointer;
  transition: all 0.2s;
  border-left: 3px solid transparent;
  gap: 10px;
}
.module-item:hover {
  background: var(--bg-hover);
  border-left-color: var(--accent-dim);
}
.module-item.active {
  background: rgba(0,240,255,0.08);
  border-left-color: var(--accent);
}
.module-item .module-icon {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  font-size: 0.75rem;
  font-family: var(--font-mono);
  flex-shrink: 0;
  border: 1px solid var(--border);
}
.module-item .module-info { flex: 1; min-width: 0; }
.module-item .module-name {
  font-size: 0.82rem;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.module-item .entry-count-badge {
  background: var(--border);
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 10px;
  flex-shrink: 0;
}
.module-item.active .entry-count-badge {
  background: var(--accent-dim);
  color: #000;
}

.main {
  margin-left: var(--sidebar-width);
  flex: 1;
  padding: 24px 32px 60px;
  max-width: calc(100% - var(--sidebar-width));
}
.main-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 12px;
}
.main-header h2 {
  font-family: var(--font-mono);
  font-size: 1.4rem;
  color: var(--text-primary);
}
.main-header h2 .highlight { color: var(--accent); }
.main-header .search-box {
  flex: 1;
  max-width: 400px;
  min-width: 200px;
  position: relative;
}
.main-header .search-box input {
  width: 100%;
  padding: 10px 14px;
  padding-left: 36px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.2s;
}
.main-header .search-box input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 12px rgba(0,240,255,0.1);
}
.main-header .search-box input::placeholder { color: var(--text-dim); }
.main-header .search-box::before {
  content: '>';
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--accent-dim);
  font-family: var(--font-mono);
  font-size: 0.9rem;
}
.search-stats {
  font-size: 0.75rem;
  color: var(--text-dim);
  font-family: var(--font-mono);
  margin-bottom: 4px;
}

.module-section { margin-bottom: 32px; }
.module-section-title {
  font-family: var(--font-mono);
  font-size: 1.1rem;
  color: var(--accent);
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--accent-dim);
  display: flex;
  align-items: center;
  gap: 10px;
}
.module-section-title .badge {
  font-size: 0.7rem;
  background: var(--accent-dim);
  color: #000;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: bold;
}

.submodule-group { margin-bottom: 20px; }
.submodule-title {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 10px;
  padding-left: 8px;
  border-left: 2px solid var(--accent-dim);
}

.entry-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 18px;
  margin-bottom: 10px;
  transition: all 0.2s;
}
.entry-card:hover {
  border-color: rgba(0,240,255,0.3);
  box-shadow: 0 0 16px rgba(0,240,255,0.05);
  cursor: pointer;
}
.entry-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.entry-title {
  font-family: var(--font-mono);
  font-size: 1.05rem;
  color: var(--text-primary);
  flex: 1;
  min-width: 0;
}
.entry-id {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text-dim);
  background: var(--bg-primary);
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
  flex-shrink: 0;
  letter-spacing: 1px;
}
.entry-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 8px;
}
.entry-tag {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 3px;
  background: rgba(0,240,255,0.08);
  color: var(--accent);
  border: 1px solid rgba(0,240,255,0.15);
}
.entry-content {
  font-size: 0.88rem;
  line-height: 1.6;
  color: var(--text-secondary);
  margin-bottom: 6px;
  white-space: pre-wrap;
}
.entry-related {
  font-size: 0.78rem;
  color: var(--accent-dim);
  font-family: var(--font-mono);
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
  font-family: var(--font-mono);
}
.empty-state .icon { font-size: 2rem; margin-bottom: 12px; opacity: 0.5; }
.empty-state p { font-size: 0.85rem; line-height: 1.6; }

.sidebar-toggle {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 200;
  width: 40px;
  height: 40px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--accent);
  font-size: 1.2rem;
  cursor: pointer;
  align-items: center;
  justify-content: center;
}
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 99;
}

@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }
  .sidebar-toggle { display: flex; }
  .main { margin-left: 0; padding: 16px; max-width: 100%; padding-top: 60px; }
  .main-header { flex-direction: column; align-items: stretch; }
  .main-header .search-box { max-width: 100%; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.entry-card { animation: fadeIn 0.3s ease-out; }

/* Detail Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 300;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; }
.modal-content {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 12px;
  max-width: 720px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  padding: 28px 32px;
  position: relative;
  animation: fadeIn 0.2s ease-out;
}
.modal-close {
  position: absolute;
  top: 16px;
  right: 20px;
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 1.5rem;
  cursor: pointer;
  font-family: var(--font-mono);
  transition: color 0.2s;
  line-height: 1;
}
.modal-close:hover { color: var(--accent); }
.modal-header { margin-bottom: 16px; }
.modal-header .modal-module {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--accent-dim);
  margin-bottom: 6px;
}
.modal-header .modal-title {
  font-family: var(--font-mono);
  font-size: 1.3rem;
  color: var(--text-primary);
}
.modal-header .modal-id {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-dim);
  background: var(--bg-primary);
  display: inline-block;
  padding: 2px 10px;
  border-radius: 4px;
  border: 1px solid var(--border);
  margin-top: 8px;
}
.modal-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}
.modal-tag {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 3px 10px;
  border-radius: 3px;
  background: rgba(0,240,255,0.08);
  color: var(--accent);
  border: 1px solid rgba(0,240,255,0.15);
}
.modal-section {
  margin-bottom: 16px;
}
.modal-section-label {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.modal-content-text {
  font-size: 0.95rem;
  line-height: 1.8;
  color: var(--text-secondary);
}
.modal-related {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  color: var(--accent-dim);
  line-height: 1.6;
}
.modal-related a {
  color: var(--accent);
  text-decoration: none;
  cursor: pointer;
  transition: color 0.2s;
}
.modal-related a:hover { color: var(--accent-green); text-decoration: underline; }
.modal-submodule {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--text-secondary);
  padding: 8px 12px;
  background: var(--bg-primary);
  border-radius: 6px;
  border: 1px solid var(--border);
  display: inline-block;
}
.modal-nav {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  gap: 12px;
}
.modal-nav-btn {
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 16px;
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.2s;
}
.modal-nav-btn:hover {
  border-color: var(--accent-dim);
  color: var(--accent);
}
.modal-nav-btn:disabled {
  opacity: 0.3;
  cursor: default;
  border-color: var(--border);
  color: var(--text-dim);
}
.modal-nav-btn:disabled:hover {
  border-color: var(--border);
  color: var(--text-dim);
}

@media (max-width: 768px) {
  .modal-content { padding: 20px 16px; max-height: 90vh; }
  .modal-nav { flex-direction: column; }
}

.module-icon.m1 { color: var(--accent); border-color: var(--accent); }
.module-icon.m2 { color: var(--accent-green); border-color: var(--accent-green); }
.module-icon.m3 { color: var(--accent-pink); border-color: var(--accent-pink); }
.module-icon.m4 { color: var(--accent-purple); border-color: var(--accent-purple); }
.module-icon.m5 { color: var(--accent-orange); border-color: var(--accent-orange); }
.module-icon.m6 { color: #ff4488; border-color: #ff4488; }
.module-icon.m7 { color: #44ffaa; border-color: #44ffaa; }
.module-icon.m8 { color: #ffaa44; border-color: #ffaa44; }
.module-icon.m9 { color: #4488ff; border-color: #4488ff; }
.module-icon.m10 { color: #ff44aa; border-color: #ff44aa; }
</style>
</head>
<body>

<button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">&#9776;</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>// 电气工程</h1>
    <div class="subtitle">knowledge base</div>
    <div class="total-count">[ <span id="totalEntries">115</span> entries ]</div>
  </div>
  <div class="module-search">
    <input type="text" id="moduleSearch" placeholder="filter modules..." autocomplete="off">
  </div>
  <div class="module-list" id="moduleList"></div>
</nav>

<main class="main">
  <div class="main-header">
    <h2><span class="highlight" id="currentModule">#</span> <span id="currentCount" style="font-size:0.8rem;color:var(--text-dim);font-family:var(--font-mono);"></span></h2>
    <div class="search-box">
      <input type="text" id="entrySearch" placeholder="search entries..." autocomplete="off">
    </div>
  </div>
  <div class="search-stats" id="searchStats"></div>
  <div id="entriesContainer"></div>
</main>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content">
    <button class="modal-close" id="modalClose">&times;</button>
    <div class="modal-header">
      <div class="modal-module" id="modalModule"></div>
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-id" id="modalId"></div>
    </div>
    <div class="modal-tags" id="modalTags"></div>
    <div class="modal-section">
      <div class="modal-section-label">// content</div>
      <div class="modal-content-text" id="modalContent"></div>
    </div>
    <div class="modal-section" id="modalRelatedSection" style="display:none">
      <div class="modal-section-label">// related</div>
      <div class="modal-related" id="modalRelated"></div>
    </div>
    <div class="modal-section">
      <div class="modal-submodule" id="modalSubmodule"></div>
    </div>
    <div class="modal-nav">
      <button class="modal-nav-btn" id="modalPrev">&#8592; prev</button>
      <button class="modal-nav-btn" id="modalNext">next &#8594;</button>
    </div>
  </div>
</div>

<script>
const MODULES = [
  { id: "m1", name: "电气基础理论", submodules: ["1.1 电路理论","1.2 电磁场理论","1.3 电机学","1.4 电力电子技术","1.5 信号与控制基础"], count: 15 },
  { id: "m2", name: "电力系统", submodules: ["2.1 发电系统","2.2 输电系统","2.3 变电系统","2.4 配电系统","2.5 用电技术","2.6 电力系统分析","2.7 继电保护","2.8 调度自动化"], count: 17 },
  { id: "m3", name: "电气自动化", submodules: ["3.1 PLC","3.2 变频器","3.3 伺服系统","3.4 DCS & SCADA","3.5 工业通信","3.6 组态软件","3.7 工业机器人"], count: 12 },
  { id: "m4", name: "弱电与智能化", submodules: ["4.1 综合布线","4.2 安防系统","4.3 消防报警","4.4 楼宇自控","4.5 系统集成","4.6 智能照明","4.7 物联网IoT"], count: 12 },
  { id: "m5", name: "新能源与储能", submodules: ["5.1 光伏发电","5.2 风力发电","5.3 储能技术","5.4 氢能与燃料电池","5.5 微电网","5.6 双碳政策"], count: 8 },
  { id: "m6", name: "电能质量治理", submodules: ["6.1 问题分类","6.2 无功补偿","6.3 谐波治理","6.4 低电压治理","6.5 调压设备","6.6 柔性直流","6.7 工程案例库"], count: 13 },
  { id: "m7", name: "工业电气成套", submodules: ["7.1 高低压开关柜","7.2 配电变压器","7.3 MCC","7.4 UPS/EPS","7.5 设计规范"], count: 8 },
  { id: "m8", name: "规范与标准", submodules: ["8.1 国家标准","8.2 行业标准","8.3 国网企标","8.4 国际标准","8.5 施工验收","8.6 制图标准"], count: 8 },
  { id: "m9", name: "产品知识库", submodules: ["9.1 高压开关产品","9.2 高压开关市场","9.3 储能设备","9.4 自动化设备","9.5 电能质量设备","9.6 竞品对比"], count: 16 },
  { id: "m10", name: "项目与方案", submodules: ["10.1 设计方案模板","10.2 投标文件","10.3 国网项目流程","10.4 项目归档","10.5 技术报价"], count: 6 }
];

const MODULE_ICONS = { m1:"~", m2:"=", m3:"#", m4:"@", m5:"$", m6:"%", m7:"&", m8:"*", m9:"+", m10:"!" };

const ENTRIES = [
  // ===== m1: 电气基础理论 =====
  { id:"2001", title:"基尔霍夫定律", tags:["KCL","KVL","电路定律"], content:"KCL（基尔霍夫电流定律）：∑I_in = ∑I_out，任意节点处流入电流之和等于流出电流之和。基于电荷守恒原理，适用于集总参数电路中的任何节点，是电路分析的第一基本定律。\nKVL（基尔霍夫电压定律）：∑U_rise = ∑U_drop，任意闭合回路中电压升之和等于电压降之和。基于能量守恒原理，适用于任何闭合回路。\n工程应用：支路电流法、网孔电流法、节点电压法均以KCL/KVL为核心。电路仿真SPICE使用修正节点分析法（MNA），本质是KCL/KVL的矩阵形式。PCB设计中电源完整性分析、故障诊断的电压测量验证均以此为基础。", module:"m1", submodule:"1.1 电路理论", related:[] },
  { id:"2002", title:"戴维南定理", tags:["等效电路","戴维南"], content:"戴维南定理：任何线性有源二端网络可等效为一个电压源U_oc（开路电压）与一个电阻R_eq（等效内阻）串联。诺顿定理是对偶形式——电流源I_sc与电阻R_eq并联。\n求解步骤：(1)断开待求支路；(2)计算开路电压U_oc；(3)将所有独立源置零（电压源短路、电流源开路）；(4)计算等效电阻R_eq；(5)构建等效电路。\n工程应用：用于分析复杂网络中某一支路的电压电流，特别适合负载变化场景（如电源最大功率传输分析）。最大功率传输定理：当负载电阻等于源内阻时，负载获得最大功率。", module:"m1", submodule:"1.1 电路理论", related:[] },
  { id:"2003", title:"叠加定理", tags:["叠加定理","线性电路"], content:"叠加定理：线性电路中多个独立源共同作用时，任一支路的响应（电压或电流）等于每个独立源单独作用时在该支路产生响应的代数和。\n使用规则：(1)每次只保留一个独立源，其余独立源置零（电压源短路、电流源开路）；(2)受控源始终保留，不置零；(3)功率不满足叠加性（功率是电压和电流的乘积，非线性关系）。\n工程意义：叠加定理是线性电路分析的核心工具，也是傅里叶分析和交流电路频域分析的理论基础。非正弦周期信号可分解为各次谐波分别计算再叠加，是谐波分析的基本方法。", module:"m1", submodule:"1.1 电路理论", related:[] },
  { id:"2004", title:"正弦交流电路", tags:["交流","正弦","阻抗"], content:"正弦量三要素：幅值（U_m或I_m）、角频率（ω=2πf）、初相位（φ）。有效值=幅值/√2，我国工频f=50Hz，ω=314rad/s。\n相量表示：正弦量可用复数相量表示，将时域微分方程转化为复频域代数方程，大幅简化计算。阻抗Z=R+j(X_L-X_C)，其中X_L=ωL，X_C=1/ωC。\n工程应用：交流电路功率分析——有功功率P=UIcosφ，无功功率Q=UIsinφ，视在功率S=UI，功率因数cosφ=P/S。提高功率因数是电能质量治理的核心目标之一。", module:"m1", submodule:"1.1 电路理论", related:[] },
  { id:"2005", title:"三相电路基本概念", tags:["三相","对称分量"], content:"对称三相电源：三个正弦电压幅值相等、频率相同、相位互差120°。星形（Y）接法：线电压=√3×相电压，线电流=相电流，中性点可引出。三角形（Δ）接法：线电压=相电压，线电流=√3×相电流。\n对称分量法：任意不对称三相系统可分解为正序、负序、零序三组对称分量。正序（ABC顺序）、负序（ACB顺序）、零序（同相位）。这是电力系统故障分析的核心方法。\n工程应用：三相电路总功率P=√3×U_l×I_l×cosφ。三相系统比单相系统传输效率更高、功率更平稳，是电力系统发输变配用的基本形式。", module:"m1", submodule:"1.1 电路理论", related:[] },
  { id:"2013", title:"拉普拉斯变换在电路分析中的应用", tags:["拉普拉斯","复频域"], content:"拉普拉斯变换将时域微分方程转化为复频域（s域）代数方程，是分析动态电路暂态过程的核心工具。运算阻抗：电感Z_L=sL，电容Z_C=1/sC，电阻Z_R=R。\n应用方法：(1)建立时域微分方程；(2)对等式两边取拉氏变换，考虑初始条件；(3)求解s域代数方程；(4)取拉氏逆变换得时域响应。自由响应+强制响应=全响应。\n工程意义：传递函数H(s)=Y(s)/X(s)描述系统输入输出关系，是控制理论和滤波器设计的数学基础。极点决定系统稳定性，零点影响响应形状。实际应用中PSpice等仿真软件自动完成此计算。", module:"m1", submodule:"1.1 电路理论", related:[] },
  { id:"3101", title:"中性点接地方式", tags:["中性点","消弧线圈"], content:"中性点接地方式是中压电网的关键技术选择，直接影响供电可靠性、过电压水平、继电保护配置和人身安全。\n三种方式：(1)不接地——3~35kV系统，单相接地故障可运行2h，电容电流<10A（电缆网络<30A）；(2)经消弧线圈接地——电容电流较大时补偿，熄弧效果好，降低故障点恢复电压；(3)直接接地——110kV及以上，单相短路电流大，保护快速切除。\n选型原则：35kV以下多采用不接地或经消弧线圈接地，保证供电连续性。110kV及以上采用直接接地，降低过电压水平。近年城市配网推广小电阻接地方式（100~400Ω），快速切除故障、限制过电压。", module:"m1", submodule:"1.1 电路理论", related:[] },
  { id:"2006", title:"法拉第电磁感应定律", tags:["电磁感应","法拉第"], content:"法拉第电磁感应定律：感应电动势e=-NdΦ/dt，线圈中感应电动势与磁链变化率成正比，方向由楞次定律确定（反对磁通量变化）。这是发电机、变压器、电感器所有电磁设备的理论基础。\n物理本质：变化的磁场产生电场，是麦克斯韦方程组的核心内容之一。感应电动势的大小取决于磁通量变化率，与磁通量绝对值无关。\n工程应用：变压器原理——原边交变电流产生交变磁场，在副边感应出电动势，实现电压变换和电气隔离。电机原理——导体在磁场中运动切割磁力线产生感应电动势，实现机电能量转换。传感应用——电流互感器（CT）利用此原理将大电流转换为小电流。", module:"m1", submodule:"1.2 电磁场理论", related:[] },
  { id:"2007", title:"麦克斯韦方程组", tags:["麦克斯韦","电磁场"], content:"麦克斯韦方程组由四个方程组成，是经典电磁理论的基石：\n(1)高斯电场定律：∇·D=ρ，电场线从正电荷出发终止于负电荷；(2)高斯磁场定律：∇·B=0，磁力线闭合无散度；(3)法拉第定律：∇×E=-∂B/∂t，变化的磁场产生电场；(4)安培环路定律（修正）：∇×H=J+∂D/∂t，电流和变化的电场产生磁场。\n工程意义：麦克斯韦方程组统一了电学、磁学和光学，预言了电磁波的存在。所有电磁场计算（天线设计、EMC电磁兼容分析、波导传输）均以此为基础。微分形式描述场的局部行为，积分形式描述场的全局行为。", module:"m1", submodule:"1.2 电磁场理论", related:[] },
  { id:"2008", title:"变压器工作原理", tags:["变压器","变比"], content:"变压器基于电磁感应原理，原边交变电流在铁心中产生交变磁通，在副边绕组中感应出电动势。电压比U1/U2=N1/N2=k，电流比I1/I2=N2/N1=1/k。\n理想变压器条件：无漏磁、无损耗、磁导率无穷大。实际变压器存在铜损（绕组电阻热损耗）、铁损（磁滞损耗+涡流损耗）、漏磁等非理想因素。效率公式η=P2/P1×100%，大型变压器效率可达99%以上。\n主要参数：额定容量(kVA)、额定电压(kV)、空载电流(%)、短路阻抗(%)、联结组标号(Dyn11/Yyn0等)。并联运行需满足：变比相同、联结组相同、短路阻抗百分比相近。油浸式变压器采用瓦斯保护和温度保护，干式变压器采用温度传感器监测绕组温度。", module:"m1", submodule:"1.3 电机学", related:["→ 关联：工业电气成套 §7.2 配电变压器"] },
  { id:"2009", title:"异步电动机", tags:["异步电机","转差率"], content:"异步电动机（感应电动机）工作原理：定子三相绕组通入对称交流电产生旋转磁场，转速n0=60f/p（同步转速）。转子导体切割旋转磁场产生感应电流，载流导体在磁场中受力形成电磁转矩，驱动转子旋转。转差率s=(n0-n)/n0，是异步电机的核心参数，额定运行时s≈2%~5%。\n分类：绕线型（转子有滑环和碳刷，可串电阻调速）和鼠笼型（转子铸铝或铜条，结构简单可靠性高）。鼠笼型占工业应用90%以上。\n启动特性：启动电流大（5~7倍额定电流），启动转矩较小（0.5~1.5倍额定转矩）。降压启动方法：星三角启动、自耦降压、软启动器。变频调速是当前主流调速方案。", module:"m1", submodule:"1.3 电机学", related:[] },
  { id:"2010", title:"同步电动机", tags:["同步电机","功率因数"], content:"同步电动机转子转速与定子旋转磁场严格同步，n=60f/p，与负载大小无关（除非失步）。转子有励磁绕组（直流励磁产生恒定磁场）或永磁体。\n特性优势：可调节励磁电流改变功率因数——过励时呈容性（吸收超前无功），欠励时呈感性（吸收滞后无功）。过励运行的同步电机可补偿感性负载的滞后无功，改善电网功率因数，是同步调相机的基本原理。\n应用场景：恒速大功率场合（压缩机、球磨机、水泵）效率优于异步电机。永磁同步电机（PMSM）在伺服系统和电动汽车中广泛应用。启动需采用异步启动或变频启动方式。", module:"m1", submodule:"1.3 电机学", related:[] },
  { id:"2011", title:"电力电子器件分类", tags:["IGBT","晶闸管","电力电子"], content:"电力电子器件按可控性分三类：(1)不可控器件——功率二极管（整流、续流、反并联）；(2)半控器件——晶闸管SCR（只能控制导通，不能控制关断，依靠主电路电流过零自然关断）；(3)全控器件——IGBT（目前应用最广）、MOSFET（高频）、GTO（大功率）、IGCT（中高压）。\nIGBT（绝缘栅双极型晶体管）：兼具MOSFET的电压驱动特性和BJT的低导通压降优势。电压等级600V~6500V，电流等级至3600A。是变频器、SVG、APF、风电变流器、光伏逆变器的核心器件。\n宽禁带半导体：SiC（碳化硅）和GaN（氮化镓）是下一代电力电子器件材料。SiC MOSFET耐压高、开关快、损耗低，在电动汽车充电桩和光伏逆变器中逐步取代Si IGBT。", module:"m1", submodule:"1.4 电力电子技术", related:["→ 关联：电能质量治理 — SVG、APF 均基于全控器件"] },
  { id:"2012", title:"PWM整流器", tags:["PWM","整流","谐波"], content:"PWM整流器（脉宽调制整流器）采用全控器件（IGBT）和高频PWM控制，实现AC/DC双向能量变换。相比传统二极管/晶闸管整流，PWM整流器可实现单位功率因数（cosφ≈1）、网侧电流正弦化（THD<5%）、能量双向流动（整流/逆变）、直流电压可控。\n拓扑分类：(1)VSR电压型整流器——直流侧并联大电容，输出直流电压稳定，应用最广；(2)CSR电流型整流器——直流侧串联大电感，输出直流电流稳定。VSR是目前主流的PWM整流方案。\n控制策略：电压外环+电流内环的双闭环控制。电流环采用d-q旋转坐标系下的解耦控制，分别控制有功和无功分量。矢量控制、直接功率控制（DPC）是常用方法。", module:"m1", submodule:"1.4 电力电子技术", related:[] },
  { id:"3103", title:"防雷接地系统", tags:["防雷","接地","SPD"], content:"防雷接地系统由三部分组成：接闪器（避雷针/避雷带/避雷网）、引下线（将雷电流导入大地）、接地装置（接地极/接地网）。核心参数：接地电阻值。变电所接地电阻R≤1Ω，建筑物防雷接地R≤4Ω，独立防雷针R≤10Ω（GB 50057）。\n浪涌保护器SPD（Surge Protective Device）：分级保护——Ⅰ级（10/350μs波形，用于LPZ0-LPZ1界面，如总配电柜，冲击电流Iimp≥12.5kA）、Ⅱ级（8/20μs波形，分配电柜，标称放电电流In≥20kA）、Ⅲ级（8/20μs波形，终端设备前，In≥10kA）。\n等电位连接：将进出建筑物的金属管道、结构钢筋、电缆金属护套等做等电位连接，防止电位差造成电击。接地系统形式：TN（TN-C/TN-S/TN-C-S）、TT、IT。建筑物防雷分类按年预计雷击次数分为一类/二类/三类。", module:"m1", submodule:"1.5 信号与控制基础", related:["→ 关联：规范与标准 §8.5 施工验收"] },

  // ===== m2: 电力系统 =====
  { id:"2101", title:"发电厂类型", tags:["发电厂","火电","水电","核电"], content:"发电厂按能源类型分类：(1)火力发电厂——燃煤/燃气/余热/生物质，利用燃料化学能加热水产生蒸汽驱动汽轮机发电。我国以煤电为主（约占总发电量60%），单机容量300MW~1000MW，超超临界机组效率45%以上。(2)水力发电厂——利用水的位能，分为坝后式（三峡2240万kW）、抽水蓄能（双向可逆式机组，用于电网调峰填谷）。\n(3)核电厂——核裂变能加热水产生蒸汽，压水堆PWR为主流（占核电70%以上），单机容量900~1700MWe。(4)新能源发电——光伏、风电（详见m5模块）。(5)其他——燃气轮机（启停快，用于调峰）、内燃机（应急备用）、地热/潮汐/光热。\n厂用电率：火电约5%~8%，水电约0.5%~2%，核电约4%~6%。发电厂电气主系统包括发电机出口断路器（GCB）、主变压器、厂用变压器、高压配电装置等。", module:"m2", submodule:"2.1 发电系统", related:["→ 关联：新能源与储能"] },
  { id:"2112", title:"火力发电原理", tags:["火电","发电","锅炉"], content:"火力发电将燃料化学能转化为电能：燃料在锅炉中燃烧→化学能转为热能加热水产生高温高压蒸汽→蒸汽推动汽轮机叶片旋转→热能转为机械能→发电机转子旋转切割磁力线→机械能转为电能。\n主要设备：锅炉（煤粉炉/循环流化床CFB）、汽轮机（高压/中压/低压缸）、发电机（氢冷/水冷/空冷）、凝汽器（冷却排汽提高效率）、给水泵、烟气处理系统（脱硫/脱硝/除尘）。\n效率：亚临界机组（16.7MPa/538℃）效率约38%，超临界（24.1MPa/538℃）约42%，超超临界（>27MPa/580℃）可达45%以上。热电联产综合效率可达80%以上。厂用电率5%~8%，供电煤耗：超超临界<280g/kWh。", module:"m2", submodule:"2.1 发电系统", related:[] },
  { id:"2102", title:"输电电压等级", tags:["电压等级","交流","直流"], content:"交流输电电压等级：我国标准电压等级——110kV（区域配电）、220kV（地区主网）、500kV（省网骨干，也是南方电网主网架）、750kV（西北电网）、1000kV（特高压交流试验示范）。直流输电电压等级：±400kV（背靠背联网）、±500kV（远距离大容量）、±800kV（特高压直流，如向家坝-上海±800kV，输送容量640万kW）、±1100kV（昌吉-古泉，输送容量1200万kW，输电距离3324km）。\n选择原则：输电距离越长、容量越大，电压等级越高。500kV交流经济输电距离约500~800km，±800kV直流可达2000km以上。直流输电适合远距离大容量点对点输送、海缆输电、异步联网等场景。高压输电可降低线路损耗（P=I²R），相同功率下提高电压可减小电流和线路损耗。", module:"m2", submodule:"2.2 输电系统", related:[] },
  { id:"2103", title:"变电站类型", tags:["变电站","GIS","智能站"], content:"变电站按电压等级和技术形式分类：(1)GIS变电站——采用SF6全封闭组合电器，占地小（约为敞开站的1/10）、可靠性高、维护量少，适用于城市中心、高海拔、环境恶劣等场景。110kV~1100kV均有应用。(2)敞开式AIS变电站——设备绝缘裸露在空气中，造价低、检修方便，适用于土地充足的郊外变电站。\n(3)智能变电站——采用IEC 61850标准，全站GOOSE网络跳闸，电子式互感器（ECT/EVT）+智能终端+合并单元。过程层/间隔层/站控层三层架构，光纤通信替代传统电缆接线。(4)模块化预制舱式变电站——工厂预制、现场拼装，建设周期缩短50%以上，用于新能源升压站和临时供电。\n按功能分：升压站（发电厂侧）、降压站（负荷中心）、开关站（无变压器，用于线路分段）、牵引变电所（电气化铁路专用）。", module:"m2", submodule:"2.3 变电系统", related:[] },
  { id:"2113", title:"变电站主接线形式", tags:["主接线","双母线","桥形接线"], content:"主接线是变电站电气设计的核心，决定系统的可靠性、灵活性和经济性。主要形式：\n(1)单母线接线——简单经济，但母线故障全站停电，适用于三级负荷或小型变电站。(2)单母线分段——用断路器将母线分段，一段母线故障仅停该段，提高供电可靠性。(3)双母线接线——两组母线互为备用，可轮流检修，可靠性高。出线回路多时广泛采用。(4)双母线分段——更高可靠性，用于500kV及以上枢纽变电站。\n(5)桥形接线——内桥（变压器回路只一台断路器，线路回路两台断路器，成本低且切换灵活，适用于出线多变压器少的长距离输电场景）和外桥（适用于入线少变压器切换频繁的场景）。(6)一个半断路器接线（3/2接线）——每两个出线回路用3台断路器，N-1故障时不影响供电，可靠性最高，用于500kV及以上电压等级。\n选择依据：可靠性（N-1原则）、灵活性（运行方式切换、检修）、经济性（设备投资）。", module:"m2", submodule:"2.3 变电系统", related:[] },
  { id:"2114", title:"GIS气体绝缘组合电器", tags:["GIS","SF6","组合电器"], content:"GIS（Gas Insulated Switchgear）将断路器、隔离开关、接地开关、快速接地开关、电流互感器、电压互感器、母线等元件全封闭在充有SF6气体的金属壳体内。SF6气体具有优异的绝缘和灭弧性能（绝缘强度为空气的3倍，灭弧能力为空气的100倍）。\n优势：占地面积小（约为AIS的1/10）、可靠性高（不受大气环境影响）、维护工作量少、安全性好（带电部分全封闭）、电磁辐射低。适用于城市变电站、水电站地下厂房、高海拔地区、污染严重地区等。\n关键参数：额定电压126~1100kV，额定电流2000~6300A，额定短路开断电流40~63kA，SF6气体额定压力0.5~0.7MPa（20℃）。根据GB 7674和IEC 622271标准设计制造。泄漏率≤0.5%/年。", module:"m2", submodule:"2.3 变电系统", related:["→ 关联：产品知识库 §9.1 — 特高压GIS产品"] },
  { id:"2104", title:"配电网接线方式", tags:["配网","环网","辐射"], content:"配电网接线方式直接影响供电可靠性：(1)放射式——从变电站引出单回线路至用户，结构简单、投资低，但线路故障时全部停电。适用于三级负荷。(2)树干式——从主干线引出分支至各用户，经济性好但可靠性低。\n(3)环网式——线路两端均接至电源，开环运行（正常情况下中间断开，一端故障可从另一端供电）。N-1原则是配网规划基础——任何单一元件故障不影响正常供电。(4)双电源供电——来自不同变电站的两路独立电源，用于一级负荷。\n我国中压配网以10kV为主，大城市推进20kV。低压配网380/220V三相四线制。配电网中性点接地方式：经小电阻接地（城市电缆网）、经消弧线圈接地（架空线混合网）、不接地（农村电网）。", module:"m2", submodule:"2.4 配电系统", related:[] },
  { id:"2115", title:"电缆选型原则", tags:["电缆选型","载流量","XLPE"], content:"电缆截面选择需综合三个因素：(1)载流量——根据负荷电流选择截面，考虑环境温度、敷设方式（空气中/土壤中/桥架内/穿管）、多根并列等校正系数。IEC 60364和GB 50217有详细载流量表。(2)电压降——长线路需验算电压降ΔU≤5%，ΔU=I×L×(Rcosφ+Xsinφ)。(3)短路热稳定——校验短路电流下的热容量S≥I_k×√t/C。\n绝缘类型选用：PVC（普通70℃，不阻燃场景逐步淘汰）、XLPE交联聚乙烯（90℃，目前最常用，载流量大、耐温高）、EPR乙丙橡胶（柔软、用于特殊场合）、矿物质MI（防火，用于消防回路）。\n施工要点：电缆弯曲半径≥12D（铠装）/≥15D（无铠装），电缆终端头和中间接头制作需严格按工艺要求，电缆试验包括绝缘电阻测试和耐压试验（直流耐压或串联谐振交流耐压35kV及以上）。", module:"m2", submodule:"2.4 配电系统", related:[] },
  { id:"2116", title:"电气安全防护", tags:["安全防护","漏电保护","安全电压"], content:"电气安全防护分直接接触防护和间接接触防护两类：\n直接接触防护：(1)绝缘——导线绝缘层、设备绝缘外壳；(2)遮栏/外护物——配电柜门、防护网；(3)距离——带电体与人体保持安全距离，10kV安全距离0.7m，110kV为1.5m。\n间接接触防护：(1)接地系统——TN系统（设备外壳接保护中性线PEN或保护线PE），当设备漏电时形成单相短路，促使保护装置动作；(2)漏电保护RCD——检测剩余电流，动作电流30mA（人身安全）、100mA（兼防火）、300mA（防火）；(3)安全电压——特低电压ELV，干燥环境≤50V，潮湿环境≤25V，特别潮湿≤12V；(4)双重绝缘/加强绝缘——Ⅱ类设备（回形符号）。(5)电气隔离。\n防电击措施配合使用：接地是基础，RCD是后备，安全电压用于手持电动工具等危险场景。", module:"m2", submodule:"2.5 用电技术", related:["→ 关联：电气基础理论 §1.5 — 防雷接地系统"] },
  { id:"2105", title:"潮流计算", tags:["潮流","牛顿-拉夫逊"], content:"潮流计算是电力系统稳态分析的核心工具，用于计算各节点电压幅值/相角、支路功率分布及网络损耗。潮流计算结果是系统规划、运行方式制定、无功优化、安全评估的基础。\n主要算法：(1)牛顿-拉夫逊法——收敛速度快（平方收敛），迭代次数少（3~5次即可收敛），但对初值敏感。极坐标形式最常用，修正方程维度为(2n-1)阶。(2)PQ分解法——基于有功与电压相角、无功与电压幅值之间的弱耦合关系，将雅可比矩阵简化为常数矩阵，每次迭代计算量大幅减小，适用于高压输电网（高X/R比）。P-Q分解法的简化版本BX方案和XB方案在实际工程中广泛应用。(3)高斯-赛德尔法——收敛速度慢但编程简单，常用于配电网潮流，结合PV节点处理。\n应用场景：(1)运行方式分析——N-1校核是规划必备，验证任一线路或变压器停运后系统是否过载或电压越限；(2)无功优化——以网损最小为目标调整发电机端电压、变压器分接头、无功补偿容量；(3)安全评估——计算故障后潮流分布，评估系统安全水平。PV节点（有功和无功可调的发电机节点）和PQ节点（负荷节点）的设定直接影响计算结果。", module:"m2", submodule:"2.6 电力系统分析", related:[] },
  { id:"2106", title:"短路电流计算", tags:["短路","对称","不对称"], content:"短路电流计算是电力系统设计和设备选型的基础依据。短路类型分对称短路（三相短路）和不对称短路（单相接地/两相短路/两相接地短路）。\n三相短路计算：三相短路是对称故障，产生的短路电流最大，包含周期分量（按系统阻抗决定幅值）和非周期分量（衰减时间常数由X/R比决定）。冲击电流i_sh=√2×I_k×K_sh，冲击系数K_sh一般取1.8（对应X/R大系统），用于校验设备动稳定。短路电流有效值I_k用于校验设备热稳定。\n不对称短路计算：采用对称分量法将abc三相系统分解为正序、负序、零序三个独立系统。正序网络（三相对称电势源）、负序网络（无源，负序阻抗=正序阻抗）、零序网络（零序阻抗与接地方式和变压器接线有关，Δ接法侧零序开路）。单相接地短路电流I_k1=3E/(Z1+Z2+Z0)，两相短路电流I_k2=√3×E/(Z1+Z2)，两相接地短路介于两者之间。\n工程应用：(1)设备选型——断路器的额定短路开断电流必须大于安装处的最大短路电流有效值；(2)保护整定——继电保护的动作值和动作时间基于短路电流计算结果；(3)接地网设计——单相短路电流用于校验接地网热稳定和接触电势/跨步电势。短路电流计算标准依据GB/T 15544（IEC 60909）。", module:"m2", submodule:"2.6 电力系统分析", related:[] },
  { id:"2107", title:"电力系统稳定性", tags:["暂态","功角","低频振荡"], content:"电力系统稳定性指系统在遭受扰动后恢复到正常运行状态的能力，是电力系统安全运行的核心问题。按物理特性分三类：\n功角稳定（角度稳定）：(1)静态稳定——系统在小扰动下恢复同步的能力，与同步功率系数dP/dδ正相关，可通过励磁系统提高。(2)暂态稳定——系统遭受大扰动（短路、甩负荷、切机）后维持同步的能力，采用等面积定则分析。加速面积>减速面积时失步。提高暂态稳定的措施：快速切除故障、自动重合闸、电气制动、快关汽门、强励。(3)动态稳定——关注低频振荡（0.1~2Hz），弱阻尼互联系统在扰动后的持续振荡，PSS（电力系统稳定器）是最有效的抑制手段。\n频率稳定：系统有功功率不平衡导致频率偏离额定值（50Hz±0.2Hz正常范围，±0.5Hz为极限）。一次调频（调速器，响应时间秒级，有差调节，调差系数4%~5%）、二次调频（AGC自动发电控制，响应分钟级，无差调节）。低频减载（UFLS）是防止频率崩溃的最后防线。\n电压稳定：系统在扰动后维持各节点电压在可接受范围的能力。电压崩溃通常发生在重负荷系统受端电网，具有局部性。静态电压稳定分析采用P-V曲线和V-Q曲线，鼻点（鞍结分岔点）对应极限输送功率。动态电压稳定关注OLTC有载调压、发电机过励限制等慢速动态元件的相互作用。\n新能源影响：高比例新能源接入降低了系统惯量（同步发电机被电力电子变流器替代），频率响应变差，暂态功角特性改变，电压支撑能力下降。构网型变流器（Grid-forming）是解决新能源并网稳定性的关键技术方向。", module:"m2", submodule:"2.6 电力系统分析", related:["→ 关联：新能源与储能 — 新能源并网影响系统稳定性"] },
  { id:"2108", title:"继电保护基本原理", tags:["继保","四性","主保护"], content:"继电保护的基本任务是：当电力系统发生故障或不正常运行状态时，迅速切除故障设备或发出报警信号，保证非故障部分继续正常运行。继电保护的四项基本要求（四性）：\n(1)选择性——故障时仅切除故障元件，尽量缩小停电范围。主保护和后备保护的配合、上下级保护之间的级差配合是选择性实现的关键。(2)速动性——快速切除故障，减小故障持续时间对设备的损害和系统稳定性的影响。要求保护动作时间+断路器跳闸时间尽可能短，一般110kV及以上快速保护动作时间<30ms。(3)灵敏性——保护对故障的反应能力，用灵敏系数K_sen衡量。要求K_sen≥1.5~2.0（根据保护类型和规程要求不同）。(4)可靠性——保护在应动作时不拒动、不应动作时不误动。双重化配置是提高可靠性的基本措施。\n保护配置原则：主保护（快速、有选择性切除被保护范围内的故障）+后备保护（主保护拒动或断路器失灵时动作，分远后备和近后备）。\n三段式电流保护——最经典的线路保护形式：Ⅰ段（电流速断）无时限，保护线路一部分（约80%），按躲过最大短路电流整定；Ⅱ段（限时电流速断）带0.3~0.5s时限，保护线路全长并有延时段配合；Ⅲ段（过电流保护）定时限或反时限，作为本线路和相邻元件的后备保护。\n距离保护——利用阻抗继电器测量故障点到保护安装处的阻抗（正比于距离）。三段式距离保护：Ⅰ段（保护线路80%~85%，无延时）、Ⅱ段（保护全长，延时0.3~0.5s）、Ⅲ段（后备保护）。受系统振荡影响，需配置振荡闭锁。\n差动保护——基于基尔霍夫电流定律，比较被保护元件两端或多端的电流相量和，区分内部故障和外部故障。灵敏度高、选择性好，是变压器、母线、发电机的主保护。", module:"m2", submodule:"2.7 继电保护", related:[] },
  { id:"2109", title:"微机型继电保护装置", tags:["微机保护","算法"], content:"微机保护装置基于DSP（数字信号处理器）或MCU实现保护的数字化。相比传统的整流型/晶体管型/集成电路型保护，微机保护在灵活性、精度、通信能力、事件记录等方面有质的飞跃。\n硬件架构：模拟量输入回路（CT/PT→变换器→低通滤波→ADC采样）→DSP/CPU核心板（保护算法计算、逻辑判断、故障决策）→开入开出回路（开关量输入检测、跳闸合闸出口）→通信接口（以太网/RS485/光纤，支持IEC 61850/IEC 103/Modbus等协议）→人机交互（液晶显示、键盘操作）。\n软件工作流程：采样（每周期24/32/48/80点，每周波采样率N取决于保护精度要求，80点/周波每周波采样间隔250μs）→数字滤波（傅里叶算法FFT提取基波分量，去除谐波和直流衰减分量）→保护算法计算（差分/阻抗/电流幅值等特征量计算）→逻辑判断（与门/或门/延时等保护逻辑组合）→出口动作（跳闸/合闸/报警/事件记录）。\n高级功能：(1)故障录波——记录故障前后各周波的波形数据，用于故障分析；(2)事件顺序记录SOE——记录各开关量的动作时刻（分辨率1ms），便于事故追溯；(3)自诊断——装置上电和运行中周期性自检，发现异常自动闭锁并告警；(4)通信联网——支持远方定值修改、远方复归、保护信息管理子站上传。\n发展趋势：集成化（保护+测控+录波一体化）、智能化（自适应整定、智能告警分析）、网络化（GOOSE/SV全站网络化跳闸采样，取消传统电缆接线）。", module:"m2", submodule:"2.7 继电保护", related:[] },
  { id:"2117", title:"变压器差动保护", tags:["差动保护","变压器","励磁涌流"], content:"变压器差动保护是变压器内部故障（匝间短路、相间短路、接地短路）的主保护，基于比较变压器各侧电流的相量和。理想运行情况下，变压器各侧电流折算到同一电压等级后相量和为零（流入=流出）。\n关键技术问题：(1)CT变比匹配——变压器各侧额定电流不同，需通过CT变比和平衡系数进行调整，使正常运行时的差流接近零。(2)相位补偿——Y/Δ接线变压器两侧电流相位差30°，通过软件算法进行相位校正（Y侧电流减相邻相电流再除以√3，或Δ侧电流进行角度旋转）。(3)励磁涌流——变压器空载合闸或外部故障切除后电压恢复时，由于铁心磁饱和产生的大电流（可达额定电流的6~8倍），仅流过电源侧，表现为差流，可能引起差动保护误动。励磁涌流特征：含大量二次谐波（基波的15%~50%）、间断角明显、衰减时间数秒（大型变压器可达数十秒）。\n制动措施：(1)二次谐波制动——检测差流中二次谐波分量占比，超过整定值（通常15%~20%）时闭锁差动保护，防止励磁涌流误动，是目前最有效最广泛使用的方法。(2)间断角原理——检测电流波形中每周期无电流的角度，间断角>65°时闭锁。(3)波形对称识别——比较电流波形的工频半波前后对称性，励磁涌流波形不对称。\n比率制动特性：差动保护的核心特性——动作电流随穿越性电流增大而增大，在外部故障大电流穿越时具有制动能力，防止CT饱和导致的误动。典型斜率：初始段0.2~0.5，拐点后0.5~0.8。差动速断段：差流超过一定值（通常4~6倍额定电流）不带任何闭锁直接动作，用于快速切除严重内部故障。", module:"m2", submodule:"2.7 继电保护", related:["→ 关联：电气基础理论 §1.3 — 变压器工作原理"] },
  { id:"2110", title:"SCADA系统", tags:["SCADA","RTU","遥测"], content:"SCADA（Supervisory Control And Data Acquisition，监控与数据采集系统）是电力系统调度自动化的基础平台，实现对电网运行状态的实时监视和控制。\n四遥功能：(1)遥测YC（Telemetry）——模拟量采集，包括电压、电流、有功功率、无功功率、频率、温度等电气和非电气量。通过RTU/测控装置以固定周期（通常1~5s）上传至调度主站。(2)遥信YX（Teleindication）——开关量采集，包括断路器位置（分/合）、隔离开关位置、保护动作信号、告警信号、设备状态等。状态变化触发变位上传（SOE时标精度1ms）。(3)遥控YK（Telecommand）——远程控制操作，包括断路器分合闸、电动隔离开关、电容器投切、变压器分接头调节等。遥控操作需经过选择→返校→执行的三步安全流程。(4)遥调YT（Teleadjustment）——远程参数设定，如变压器有载调压分接头档位设定、发电机有功/无功出力设定值等。\n采集终端设备：(1)RTU（Remote Terminal Unit）——传统的远动终端，用于变电站/发电厂的数据采集和监控，功能固定、可靠性高。(2)FTU（Feeder Terminal Unit）——馈线终端，用于配电网线路分段开关/联络开关的监控，支持配网自动化FA功能和故障检测。(3)TTU（Transformer Terminal Unit）——配电变压器终端，用于柱上变压器或箱式变的监测，采集电压/电流/有功/无功/功率因数等运行参数。\n通信协议：远动协议经历了CDT（循环式）、Polling（问答式，如部颁101规约）、IEC 61850三个阶段的发展。现代SCADA系统以IEC 61850和IEC 104（TCP/IP网络版101）为主流。", module:"m2", submodule:"2.8 调度自动化", related:["→ 关联：电气自动化 §3.5 工业通信协议"] },
  { id:"2111", title:"EMS能量管理系统", tags:["EMS","状态估计","调度"], content:"EMS（Energy Management System，能量管理系统）是电网调度中心的核心系统，在SCADA数据采集基础上提供更高层次的分析、优化和控制功能。DMS（配电管理系统）是EMS在配电网侧的延伸。EMS/DMS的边界随调度一体化趋势日益模糊。\n核心功能模块：(1)状态估计（State Estimation）——利用SCADA采集的实时量测数据（遥测和遥信），结合网络拓扑分析和加权最小二乘算法，估计出全网的完整运行状态（各节点电压幅值/相角、线路潮流）。功能：剔除不良数据、补充缺失量测、提高数据精度。可观测性分析是状态估计的前提。(2)自动发电控制AGC（Automatic Generation Control）——根据系统频率偏差和联络线交换功率偏差，自动调整发电机出力，维持频率在额定值和联络线功率在计划值。CPS（Control Performance Standard）标准用于评价AGC性能（北美NERC标准和中国两个细则标准）。(3)无功电压控制AVC（Automatic Voltage Control）——基于三级电压控制体系：一级为发电机AVR本地控制，二级为区域VQC协调（变电站层），三级为全网无功优化（调度中心层）。以网损最小或电压质量最优为目标，优化调整发电机端电压/无功出力、变压器分接头、电容器/电抗器投切。\n高级应用软件（PAS，Power Application Software）：(1)安全分析（SA）——N-1静态安全分析，预想故障集扫描，识别过载和电压越限；(2)调度员潮流（DPF）——在线潮流计算，用于操作前的模拟校核；(3)负荷预测（LF）——超短期（分钟级，用于AGC）、短期（日内至次日，用于发电计划和日前市场）、中期（月至年，用于检修和燃料计划）。神经网络和时间序列分析是最常用的预测方法。", module:"m2", submodule:"2.8 调度自动化", related:[] },

  // ===== m3: 电气自动化 =====
  { id:"2201", title:"PLC工作原理", tags:["PLC","扫描周期"], content:"PLC（可编程逻辑控制器）采用循环扫描工作方式：输入采样→程序执行→输出刷新。每扫描周期包含三个阶段：\n(1)输入采样阶段——CPU读取所有输入模块的信号状态（DI数字量/DO模拟量），存入输入映像区。此阶段输入状态在整个扫描周期内保持不变（即使外部输入变化也不影响）。(2)程序执行阶段——CPU从第一条指令开始依次执行用户程序，基于输入映像区和内部寄存器状态进行逻辑运算和算术运算，结果存入输出映像区。梯形图/LAD、功能块图/FBD、结构化文本/ST、指令表/IL、顺序功能图/SFC是五种标准编程语言（IEC 61131-3）。(3)输出刷新阶段——将输出映像区的状态一次性传送到输出模块，驱动外部设备（继电器/接触器/指示灯/电磁阀等）。\n扫描周期：扫描周期（Scan Time）=输入扫描时间+程序执行时间+输出刷新时间+通信处理时间+系统自检时间。典型扫描周期10~100ms，程序越大、指令越复杂则扫描周期越长。扫描周期直接影响系统实时性——周期越短实时响应越快。中断功能（硬件中断、定时中断、通信中断）可突破扫描周期的限制，在特定事件发生时立即执行。\n选型考虑：CPU处理速度（位指令执行时间ns级）、程序存储器容量（KB~MB）、DI/DO/AI/AO点数及扩展能力、通信接口类型和数量（以太网/RS485/Profibus/Profinet）。主流品牌：西门子S7系列（S7-1200/1500）、三菱FX/L系列、欧姆龙CJ/NJ系列、罗克韦尔ControlLogix/CompactLogix、汇川AM/AC系列。", module:"m3", submodule:"3.1 PLC", related:[] },
  { id:"2202", title:"PLC选型", tags:["PLC","选型","I/O"], content:"PLC选型需综合技术指标和工程需求：\n(1)I/O点数和类型——统计DI（按钮/限位开关/继电器触点/接近开关等）、DO（接触器线圈/电磁阀/指示灯等）、AI（4~20mA模拟量/PT100热电阻/热电偶等）、AO（调节阀/变频器给定等）的实际点数，预留15%~20%余量。I/O模块类型包括：DI（直流24V/48V，交流110V/220V）、DO（继电器输出/晶体管输出/晶闸管输出）、AI（电流4~20mA/电压0~10V/热电阻RTD/热电偶TC）、AO（电流4~20mA/电压0~10V）。(2)扫描速度——位指令执行时间（ns/指令）、浮点运算能力。高速处理需求（如运动控制、高速计数）需选择专用CPU或功能模块。(3)通信接口——现场总线（Profibus-DP/DeviceNet/CC-Link）、工业以太网（Profinet/EtherNet/IP/EtherCAT）、串口（RS232/RS485/RS422）。通信协议兼容性是选型关键。(4)扩展能力——本地扩展机架最大I/O点数、远程IO站支持（通过Profibus/Profinet等总线）。\n选型流程：控制需求分析→I/O点统计→确定PLC系列→选择CPU→选配I/O模块→配置通信模块→考虑电源模块→确定编程软件。\n主流品牌及特点：(1)西门子——S7-1200（小规模，支持Profinet，TIA Portal集成开发）、S7-1500（中大规模，高性能，支持多语言编程，安全集成）。(2)三菱——FX5U（小型，性价比高，CC-Link IE现场网络）、L系列（中型，性能介于FX和Q之间）、R系列（大型，高性能CPU，适合复杂控制）。(3)欧姆龙——NJ/NX系列（支持EtherCAT运动控制）。(4)罗克韦尔——CompactLogix（中小型，Logix平台统一编程）。(5)汇川——AM系列（中型PLC，EtherCAT总线，伺服运控一体化，性价比突出），AC系列（小型PLC，替代三菱FX）。", module:"m3", submodule:"3.1 PLC", related:["→ 关联：产品知识库 §9.6 — 汇川竞品"] },
  { id:"2210", title:"PID控制算法", tags:["PID","闭环控制","参数整定"], content:"PID控制器是工业控制中最广泛应用的闭环控制算法（占工业控制回路的90%以上）。\n数学表达式：u(t)=K_p×e(t)+K_i×∫e(τ)dτ+K_d×de(t)/dt。其中e(t)=SP-PV为偏差（设定值SP-过程值PV）。\n三个分量作用：(1)P（比例）——响应当前误差，e(t)增大则输出增大。K_p越大响应越快，但过大会引起振荡。纯比例控制存在静差（余差）。(2)I（积分）——消除静差，累积历史误差。积分时间T_i越小积分作用越强。积分饱和（Integral Windup）是重要问题——当执行器饱和时积分项持续累积导致超调，需采用抗积分饱和措施（条件积分/积分限幅/反馈跟踪）。(3)D（微分）——预测误差变化趋势（抑制超调）。微分时间T_d越大微分作用越强。纯粹的微分作用对噪声敏感（噪声放大效应），实际应用中采用不完全微分或一阶滞后滤波。\n参数整定方法：(1)Ziegler-Nichols整定法——基于阶跃响应曲线确定临界增益K_u和临界周期T_u，按ZN表格计算K_p/T_i/T_d。简单有效，适合一阶滞后系统（FOPDT），但整定结果可能导致较大超调（约50%）。(2)试凑法——先调P（消除大部分误差），再加I（消除静差），最后加D（抑制超调）。经验口诀：P大响应快但超调大，I小消除静差但积分慢，D大抑制超调但噪声敏感。(3)自整定——现代控制器内置自动整定功能（如西门子PLC的PID自整定块），通过继电器法或阶跃响应法自动获取参数。\n改进型PID：积分分离PID（误差大时取消积分作用避免超调，误差小时引入积分消除静差）、不完全微分PID（微分环节串联一阶惯性滤波，抑制高频噪声）、模糊PID（模糊逻辑在线调整PID参数，适应非线性时变系统）、串级PID（内环+外环，内环快速响应扰动，外环精细控制主变量）。在PLC/DCS中PID功能通常为标准功能块，用户只需配置参数即可使用。", module:"m3", submodule:"3.1 PLC", related:[] },
  { id:"2203", title:"变频器原理", tags:["VFD","V/F","矢量控制"], content:"变频器（VFD，Variable-frequency Drive）通过将工频交流电变换为频率和电压可调的交流电，实现交流电动机的调速运行。主电路拓扑采用交-直-交电压型结构：\n(1)整流部分——三相不可控整流桥（6脉波/12脉波），将工频交流电变为脉动直流。6脉波整流产生5次/7次特征谐波（流经电网，使输入电流THD可达30%~40%），12脉波整流主要产生11次/13次谐波（需配置整流变压器移相30°）。(2)中间电路——电解电容滤波平滑直流电压（支撑电容），充电电阻+接触器构成软启动电路，直流电抗器（选配）提高功率因数并降低谐波。制动单元（内含制动IGBT管+外接制动电阻）用于快速停机时的能量消耗，电动运行时IGBT管截止断开制动电阻的连接。(3)逆变部分——IGBT三相桥式逆变电路（PWM脉宽调制），将直流电逆变为频率和电压可调的交流电供给电机。\n控制方式：\n(1)V/F控制（恒压频比，Scalar Control）——保持U/f=常数，使电机磁通保持恒定（额定频率以下恒转矩，额定频率以上恒功率弱磁升速）。简单、低成本，适用于风机水泵等平方转矩负载（低压变频器基本标配V/F控制方式），但低速转矩小、动态响应差。(2)矢量控制（Vector Control，Field-Oriented Control）——将定子电流分解为励磁分量（产生磁通）和转矩分量（产生转矩），实现解耦控制。FOC在同步旋转d-q坐标系下对电流闭环调节，性能接近直流调速系统。无速度传感器矢量控制（不带编码器反馈，通过反电势观测器估计转速）适用于常规调速，有速度传感器矢量控制（带编码器PG卡反馈）适用于高精度场合。(3)直接转矩控制DTC——将定子磁链和转矩直接作为被控量（采用Bang-Bang控制：利用滞环比较器在误差超过允许范围时切换电压矢量），不进行旋转坐标变换和电流解耦，结构简单、动态响应最快（转矩响应时间<2ms）。主要代表为ABB的DTC技术。\n应用注意事项：变频器是主要的谐波源（需要配置进线电抗器/直流电抗器/输出电抗器抑制谐波和dV/dt），电机需考虑轴电流和绝缘问题（长线电缆传输时电压反射会加倍，导致冲击电压加于电机绕组首端，一般要求变频器输出端的电机电缆长度不超过限定值，超长电缆建议配置输出电抗器或du/dt滤波器），变频器输出侧不能连接电容器补偿。", module:"m3", submodule:"3.2 变频器", related:["→ 关联：电能质量治理 §6.3 — 变频器是主要谐波源"] },
  { id:"2204", title:"变频器选型", tags:["变频器","选型"], content:"变频器选型需综合考虑电机参数、负载类型、使用环境和技术要求：\n(1)电流匹配——变频器额定输出电流≥电机额定电流×1.1~1.2倍。重载应用（恒转矩负载如传送带、挤出机、压缩机）需进一步加大容量以提供足够的过载能力（通常以150%额定电流60s为典型过载能力）。轻载应用（平方转矩负载如风机、水泵）可适当降低变频器额定输出电流裕量。(2)过载能力——重载型（HD，Heavy Duty）—150%额定电流60s，轻载型（ND，Normal Duty）—110%额定电流60s。选型时必须明确区分。(3)电压等级——低压变频器三相380V/400V（主流应用范围，适配国内标准电压）、三相690V（大功率电机，适用于煤炭/石化等行业）、中压变频器3kV/6kV/10kV（高压变频器，采用功率单元级联多电平方案，适配大功率电机，一台高压变频器包含多个功率单元，每个功率单元为三相输入单相输出的低压PWM变频器）。\n谐波抑制配置：(1)进线电抗器（AC Input Reactor，2%~4%压降）——抑制高次谐波、限制浪涌电流、改善功率因数，一般标配。(2)直流电抗器（DC Link Reactor）——串联在直流母线中，对谐波抑制效果优于交流电抗器，显著降低输入电流THD（约从80%~100%降至30%~40%）。(3)EMC滤波器——用于抑制变频器产生的传导电磁干扰（满足EN 55011标准）。\n其他选型要素：(1)控制方式选择（V/F/矢量/转矩控制）；(2)通信接口需求（标配RS485 Modbus，可选Profinet/EtherNet/IP/EtherCAT/Profibus-DP等通讯扩展卡）；(3)制动单元和制动电阻（快速停机/位能负载下放时使用，制动斩波管导通时将再生能量消耗在制动电阻上，能量回馈型变频器可将再生能量回馈电网）；(4)使用环境（防护等级IP20/IP54，环境温度，海拔降容）。主流品牌：西门子（G120/S120）、ABB（ACS580/880）、丹佛斯（FC302/FCD300）、三菱（FR-F800/FR-A800）、汇川（MD500/MD800/HD9X系列高压变频器）。", module:"m3", submodule:"3.2 变频器", related:[] },
  { id:"2205", title:"伺服系统组成", tags:["伺服","编码器","闭环"], content:"伺服系统（Servo System）是以位置、速度、转矩为控制量的高精度闭环控制系统，广泛应用于工业机器人、数控机床、电子制造、包装机械等需要精确定位和快速响应的场合。\n系统组成三要素：(1)伺服驱动器——接收上位控制器（PLC/运动控制器）的位置指令或速度转矩指令，完成三环控制和功率放大。驱动器内部完成位置环、速度环、转矩环的全部或部分运算（根据控制模式和应用分配决定），输出PWM波驱动伺服电机。(2)伺服电机——永磁同步电机（PMSM，转子上贴有永磁体，无需励磁电流，效率高、发热小）为主流。低压伺服（DC24~220V，AC220V，小功率应用<3kW）和高压伺服（AC380V，大功率应用）。电机尾部安装编码器用于反馈。(3)编码器（反馈元件）——增量式编码器（输出A/B/Z脉冲，AB两相正交脉冲信号，Z相零位脉冲，断电位置丢失）或绝对值编码器（单圈/多圈，串行通信协议如BiSS/C、EnDat、SSI/Hiperface DSL，多圈绝对值编码器圈数为4096圈，断电保持位置记忆），分辨率从17bit到23bit甚至更高。\n三环控制架构：从内到外依次为电流环→速度环→位置环，内环响应速度最快、带宽最宽（电流环带宽约1~3kHz），外环响应最慢（速度环带宽约100~500Hz，位置环带宽约数十Hz），三环串联共同保证位置精度、响应速度和系统稳定性。\n通信接口：脉冲/方向（Pulse/Direction，传统方式，最高脉冲频率约500kHz~4MHz）、模拟量速度转矩给定（±10V，0~±10V模拟量对应-额定转速~+额定转速，0~±10V模拟量对应0~额定转矩）、总线控制（EtherCAT——运动控制总线的最主流选择，最小循环周期可达125μs~250μs，数十个伺服轴可在1ms内完成同步位置刷新、Profinet IRT——西门子驱动系统首选，等时同步实时模式抖动<1μs、MECHATROLINK——安川/三菱/松下支持、CANopen CIA402协议、Modbus RTU等）。\n关键指标：响应频率（Hz，典型1~3kHz）、速度波动率（<0.01%）、定位精度（取决于编码器分辨率）、过载能力（3倍峰值电流/3倍过载转矩，持续时间3s）。主流品牌：安川（Σ-7系列）、三菱（MR-JE/J4/J5）、松下（MINAS A6/A7）、西门子（V90/S120）、汇川（SV660/SV680）、台达（ASDA-A3/B3）。", module:"m3", submodule:"3.3 伺服系统", related:[] },
  { id:"2206", title:"伺服电机类型", tags:["伺服电机","永磁"], content:"伺服电机是实现精准控制的执行元件。主流类型为永磁同步伺服电机（PMSM），部分大功率特殊场合使用直流无刷电机或异步伺服电机。\n永磁同步伺服电机工作原理：定子多极绕组通入正弦交流电产生旋转磁场（采用SPWM或SVPWM调制，绕组为分布式或集中式，极化常采用分数槽集中绕组以减小齿槽转矩），转子永磁体产生恒定磁场（常用的永磁体材料为钕铁硼NdFeB——剩磁高、矫顽力高，或钐钴SmCo——耐高温、高居里点但价格昂贵），定转子磁场同步旋转。定转子磁场相互作用产生电磁转矩。\n按结构分类：(1)表贴式SPM（Surface-mounted PM）——永磁体贴在转子铁心外表面，制造简单、d轴和q轴电感相等或接近（L_d≈L_q），反电势波形为正弦波，适用于中小功率通用伺服（一般3000rpm以下额定转速应用）。(2)内嵌式IPM（Interior PM）——永磁体嵌入转子铁心内部（V型或U型或W型排列），d轴和q轴电感差异大（L_q>L_d），能产生磁阻转矩（利用d-q电感差产生的磁阻转矩提升转矩密度），适用于高速和大功率场合，反电势波形仍为正弦波。\n按电压等级：(1)低压伺服电机——DC24~220V或AC220V供电，功率范围50W~3kW，广泛应用于电子制造设备3C行业、自动化装配线、包装设备、医疗器械等中小功率精准定位场合。(2)高压伺服电机——AC380V供电，功率范围1kW~15kW以上，应用于大负载设备（注塑机、折弯机、冲压设备、机器人等），电流小、线缆长距离传输降压小。\n关键参数：额定转速（1000~6000rpm，通常3000rpm、1500/2000rpm为最常规额定转速）、额定转矩（0.16~48+Nm，系列化产品）、峰值转矩（3倍额定转矩，持续约3s）、转动惯量（与加速响应速度成反比，低惯量电机适合快速启停场合）、反电势常数Ke[V/krpm]和转矩常数Kt[Nm/A]（二者成比例关系）、齿槽转矩（应低于额定转矩的1%~2%，设计上通过斜槽或磁钢错位或定子齿辅助槽等方法抑制齿槽转矩）、防护等级（IP54/IP65/IP67）、绝缘等级（F级155℃/H级180℃）。", module:"m3", submodule:"3.3 伺服系统", related:[] },
  { id:"2207", title:"DCS集散控制系统", tags:["DCS","分散控制","集中管理"], content:"DCS（Distributed Control System，集散控制系统）采用分散控制、集中管理的设计理念，将控制功能分散到各现场控制站，将监视操作集中到中央控制室，尤其适合大型流程工业的连续生产过程控制。\n系统架构（四层）：(1)现场层——传感器、变送器、执行器（阀门定位器、变频器、电机等）。(2)控制层——控制站（冗余控制器+IO卡件），完成数据采集、回路控制（PID调节回路）、顺序控制、联锁保护等功能。控制器冗余配置（1:1热备冗余，主控制器故障时备用控制器在1~2个控制周期内无缝切换，保证控制不中断），IO卡件支持带电热插拔。控制站按工艺区域分散布置。支持多种IO类型：AI/AO/DI/DO/RTD/TC/PI脉冲输入。(3)操作层——操作员站（HMI，人机界面，实时监控工艺流程图、趋势曲线、报警管理、历史记录查询）、工程师站（系统组态、控制回路图编程、逻辑组态、画面开发、数据库管理、系统维护诊断）、历史站（存储归档历史数据，通常保存1年以上）。操作站和工程师站冗余服务器（可互为备用，容错切换）。(4)管理层——实时数据库、先进控制APC（Advanced Process Control: 先进过程控制，包括多变量预测控制MPC、软测量、优化控制等）、生产执行系统MES（Manufacturing Execution System）接口，连接企业资源计划ERP。\n典型品牌和适用领域：(1)艾默生——DeltaV（过程工业，流程优化和先进控制能力强大，主要应用于石油天然气、炼油化工等连续过程），Ovation（电力行业专用，市场占有率高）。(2)中控——ECS-700（国产DCS龙头，国内市场占有率连续多年第一），WebField系列（化工、炼油、煤化工等流程工业应用广泛）。(3)ABB——System 800xA（高端DCS系统，电气和过程控制一体化集成，安全仪表系统SIS可选TüV认证）。(4)西门子——PCS 7（传统西门子DCS，以SIMATIC Manager为组态平台，过程工业和电力均有应用），PCS neo（新一代基于Web的DCS系统，全浏览器访问，资产管理和数字化集成创新）。(5)和利时——MACS K系列/6系列（中低端DCS市场，在热电、化工等成本敏感领域有好的性价比）。\nDCS与PLC的区别：DCS侧重过程控制（连续调节回路多，PID控制是核心）、冗余可靠性（控制站控制器双冗余、电源冗余、通信网络冗余，系统级冗余配置全面）、I/O规模大（成千上万点），系统组态强调画面美观和操作友好。DCS组态侧重流程图绘制（操作员可直观看到带实时数据和动态效果的工艺画面）和趋势报警历史记录。PLC侧重逻辑控制和快速响应（运动控制、高速计数等），典型扫描周期短，编程灵活（梯形图等），在制造自动化中占主导。现代DCS和PLC的功能边界在模糊——大型PLC系统也可完成回路控制，DCS也支持逻辑控制。", module:"m3", submodule:"3.4 DCS & SCADA", related:["→ 关联：弱电与智能化 §4.4 BAS — 架构理念相似"] },
  { id:"2211", title:"SCADA系统架构", tags:["SCADA","RTU","四遥"], content:"SCADA（监控与数据采集系统）分为调度主站、通信通道和远方终端三层架构。在本模块中侧重通用SCADA架构和功能描述（电力调度专用SCADA详见m2 §2.8）。\n(1)调度主站层——服务器（实时数据服务器/历史数据库服务器/通信前置服务器/WEB服务器）和工作站（调度员工作站/维护工作站/报表工作站）。前置机是主站与RTU/测控装置通信的枢纽，完成规约转换和数据预处理，一般双机冗余布置。(2)通信通道——光纤以太网（主通道，OPGW/ADSS光缆，TCP/IP协议协议栈承载IEC 104/DNP3规约）、GPRS/4G/5G无线（备用通道，用于偏远站点和移动监控目标）、载波/微波（老旧线路尚有保留）。通道需具备冗余和自动切换能力。(3)远方终端层——RTU/FTU/TTU/测控装置/保护管理机，分散安装在各厂站和线路节点，负责信号采集和命令执行。\n四遥功能：遥测YC（模拟量采集，通过A/D转换将传感器和变送器的4~20mA/0~10V/电压电流互感器二次值等模拟量转换为数字量上传）、遥信YX（开关量采集，光电隔离输入，采集断路器/隔离开关/继电器触点的通断状态，SOE分辨率1ms）、遥控YK（远程命令执行，通过DO输出控制继电器或直接驱动操作回路，遥控选择→返校→执行三步操作流程）、遥调YT（设定值远程下发，如变压器分接头档位或有功出力目标值的远方设定）。\n性能指标：遥测精度≤0.5%（0.5级，标准电力远动装置精度要求），全站数据刷新周期<1~5s（模拟量）/<1s（开关量变位变位时主动上传，变位传输延时<1s）、遥控动作成功率≥99.99%、系统可用率≥99.9%。SCADA系统拓展能包括馈线自动化FA、分布式电源监控、需求侧响应、配电自动化等高级应用。", module:"m3", submodule:"3.4 DCS & SCADA", related:["→ 关联：电力系统 §2.8 — SCADA在调度自动化中的应用"] },
  { id:"2208", title:"工业通信协议", tags:["工业以太网","Profinet","Modbus"], content:"工业通信协议是工业自动化的神经系统，分现场总线（Fieldbus）和工业以太网（Industrial Ethernet）两大类。\n现场总线协议：(1)Modbus RTU/ASCII（施耐德电气1979年推出，是应用最广泛、最基础的总线协议）——主从架构（单主站，多从站，最多247个从站地址），物理层RS232（点对点，距离15m）、RS485（差分信号，支持多站，距离1200m，波特率9.6k~115.2kbps，典型的Modbus RTU都采用RS485物理层）。功能码：01（读线圈）、02（读离散输入）、03（读保持寄存器）、04（读输入寄存器）、05（写单线圈）、06（写单寄存器）、15（写多线圈）、16（写多寄存器）。RTU模式二进制传输（CRC16校验），ASCII模式文本传输（LRC校验）。(2)Profibus-DP（西门子主导，主要用于西门子PLC与分布式IO/驱动器之间的高速通信）——RS485物理层，传输速率最高12Mbps（速率越高，传输距离越短，12Mbps时最长传输距离100m，加中继器可扩展至1900m），最多126个站点。DP（Decentralized Periphery）特指分布式外围设备通信协议，PA（Process Automation）扩展用于本质安全过程自动化。(3)CANopen（基于CAN总线，广泛应用于运动控制、车辆、电梯等实时通信场景）——对象字典OD（Object Dictionary）机制，PDO（过程数据对象，广播模式，高优先级用于实时性要求高的周期性数据交换）和SDO（服务数据对象，客户端/服务器模式，低优先级用于参数配置和非周期性数据交换）两种通信模式。(4)CC-Link（三菱电机主导，主要在亚洲市场使用广泛）——1对N的广播-轮询通信方式，循环数据通信和瞬时传输，传输速率10Mbps。\n工业以太网协议：(1)Profinet（西门子主导，是Profinet家族系列网络应用层最广泛推广的成员）——分为RT（实时通信，典型周期1~10ms，用于工厂自动化大部分应用）和IRT（等时实时，抖动<1μs，用于运动控制多轴同步，如T-CPU+S120方案）。基于标准以太网IEEE 802.3，100Mbps全双工，支持星形/环形（环网冗余MRP协议）/树形拓扑。最小循环周期：RT~1ms，IRT~250μs。(2)EtherNet/IP（罗克韦尔/ODVA主导，以标准TCP/IP/UDP/IP封装CIP协议）——基于CIP协议的应用层一致性。标准以太网硬件，TCP封装CIP用于显式报文（参数设置、配置、诊断组态等非实时数据通信），UDP封装CIP用于隐式报文（IO数据实时通信）。采用生产者-消费者模型实现多站同步。(3)EtherCAT（倍福Beckhoff主导，超高速性能越来越成为运动控制首选协议）——处理数据“On the Fly”：以太网帧经过每个从站时，从站读取并插入自己的数据，帧延时可短至ns级别。最小循环周期可达125μs（1000个数字IO分布式处理）、12.5μs（运动控制典型应用，50μs循环周期可支持100个伺服轴），是运动控制实时性最高的工业以太网协议之一。(4)CC-Link IE（三菱主导，基于千兆以太网）——1Gbps带宽，现场网络CC-Link IE Field和控制器网络CC-Link IE Control。性能可达千兆级带宽。\n趋势：工业以太网已逐步取代传统现场总线。OPC UA（平台无关的通信架构，数据建模统一，安全机制完善，支持信息模型，是工业4.0的推荐通信架构）和TSN（时间敏感网络，在标准以太网基础上提供确定性低延时，是实现统一网络IT与OT融合融合的网络基础）是下一代工业通信的重要方向。", module:"m3", submodule:"3.5 工业通信", related:["→ 关联：弱电与智能化 §4.5 系统集成 · 电力系统 §2.7 SCADA"] },
  { id:"2209", title:"组态软件", tags:["HMI","组态","人机界面"], content:"组态软件（HMI/SCADA组态软件）用于创建人机界面（HMI，Human-Machine Interface），实现生产过程的可视化监控、操作和控制。\n核心功能：(1)可视化界面——工艺流程图的绘制和动画（管道流动、电机旋转、液位变化、数值动态刷新），支持丰富的图库和自定义图元。开发时画图组态：利用图库素材/自定义元件绘制工艺画面，绑定变量，配置动态效果（颜色变化/移动/闪烁/数值动态显示等用户帮助理解的视觉反馈）。(2)数据采集——通过通信驱动与PLC/DCS/仪表等控制器连接（支持多品牌多协议同时通信——OPC DA/UA、Modbus TCP/RTU、Profinet、Siemens S7 MPI/PROFINET、Mitsubishi MC协议、Omron FINS等），实时读取标签变量并在画面显示。(3)报警——变量越限、开关状态变化触发报警。分级（一级紧急/二级重要/三级一般/信息），需确认，记录归档（报警日志，保存不少于90天或6个月），支持声音报警、短信通知、邮件通知（通过OPC报警与事件接口实现和SCADA系统的报警数据一致性管理）。(4)趋势曲线——实时趋势（滚动刷新显示多变量的当前时间曲线，便于监视变量的短期变化趋势和调节响应）和历史趋势（调用历史数据库回放特定时间段变量的变化曲线，便于事后分析和统计），支持多变量同图比较。(5)数据记录——数据库存储（SQL Server/MySQL/SQLite等关系数据库或专用的实时/历史库），支持查询/分析/导出（Excel报表等数据导出功能，支持日报/月报/年报和班报）。\n主流产品：(1)WinCC（西门子）——功能全面（支持脚本/VBS、多语言、报警归档、变量归档、报表、用户管理等功能完整的SCADA），与TIA Portal深度集成，支持面板/PC/Web多种部署方式。WinCC Unified是最新一代，基于Web的HMI，全浏览器访问，现代UI。WinCC Professional适合中型到大型SCADA应用。(2)iFix（GE/艾默生）——在电力行业（电厂监控、变电站监控）市场份额高，SCADA能力强（尤其分布式SCADA结构，远程站点管理稳定），支持VBA脚本和强大的报警管理。(3)组态王 KingView（亚控科技）——国产组态软件龙头，性价比高，支持设备驱动丰富，中低端市场占有率高。主要应用于中小型自动化项目。KingSCADA是全新升级的SCADA平台。(4)其他——Intouch（施耐德电气/Wonderware）历史悠久，用户基础广泛，应用程序开发环境Arena集成开发环境；Citect（施耐德）在矿业和冶金领域有较强应用经验和技术积累；KEPServerEX（OPC统一服务器，为所有组态软件提供统一的数据连接平台）。\n发展趋势：Web化（HTML5浏览器访问，无需安装客户端，改进系统易用性和远程访问能力——WinCC Unified/iFix WebSpace/组态王WEB版均采用B/S架构）、移动化（移动巡检app，支持手机/平板浏览监控画面）、云化（与AWS/Azure/阿里云集成实现远程数据存储和分析，如西门子MindSphere和Insight Hub）。", module:"m3", submodule:"3.6 组态软件", related:[] },
  { id:"2212", title:"工业机器人分类", tags:["机器人","六轴","SCARA"], content:"工业机器人是面向工业领域的多关节机械手或多自由度的自动化装置，在制造业中承担焊接、搬运、装配、喷涂、打磨、分拣等多种工艺任务。\n按机械结构分类：(1)六轴关节型机器人（6-axis articulated robot）——最通用、最灵活的工业机器人，6个关节（J1回旋、J2大臂、J3小臂、J4腕部旋转、J5腕部摆动、J6腕部旋转，六个自由度实现工作空间内任意位置任意姿态可达）提供6自由度运动。工作域近似球形（可达范围取决于臂长），能到达工作空间内的任意位置和姿态。典型负载6~500kg（等级划分：6kg小型、10~50kg中型、100kg以上大型、500kg超大型码垛专用），臂展0.7~4m。广泛应用于弧焊、点焊、搬运、码垛、喷涂、装配等。(2)SCARA机器人（Selective Compliance Assembly Robot Arm，平面关节型机器人）——4轴（Z轴升降+Z轴旋转+大臂旋转+小臂旋转），水平面内柔顺性好（水平方向可灵活移动）、垂直方向刚性好（适合垂直插入动作）。速度快（循环时间<0.5s）、定位精度高（±0.01~0.02mm），主要用于电子元件的平面贴装/装配/分拣/高速搬运工作。SCARA在3C制造行业（手机组装、芯片封装等精细作业）应用极其广泛。(3)并联机器人（Delta型）——3轴（三根主动臂+三根从动臂）或4轴（+末端旋转），末端通过三根并联的驱动臂同时动作，高速轻载。最大速度可达10m/s（标准6轴机器人速度约1~2m/s），加速度可达100m/s²以上。适用于食品分拣、药品包装、电子元件高速拾放等快速取放（Pick & Place）场合。(4)协作机器人（Cobot）——轻量化、带力觉传感（各轴均内置力矩传感器，检测碰撞力，碰撞检测灵敏度<50N甚至更低）、安全性高（满足ISO 10218-1和最新的ISO/TS 15066技术规范——力/力矩限制安全要求），可与人同区域工作无需安全围栏或仅需较低安全围栏。负载3~16kg，臂展0.5~1.3m。典型品牌：优傲UR（Universal Robots，协作机器人先驱）、发那科CRX系列、ABB GoFa、遨博Aubo、节卡JAKA、艾利特Eli等。(5)直角坐标机器人（Cartesian/Gantry）——3个直线运动轴（XYZ），刚性好、定位精度高、成本低，但体积较大（工作空间为矩形立方体，由导轨长度决定），常用于码垛和机床上下料。(6)圆柱坐标机器人（Polar/Cylindrical）——2个直线轴+1个旋转轴，臂展大但精度一般，应用逐步减少。\n关键指标：自由度（典型4~6~7轴，7轴冗余自由度可达空间内避障）、重复定位精度（±0.02~0.1mm六轴典型，±0.01~0.02mmSCARA典型）、最大负载（kg）、工作半径（mm）、运动速度（°/s各关节，m/s末端线速度）、防护等级（IP54/IP65/IP67标准，铸造版可选IP67及以上重载防护）。\n主流品牌：发那科FANUC（六轴出货量最大）、库卡KUKA（汽车制造焊装线占有率强）、ABB（IRB系列，控制柜技术领先，精雕焊接优势明显）、安川Yaskawa（Motoman系列，弧焊应用领域优势明显）、川崎Kawasaki（大型机器人比例高）、埃斯顿Estun（国产工业机器人销量第一梯队）、汇川/众为兴（SCARA出货量领先国产）、新松SIASUN（中科院背景，产品线广）。", module:"m3", submodule:"3.7 工业机器人", related:["→ 关联：电气自动化 §3.3 伺服系统 — 机器人驱动基础"] },

  { id:"2301", title:"综合布线系统", tags:["布线","光纤","六类"], content:"综合布线系统（Premises Distributed System, PDS）是智能建筑的基础传输网络，按EIA/TIA 568标准和ISO/IEC 11801规范设计，将语音、数据、图像等信号的传输线缆统一规划敷设。\n六大子系统（按EIA/TIA 568B定义）：(1)工作区子系统——信息插座（RJ45面板/地插/光纤面板）、终端设备连接跳线。水平信息点间距3~5m，每个工作区配置不少于2个信息点（1语音+1数据）。(2)水平子系统——从楼层配线架FD到信息插座的线缆。六类非屏蔽双绞线UTP（Cat6，250MHz，支持千兆以太网，铜缆布线实际最大水平距离90m，屏蔽层接地需良好，屏蔽F/UTP在抗干扰要求高的场景推荐使用），超六类（Cat6A，500MHz，10GBase-T万兆传输距离可达100m，是当前新建布线工程的首选推荐等级），八类线（Cat8，2000MHz，30m之内支持25G/40GBase-T短距离高速传输，用于数据中心交换机内部TOR交换机-服务器互联）。(3)垂直干线子系统——连接各楼层配线架FD和主配线架BD的骨干线缆。光纤为主（单模OS2长距离大容量，多模OM3/OM4/OM5短距离高速率）＋大对数语音电缆（25/50/100对三类线用作电话干线备份）。(4)设备间子系统——安装主配线架BD、核心交换机、PBX电话程控交换机、服务器机柜等。设备间需满足温湿度（18~27℃，30%~50%）、接地（接地电阻<1Ω）、防静电、防雷、UPS不间断供电条件。(5)管理子系统——分配线架FD和管理跳线。配线架端口与信息点一一对应，标签管理（TIA/EIA-606-A标签标准规范），水平配线架宜采用模块化结构，方便维护和调整。(6)建筑群子系统——连接多栋建筑的主干光缆（室外单模光纤，地埋穿管或架空敷设）和大对数铜缆（不建议室外采用金属电缆，应加装防雷和浪涌保护器SPD）。\n光纤分类：单模OS2（G.652.D/G.657，1310nm/1550nm传输窗口，10km以上超长距离高速传输，10G/40G/100G/400G均可，数据中心和运营商骨干网首选）和多模（OM3 — 300m@10Gb/s，OM4 — 550m@10Gb/s / 150m@40/100Gb/s，OM5宽带多模专为SWDM短波波分复用优化，在4对40/100Gb/s传输中降低光纤数量）。\n通道测试：(1)永久链路测试——线缆施工完成后按GB 50312国家标准测试Cat6及以上等级的布线必须使用认证级数字电缆分析仪（如Fluke DSX系列）按标准中的永久链路+信道方案进行连接性测试（T568B线序、长度、近端串扰NEXT、衰减、回波损耗RL、综合等效远端串扰PS-ELFEXT、传输时延、时延偏移等参数测试，所有项目指标符合标准规定为通过，由测试仪出具测试报告作为竣工验收文档）。(2)光纤链路测试——OTDR光时域反射仪插入法或远端环回法，1310nm/1550nm波长双向测试损耗和长度，光源光功率计双波长单/双向测试插入损耗。多模光纤优选850nm/1300nm窗口，单模光纤优选1310nm/1550nm窗口。", module:"m4", submodule:"4.1 综合布线", related:[] },
  { id:"2303", title:"安防系统组成", tags:["CCTV","门禁","入侵"], content:"安防系统（Security System，SAS）是智能建筑的基本子系统，包含视频监控、门禁控制、入侵报警、电子巡更、周界防范和停车管理等多个子系统，通过综合安防管理平台统一集成。\n(1)视频监控CCTV——前端摄像机（模拟摄像机BNC同轴已逐步淘汰，IP网络摄像机为主流。分辨率从720P/1080P到5MP/4K/8K，枪机/半球/球机/全景鱼眼/云台PTZ。按照芯片靶面尺寸定义低照度性能和夜视能力，内置AI的视频分析边缘处理能力，人脸抓拍、车牌识别、烟火检测、物品遗留）。传输POE供电（IEEE 802.3af 15.4W/at 30W/bt 60~90W）＋以太网线缆（六类线），远距离光纤传输（核心交换机至NVR/管理平台）。NVR网络录像机存储（H.265压缩算法，存储周期30~90天，存储容量计算公式：总码率(Mbps)×3600×24×存储天数÷8÷1024=TB。典型4M主码流+1M子码流）。(2)门禁控制ACS——读卡器（IC卡/Mifare/NFC识别——刷卡碰卡识别，生物识别——指纹/人脸/掌纹。读卡器内置于门禁一体机或分离式设计）、控制器（TCP/IP联网或RS485总线，每个控制器带2~4门，门数多的大型项目采用两门控制器单元拼装方案）、电磁锁（断电开/通电开型选型，280kg/600lb拉力选型）、出门按钮、门磁传感器。TCP/IP联网架构（控制器与主控服务器之间以以太网通信，远程实时管理、脱机事件缓存上传、开门权限管理、实时刷卡记录查看、远程开门）。\n(3)入侵报警——探测器（被动红外PIR探测——人体热辐射感应，双鉴探测器在被动红外基础上增加微波模块对共同感应确定入侵以减少误报——PIR+微波双技术，玻璃破碎探测器、振动探测器、门磁。周界探测：红外对射/激光对射/脉冲电子围栏/振动光纤）。报警控制器带多个防区，支持布防/撤防（键盘/遥控器/远程APP），报警输出联动视频录像、声光警号、短信通知。系统响应时间<2s，误报率需控制在较低水平。(4)电子巡更——离线式巡更（巡更棒+信息纽扣，巡更人员携带巡更棒到各巡更点触碰信息纽扣记录时间，按时上传数据）或在线式巡更（利用门禁读卡器兼作巡更点，直接联网，可实时监督巡更路线完成情况）。(5)周界防范——红外对射/脉冲电子围栏（对地绝缘立杆+合金线+脉冲高压主机，产生的脉冲高压具有威慑作用，误报率低）/振动光纤/视频周界AI分析。\n综合安防管理平台：集成视频、门禁、报警、巡更、消防（仅接收火灾报警信号联动周边摄像机录像）等子系统，统一管控、联动策略。安防系统控制中心设置安保人员值班坐席，大屏显示拼接（液晶拼接屏/小间距LED 显示各子系统界面和实时告警弹窗）。标准规范：GB 50348安全防范工程技术标准、GB 50394/GB 50395/GB 50396。", module:"m4", submodule:"4.2 安防系统", related:[] },
  { id:"2309", title:"视频监控系统", tags:["监控","IPCamera","NVR"], content:"视频监控系统是安防系统的核心可视化组成部分，经历模拟时代（DVR）到全IP数字高清时代（NVR）的跨越式发展。\n前端摄像机：(1)枪式（固定焦距或电动变焦，外形为长方体，适用监控固定区域，如楼道口、办公楼大厅、收费站等，配补光灯实现夜视）。(2)半球（吸顶或壁装，造型美观，适用室内场景，内置红外LED实现夜视0Lux补光）。(3)球机PTZ（云台控制，支持360°水平旋转+90°垂直旋转，自动巡航+预置位+花样扫描，适用大范围场景，如广场/园区/操场）。(4)全景鱼眼——单台摄像机可覆盖360°全景或180°全景，全景拼接画面输出，监控大范围无盲区，一个鱼眼可代替4~6个普通枪机。分辨率主流200万/500万/800万像素，编码H.265/H.265+（智能编码，可节省50%~70%存储空间，在H.264编码基础上存储减半，系统改造存储升级时码率及容量重新核算）。智能分析功能：越界闯入检测、区域入侵、目标追踪、物品遗留/丢失检测、人数统计、人脸检测抓拍比对、车牌识别、烟火检测、视频诊断（视频遮挡/信号丢失/图像模糊/场景变更检测均在检测范围内）。\n传输：摄像机通过网线连接到PoE交换机供电和数据一体传输（IEEE 802.3af/at/bt标准，无源PoE交换机无法兼容所有摄像机，优质PoE交换机自动PD协商，最大供电距离100m），远距离采用光纤收发器（单模1310nm，20km）+交换机级联。骨干网核心交换机连接所有NVR和存储阵列及视频管理平台服务器。\n存储：(1)NVR网络录像机——前端摄像机通过局域网接入NVR，NVR直接录像存储和管理。根据摄像机接入数量（16路/32路/64路/128路）和存储容量、录像存储周期来确定NVR硬盘配置（通常4~16块SATA/SAS硬盘，总容量可达80TB以上硬盘单盘最大支持16~22TB）。录像存储周期：普通场景≥30天，重点区域≥90天（GB 50348安防工程技术规范）。(2)视频管理平台——对接入的摄像机/NVR进行统一管理、授权控制、流媒体转发（客户端取流和录像回放的多用户并发取流管理）、报警联动、设备运维、大屏上墙控制、移动端（手机App/Web浏览器）远程查看。(3)视频智能分析服务器——独立的GPU服务器（多路视频流并行实时分析），部署人脸识别算法/结构化分析/行为分析等算法。边缘计算为AI摄像机前端分析场景，中心服务器集中大规模数据分析处理。\n标准规范：GA/T 367视频监控联网系统信息传输、交换、控制技术要求，GB 35114公共安全视频监控联网信息安全技术要求（含视频加密和安全认证）。", module:"m4", submodule:"4.2 安防系统", related:[] },
  { id:"2310", title:"门禁系统", tags:["门禁","生物识别","电磁锁"], content:"门禁系统实现对出入口的授权管理，记录出入事件，防止未授权人员进入受控区域。\n系统组成：(1)前端识别设备——读卡器（IC/Mifare/NFC读卡，CPU卡安全等级高、可双向认证。读卡频率13.56MHz，读卡距离3~8cm，也可选用密码键盘读卡器）。生物识别（指纹仪——光学/电容/射频指纹扫描，人脸识别门禁一体机——近红外活体检测+人脸比对算法，指静脉识别——安全等级最高，无法复制，适用于高安全等级场景，静脉识别读取手指内部血管纹理结构）。二维码/蓝牙/手机NFC门禁常用于访客预约系统。身份识别组合可以实行单因子（刷卡）或者双因子（刷卡+密码或刷卡+指纹，较高安全防护场景采用双因子+组合验证）的门禁认证。(2)门禁控制器——每个控制器控制1~4门（大型项目通常每个门区配置一台两门控制器以利灵活布点）。脱机工作能力：当与管理服务器通信中断时，控制器内置存储单元可存储10万条以上事件记录，保证本地开门功能正常，在网络恢复后自动上传事件记录。RS485总线联网或TCP/IP联网。重要项目建议配置TCP/IP+RS485双总线冗余，TCP/IP为主通道，RS485为备用通道。(3)电锁——电磁锁（断电开/通电开，断电开型符合消防要求——火灾时自动断电解锁，方便逃生，但安防逻辑要求加装门磁检测，断电开型是常态，通电开型用于特殊场景如高安全等级的金库机房）。电插锁（用于玻璃门、木门等）。灵性锁（可用于双开门，支持多种开门信号）。(4)出门设备——出门按钮（单开/双开设计）、红外/微波双鉴出门传感器（自动感应开门，适用人行通道，带防尾随逻辑）。\n系统架构：控制器→通信网络→管理服务器→管理客户端。上层管理软件完成人员授权管理（人员信息库+通行权限分组+时段分组+区域分级）、实时监控（刷卡事件/门状态/报警事件/远程开门/反潜回/多人开门/首卡开门/消防联动/互锁监控）、事件记录查询、系统联动（与消防联动：火警信号联动控制器断电开锁。与CCTV联动：门异常打开抓拍报警）。权限控制粒度可以做到人员群组/时间段/门点/权限例外。\n安全等级：按GB/T 32581入侵和紧急报警系统技术要求，高安全场景需要防拆（门禁控制器/读卡器自身带有防拆开关）、防撬、防复制（CPU卡加密、生物识别活体检测）。系统需支持胁迫报警功能——在胁迫状态下输入特殊密码/特定开门方式+自动静默报警。", module:"m4", submodule:"4.2 安防系统", related:[] },
  { id:"2302", title:"火灾自动报警系统", tags:["FAS","探测器","联动"], content:"火灾自动报警系统（FAS，Fire Alarm System）是建筑消防的核心，通过探测器实时监测火灾初期的烟雾、火焰、温度等特征参量，早期发现火灾并自动联动消防设备，是GB 50116《火灾自动报警系统设计规范》的核心设计内容。\n探测器类型：(1)感烟探测器——离子式（对阴燃火敏感，含微量放射源）和光电式（对明火敏感，散射光原理，是主流。光电感烟探测器迷宫结构，LED发射器+接收器，烟雾颗粒进入迷宫使进入接收器的散射光增强，达到阈值联动报警）。吸气式极早期感烟探测器（极早期报警——空气采样管+高灵敏度激光腔，分区报警级别I/II/III/IV级，适用于数据中心、洁净室、通信机房等对早期火灾烟雾检测灵敏度极高、需提前预警的场合）。(2)感温探测器——定温/差温/差定温复合式。适用于厨房/锅炉房/烘干房/车库等平时有粉尘水汽烟雾的场所（避免非火警烟雾颗粒造成感烟探测器误报）。热敏电阻NTC作为温度检测元件，根据具体型号和工艺差别，出厂标定报警动作温度值（典型57℃/70℃/93℃）。(3)火焰探测器——紫外UV/红外IR/双频红外IR3/三重红外IR4。适用于石化、油库、燃气站等易燃易爆场所。响应速度快（毫秒级），对明火敏感，误报率低（多红外频谱+人工智能算法结合火焰特征波形）。(4)气体探测器——CO、H₂、CH₄、LPG、H₂S等可燃气/有毒气体探测。\n报警控制器：(1)区域报警控制器——设在保护区域内，接收该区域的探测器信号，独立管理楼层或防火分区。(2)集中报警控制器——接收各区域报警控制器的信号，联动控制全楼消防设备（消防泵、喷淋泵、防排烟风机、应急照明、疏散广播等）。海湾/北京利达/泰和安/泛海三江是国产的市场主流。报警控制器按回路容量分为回路/模块/设备编址通过总线回路（S型回路，通常每个回路≤242个地址点）连接前端探测器和联动模块。\n联动控制（GB 50116要求）：(1)消防水泵——消火栓按钮启动（硬线联动或总线联动）+消防泵控制柜自动状态联锁启动启泵，反馈运行状态；(2)喷淋泵——湿式报警阀压力开关联动启动喷淋泵喷淋增压稳压；(3)防排烟系统——接收火警信号联动开启排烟阀（280℃熔断关闭）、启动排烟风机/正压送风机（风机应能在消防控制室手动直接控制启停，信号反馈）；(4)应急照明——联动切断非消防电源（强切），强制启动消防应急照明和疏散指示系统（GB 51309《消防应急照明和疏散指示系统技术标准》）；(5)消防广播——联动启动消防应急广播系统（火灾确认后自动切换至消防广播，先疏散警报声再播放疏散语音提示，按照GB 50116的编程逻辑和分区播报）；(6)防火卷帘——联动控制防火分区防火卷帘下降（一步降/二步降——首次降至距地1.8m，第二次在温控器信号或延时后降至底部）。\n系统类型：区域报警系统（小规模独立楼宇适用）、集中报警系统（高层/超高层建筑、大型综合体的标准配置）、控制中心报警系统（建筑群，多个消控室之间的联网和主从调度，联网主机通信协议和显示一致性重点关注）按GB 50116分类与分级。", module:"m4", submodule:"4.3 消防报警", related:[] },
  { id:"2304", title:"BAS楼宇自控系统", tags:["BAS","DDC","暖通"], content:"BAS（Building Automation System，楼宇自控系统）是智能建筑的核心系统之一，对建筑内的机电设备进行自动化监控和管理，实现安全运行、节能降耗、环境舒适的目标。\n监控范围：(1)暖通空调HVAC——冷热源（冷水机组/热泵/锅炉，冷冻水出水/回水供回水温度压力监测、冷却水温度监测、启停控制和运行状态、故障报警）、空调机组AHU（送风温度/回风温度、温湿度传感器，调节冷/热水阀开度调节水温，调节风阀开度调节新风量/混风比例，变频器控制送风机转速调节风量）、新风机组/风机盘管末端、通风系统（送排风机启停、CO₂浓度/CO浓度传感器联动调节新风和通风工况、启停风机）、冷却塔风机（冷却水出水温度，启停台数和变频器转速控制冷却水温度回水温度）。(2)给排水系统——生活水泵（变频恒压供水，根据供水管网压力变频调节泵转速）、污水泵/集水坑液位联动水泵启停、水箱液位监测与报警。(3)电梯——运行状态、故障报警、火灾应急控制（FAS联动电梯迫降首层或指定转换层）。(4)照明——公共区域照明（走廊/大堂/室外景观照明）的定时开关控制、照度感应控制，可与智能照明系统对接。\n控制网络架构（三层）：(1)管理层——以太网TCP/IP，管理服务器、操作站、WEB服务器、历史数据服务器（能耗分析/报表）。通信协议BACnet/IP。管理层工作站运行整套楼宇自控管理软件（如霍尼韦尔EBI、江森Metasys、西门子Desigo CC、施耐德EcoStruxure Building Operation）。(2)自动层——DDC控制器（直接数字控制器），区域级/楼宇级。主流DDC控制器品牌：江森（Metasys系统控制器）、霍尼韦尔（Spyder/Excel Web控制器）、西门子（PXC/POL系列）、施耐德（TAC Vista/Andover Continuum）、国产厂家海林节能/同方泰德。DDC可独立运行控制程序（内置PWM/0-10V控制信号，可PID自整定调节，典型控制程序扫描周期：0.2~2s），不依赖上位机独立控制，上位机仅用于实时集中监视、参数下载和历史数据存储。(3)现场层——传感器（温度/湿度/压力/压差/流量/液位/CO₂/CO等）和执行器（电动调节阀/风阀执行器/变频器/接触器）。典型现场总线协议：BACnet MS/TP（RS485物理层，BACnet楼宇自控协议默认的现场总线低速层方案，大量采用）、Modbus RTU、LonWorks（已逐步边缘化）。\n控制策略：(1)回风温度PID控制——根据回风温度偏差调节冷/热水阀开度。(2)新风节能控制——焓值控制：比较室外空气焓值与回风焓值，当室外焓值低于回风焓值且满足其他条件时加大新风比例。（3)夜间通风预冷——夏季夜间利用室外低温空气对建筑结构进行预冷，减少次日空调峰值负荷。(4)变水量VWV/变风量VAV——根据负荷变化自动调节水泵/风机转速节能，VAV末端根据室温调节一次风风阀开度和再热加热。\n节能效果：BAS可使建筑能耗降低15%~30%，投资回收期2~4年。标准规范：GB 50189公共建筑节能设计标准、GB/T 50314智能建筑设计标准、GB 50339智能建筑工程质量验收规范。", module:"m4", submodule:"4.4 楼宇自控", related:["→ 关联：电气自动化 §3.4 DCS — 两者架构理念相似"] },
  { id:"2305", title:"能耗监测系统", tags:["能耗监测","分项计量"], content:"能耗监测系统采用分项计量的方式，对建筑/企业的各类能源消耗进行分类、分项实时监测与分析统计，是建筑节能管理和政府能耗监管的首要数据基础。\n分项计量分类（JGJ/T 285公共建筑能耗监测系统技术规范）：(1)照明插座用电（末端照明和插座回路，电表计量）——应占总能耗的详细比重拆分，独立回路照明采用分项计量表计。(2)空调用电（冷水机组、冷冻泵/冷却泵、冷却塔风机、空调箱/新风机组等用电，电表+冷热量表）——空调系统电耗较大，重点监测制冷机房总箱、冷却塔风机各回路等等。应能分项拆分出制冷主机、冷冻水泵、冷却水泵和冷却塔风机的电耗。(3)动力用电（电梯、水泵、风机等动力设备的末端配电箱出线回路）——风机、水泵等动力设备是最主要电耗，按系统分项如送排风机、给排水泵等均应独立回路以监测。(4)特殊用电（厨房、信息机房、洗衣房、游泳池等非HVAC常规用电）——特殊区域单独设表。分项计量最细粒度要求：照明和插座、空调、动力、特殊用电独立回路监测。\n硬件设备：(1)远传智能电表（多功能电力仪表或智能电能表，精度等级有功0.5S/1.0，无功2.0级，计量数据三相电压/三相电流/有功功率/无功功率/功率因数/有功电度/无功电度/频率/需量。通信接口RS485 Modbus RTU/DL/T 645多功能电能表通信规约，或以太网。三相四线电子式电能表，直接接入式(≤60A)或经CT接入式(>60A)。分项计量系统应在高低压配电室、楼层照明总箱、动力配电箱、空调机房的配电箱出线回路处安装远传电能表和数据采集终端。数据采集后通过4G/以太网上传能耗管理平台）。(2)数据网关/采集器（RS485总线转换为以太网/4G，Modbus RTU/DL/T 645规约统一转换为MODBUS TCP/MQTT/HTTP上报到平台，每条RS485总线上挂载的智能表数量不超过32台）。(3)能耗管理平台（数据存储、统计、分析、展示、报表、超限报警。平台以能耗统计结果指导节能管理工作持续改进。北京、天津、深圳等大型城市要求国家机关办公建筑和大型公共建筑均需上传能耗数据到市级/国家级政府能耗监测平台。\n关键指标：分项计量覆盖率（应达100%）、数据采集间隔（≤15min，推荐5分钟或以下采集间隔）、数据完整性率（≥95%）、计量数据传输准确率。目标节能效果：通过能耗监测系统分析发现用能漏洞和管理上的节能空间10%~30%。典型平台服务商：深圳达实智能、深圳华为、上海联元、研华、西门子能源管理和数字化平台等。\n标准规范：(1)GB/T 29149公共建筑能耗远程监测系统技术规程；(2)JGJ/T 285公共建筑能耗监测系统技术规范；(3)国家机关办公建筑和大型公共建筑能耗监测系统（住建部）——分项能耗数据采集技术导则。", module:"m4", submodule:"4.4 楼宇自控", related:[] },
  { id:"2306", title:"智能建筑系统集成", tags:["IBMS","集成平台"], content:"IBMS（Intelligent Building Management System，智能建筑管理系统）通过统一软件平台，将建筑内各弱电子系统（BAS/FAS/SAS/OAS/智能照明/停车场等）集成到同一界面进行集中监控和管理，实现跨系统联动、全局优化和信息共享。\n集成层级：(1)网络集成——保证各子系统接入IBMS网络的物理连通性（各子系统以独立的局域网与IBMS集成服务器相连，网络边界设置防火墙策略）。(2)数据集成——通过标准协议实现数据互通。OPC DA/UA（OPC DA基于DCOM，Windows与Windows系统互操作；OPC UA支持跨平台，是OPC体系架构的演进和替代，数据建模、安全认证、跨平台完整功能，是目前IBMS集成的最主流方式）、BACnet/IP（楼宇自控集成首选，实现各楼宇自控系统子系统的互联互通和数据互操作，符合GB/T 50314智能建筑设计标准要求）、Modbus TCP（通用设备集成，如智能照明系统、能源管理系统、智能电表、水表、变配电监控系统等支持Modbus TCP协议的设备集成和对接）、专有协议网关（子系统接入网关或协议转换器，完成协议转换和数据映射，无法直接开放协议时由厂家SDK/API对接后由网关转换为基础Modbus或BACnet协议。OAP（开放自动化协议）/KH Station接口机接入)。(3)应用集成——IBMS平台提供统一的人机界面（图形化显示楼宇三维/二维地图+设备图标状态实时刷新，报警管理界面，跨系统联动策略配置界面----如火警联动：FAS报警→IBMS触发→CCTV摄像机监控自动弹出现场画面→门禁断电开锁→BAS电梯控制迫降→广播播报疏散→照明应急照明强启。能耗超标联动|超过报警值→分级告警→短信通知运维主管）、统一的报警管理、统一的报表统计。\n核心功能：(1)集中监控——在统一UI上浏览全部受控设备状态；(2)跨系统联动——多系统事件触发响应（FAS+安防+BAS+智能照明+门禁等按预设逻辑联动），同时支持逻辑手动触发/定时触发/条件联动；(3)能源管理——分项能耗统计、能效分析、节能措施建议；(4)运维管理——设备台账、报修派单、维护计划、保养提醒、备品备件管理；(5)数据分析与优化——系统运行历史数据趋势曲线、对比分析、数据挖掘寻找优化空间；(6)移动端管理——手机APP/微信小程序远程监控和告警接收。\n主流IBMS平台产品：霍尼韦尔EBI（Enterprise Buildings Integrator）、西门子Desigo CC、江森Metasys、施耐德EcoStruxure Building Operation、同方泰德Techcon、中控智慧建筑IBMS、达实AIoT智能物联网管控平台。\n标准规范：GB/T 50314智能建筑设计标准，GB 50339智能建筑工程质量验收规范。", module:"m4", submodule:"4.5 系统集成", related:["→ 关联：电气自动化 §3.5 工业通信协议"] },
  { id:"2307", title:"智能照明控制", tags:["DALI","调光","KNX"], content:"智能照明控制通过总线通信技术实现对照明灯具的集中管理、场景设置、自动调光和节能运行，是绿色建筑和智能建筑的重要组成部分。\n控制协议和标准：(1)DALI协议（Digital Addressable Lighting Interface，数字可寻址照明接口，IEC 62386标准）——基于数字总线，双向通信（DALI系统不仅可发送指令，还能读取灯具的状态信息），每回路最多64个地址（每个DALI驱动器在系统配置时分配唯一的短地址），可分组（16组）和场景（16个场景）。DALI-2（IEC 62386第2版）增加了输入设备（传感器、面板）和控制设备（网关、控制器）的标准，实现了设备间互操作性，各厂家DALI产品通用。每个DALI总线回路可独立控制64个灯具的调光/开关/场景配置。DALI-2：控制设备（应用程序控制器+总线供电电源）+输入设备（传感器、控制面板）+总线供电电源。DALI DT8（Device Type 8）支持色温调谐（可调色温灯具的颜色白色调谐控制，混合白光2700K~6500K）。(2)0-10V调光——模拟量调光，控制线电压从0~10V对应灯具亮度从0~100%，是最基础的调光方法。布线：开关火线+控制线对0-10V。相对于DALI调光，0-10V调光是单向模拟控制（仅从一个方向持续发送模拟信号），控制精度一般，难以精准逐个寻址调光。(3)KNX总线——欧洲标准（EN 50090，ISO/IEC 14543），基于分布式总线（每个KNX设备自带CPU，不依赖中央控制器），支持多种传输介质（双绞线TP、电力线PL、射频RF、以太网IP）。KNX设备可以通过ETS（Engineering Tool Software，工程工具软件，是KNX系统的全局唯一的标准化配置软件）统一编程组态。KNX在住宅和楼宇综合控制（除智能照明外，还可控制窗帘、遮阳、空调、地暖、通风、安防等）中应用广泛。\n控制策略：(1)场景控制——一键切换预设灯光组合（如会议模式/投影模式/演讲模式/休会模式/全亮模式）。(2)定时控制——按时间表自动开关灯，用于定时上下班分区断电。(3)感应控制——人员移动传感器（红外/超声波/微波雷达）+照度传感器，人来自动开灯、人走延时关灯，并根据自然光强度自动调节灯光亮度。（4)恒照度控制——传感器检测工作面的照度，自动调节灯光亮度，使受控区域的照度稳定在一定照度值（如500lux、300lux）。自然采光增大照度时自动调低电光亮度，以平衡照度值减少能耗，适用办公室、教室等长期工作的场所。(5)群组控制——一个控制区域开关/调光触发整组灯具联动。\n节能效果：智能照明比传统手动控制节能30%~60%，延长灯具寿命2~4倍（LED灯具的寿命受调光开关影响较小，频繁开关调光对LED影响相对较小，仍有延长使用寿命的效果）。标准规范：GB 50034建筑照明设计标准、JGJ 16-2008（民规插接件章节）民用建筑电气设计规范。", module:"m4", submodule:"4.6 智能照明", related:[] },
  { id:"2308", title:"LED照明驱动", tags:["LED","驱动电源"], content:"LED驱动电源是LED照明的核心组件，将交流电网电压转换为恒定的直流电流提供给LED灯珠，其性能和可靠性直接影响LED灯具的光效、寿命和安全性。\n拓扑结构：AC-DC+DC-DC两级拓扑。第一级AC-DC（整流+PFC），第二级DC-DC（恒流控制）。(1)非隔离拓扑——Buck降压型，结构简单、效率高（可达90%以上）、成本低，但输入和输出不隔离（灯珠和外壳需考虑触电风险，不适合可接触灯具）。适用于吸顶灯、筒灯、射灯等内置驱动的灯具。(2)隔离拓扑——Flyback反激型（中小功率<100W通用性最广，器件少成本适中）和LLC半桥谐振型（100~300W中大功率，效率高到95%）。隔离型驱动安全（初次级电气隔离，满足CE/SAA/UL安规爬电距离要求），用于面板灯、工矿灯、路灯、隧道灯等需要人可接触外露金属外壳的灯具。\n关键参数：(1)功率因数PF——PF≥0.9（GB 17625.1谐波标准强制要求，LED驱动电源30W以下PF>0.5，30W以上PF>0.9才能通过CCC认证和出口欧美的CE/UL相关能效等级）。(2)效率η——≥87%（更优≥90%），效率高发热小（驱动电源内部电解电容寿命与工作温度成反比，每降低10℃，寿命延长一倍）。(3)输出电流精度——恒流精度±3%~5%。电流精度直接决定灯具的亮度一致性。(4)寿命——驱动电源寿命通常标称30000~50000h，失效的主要因素为电解电容寿命（电解电容干涸导致输出纹波变大，影响灯具寿命和光品质），长寿命设计可采用长寿命电解电容（如红宝石/黑金刚/尼吉康，105℃ 8000~10000h系列）或固态电容。(5)防护等级——室内IP20，户外IP65/IP67。\n调光接口：(1)三端双向可控硅调光（TRIAC dimming，前端切相调光，兼容传统白炽灯可控硅调光器，调光深度10%~100%，LED灯珠在低亮度时的闪烁问题必须满足TRIAC调光器的最小负载要求，需加泄放电阻或匹配TRIAC调光器版调光曲线）。(2)0-10V调光（模拟调光信号，0~10V对应0%~100%亮度，是商业照明调光的主流。驱动控制接口为两条0-10V信号线，阻抗匹配需注意，恒流输出端配合PWM控制调节输出电流，信号线不宜长距离平行敷设避免信号衰减干扰）。(3)PWM调光（数字调光，高频PWM信号控制恒流输出管的导通占空比实现电流斩波调光，频率>1kHz以避免人耳可闻噪音和可见频闪）。(4)DALI调光（数字寻址调光，如DALI DT6/DALI DT8，详见4.6智能照明控制）。\n发展趋势：高功率密度、小型化（GaN功率器件使开关频率MHz级、变压器体积减小），长寿命（无电解电容或长寿命电解电容设计），智能化和数字电源（调光兼容性和数字通信协议集成方案），多合一调光（TRIAC/0-10V/DALI多合一兼容）。", module:"m4", submodule:"4.6 智能照明", related:[] },
  { id:"2311", title:"LoRa物联网通信", tags:["LoRa","LPWAN","IoT"], content:"LoRa（Long Range，远距离无线通信技术）是Semtech公司推出的低功耗广域网（LPWAN）无线通信技术，在Sub-1GHz ISM免授权频段运行。凭借扩频调制技术，LoRa在距离、功耗和成本之间取得良好平衡，已成为物联网基础设施无线接入技术的主要选择。\n技术特点：(1)传输距离——城市环境2~5km，郊区/农村开阔场地10~15km。LoRa信号穿透能力强，可以在地下室、超高层楼宇内部覆盖到无线终端。(2)功耗——接收电流约10mA，休眠电流<2μA。一节18650锂亚电池（3.6V/19Ah）可支持终端工作3~10年（取决于数据上报频率和方案优化，如采集温度、压力、水电表数据每15分钟上报一次上报，理论使用时间可达5+年）。终端设备远程休眠/唤醒调度，平台级管理节点状态。(3)数据速率——0.3~50kbps（扩频因子SF7~SF12选择，速率、灵敏度和传输时间三者折中正交扩频码元数量。低速率SF12对应最高灵敏度-136dBm。速率越低灵敏度越高覆盖距离越远)。(4)频段——中国CN470~510MHz（中国区域Sub-1GHz监管频段，功率限值），EU868/EU433，US915，AS923。\nLoRaWAN网络架构：终端节点（End Device，LoRa射频芯片模组）→网关（Gateway，也称集中器/基站基站的射频版，一台网关可以接收数百到数千个终端节点的LoRa上行信号，GW将以太网/4G/5G回传至网络服务器）→网络服务器NS（Network Server，解密、去重、MAC命令处理、数据包校验、速率自适应ADR等，LoRaWAN协议MLME和MCPS服务处理）→应用服务器AS（Application Server，数据解析、存储转发、业务逻辑处理，MQTT/HTTP/REST API接口与应用平台对接）。支持设备双向通信，支持确认/非确认模式。LoRaWAN MAC层支持三种通信模式（Class A/B/C）。Class A：ALOHA随机接入方式，上行后紧跟两个短暂的下行接收窗口RX1/RX2，终端下行接收依靠上行后打开的双向接收窗口，电池最省。Class B：比Class A额外增加一个周期性下行接收窗口，通过信标实现同步，可预测终端可达。Class C：终端一直打开接收窗口，延迟最小，适合有持续供电条件且需低延迟下行的应用场景。\n应用场景：(1)表计类——智能水表、电表、燃气表、热量表远传采集替代人工抄表。智能水表：DN15~DN200全系列远传水表，光电直读/无磁/超声波原理。(2)传感采集类——环境监测（温湿度/CO₂/PM2.5/甲醛）、智慧路灯控制（单灯控制器/集中控制器，按路段经纬度时控开关策略，调光控制）、智能垃圾桶（满溢检测传感器，满溢告警和最优路线规划）、智慧停车（地磁车检器）。(3)工业类——设备状态监测（振动/温度/压力）、管廊环境监测、电力井盖监测（井盖异动监测传感器+浸水检测模块）。\nLoRa对比其他LPWAN技术：NB-IoT（运营商蜂窝物联网，授权频段，需SIM卡，覆盖广但功耗略高，适合高速移动和连续发送和可靠实时响应应用场景如智能水务集中器、市政路灯控制器），LoRa（非授权频段，企业可自建专网，终端成本低、硬件自主可控、电池持续工作年限长、数据私有不出公网，适合企业级/园区级/行业私有物联网部署）。\n标准规范：工信部无[2019]518号文关于微功率短距离无线电发射设备管理。LoRaWAN 1.0.4标准规范由LoRa联盟维护。", module:"m4", submodule:"4.7 物联网IoT", related:[] },
  { id:"2312", title:"边缘计算在电力中的应用", tags:["边缘计算","配电物联网"], content:"边缘计算（Edge Computing）将数据处理和分析能力从云端下沉到网络边缘侧（靠近数据源和用户侧），在电力系统中特别适用于配电物联网、变电站智能巡检和综合能源服务等场景，能有效降低数据传输延迟、减少对主站的带宽压力、保障本地业务独立性。\n应用架构（云-管-边-端）：(1)云端——电力云主站（生产控制大区/管理信息大区），AI训练模型下发，统一运维管理（应用远程部署和更新，OTA远程升级和固件补丁更新）。南方电网南网云、国家电网国网云，PMS设备管理系统，IoT平台套件。(2)管——5G/4G无线公网或光纤专网。配电侧逐步采用5G切片专网或APN专线实时可靠通信。(3)边——边缘智能网关/融合终端（就地安装在配电室/开关站/环网柜/箱变等配电站房内，采集各类智能终端和设备的数据，进行预处理和本地判断（就地控制逻辑，断网自维持正常运行，并上送告警到主站），实现本地决策执行和异常主动上报向云端平台，如台区智能融合终端TTU、配电站房智能网关、输电线监测边缘代理）。(4)端——智能传感器（配变监测、开关状态、环境温湿度/水浸/烟感、电缆测温，智能微断/智能塑壳、局放传感器等）。\n应用场景：(1)配电室/配电站房智能化改造——环境监测（温湿度/水浸/SF6/O₂/烟感，多合一传感器环境监测单元组柜安装）、安防监控（门禁/视频/红外双鉴，联动触发）、设备状态监测（变压器绕组温度、开关柜触头温度、电缆接头温度在线监测。无线测温传感器安装于母排接点/断路器触臂/电缆搭接头等发热易发位置，温度值LoRa/ZigBee上传至智能网关）、边缘网关本地自主决策（数据采集、规约转换、数据预处理存储断链续传、对时、联动控制，标准协议DL/T 645/Modbus/IEC 61850/IEC 104转MQTT/HTTP上送，本地配置自动化联动逻辑：温度超限告警+跳闸出口或灯控照明自动开启）。\n(2)设备预测维护（Predictive Maintenance）——边缘网关采集设备振动和温度数据，内置轻量级AI模型进行故障预判（异常检测和早期故障识别，边缘AI模型以云侧更新下发、边缘推理执行的方式工作），只有异常数据压缩后上送云端分析。减少4G流量和平台压力。典型监测对象：变压器（油色谱、顶层油温、铁心接地电流、局部放电）、开关柜（局部放电TEV超声波联合检测、触头温度、断路器机械特性监测）、电缆（护层环流、局部放电、分布式光纤测温DTS）。(3)分布式电源接入管理——光伏逆变器、风电变流器、储能PCS通过边缘网关接入配电自动化系统，实现分布式能源可视可测可控。（4)源网荷储协调控制——边缘计算执行本地策略（分布式光伏AVC/AGC，就地消纳策略，防反送电、防过电压、主动参与配网调压调频），根据实时电价和负荷预测，自动管理充电桩和储能系统充放电时间，实现需求侧响应。\n标准规范：DL/T 721配电网自动化技术导则（含终端和主站）、国家电网企标Q/GDW 11612配电自动化终端/子站标准化设计技术规范。南方电网标准V3.0智能配电站/智能开关站/智能台架变系列技术规范。", module:"m4", submodule:"4.7 物联网IoT", related:["→ 关联：电力系统 §2.4 配电系统"] },

  // ===== m5: 新能源与储能 =====
  { id:"2401", title:"光伏发电原理", tags:["光伏","电池片","逆变器"], content:"光伏发电基于光生伏特效应（Photovoltaic Effect，当太阳光照射到半导体P-N结上时，光子在半导体材料内激发非平衡电子-空穴对，在P-N结内建电场的作用下N区收集电子、P区收集空穴分离，从而在P区和N区之间产生光生电动势），将太阳能直接转换为电能。\n电池片分类：(1)单晶硅电池——效率最高（实验室26.7%，量产24%~25%），黑色均匀外观，成本较高。市场份额约80%以上。单晶PERC（发射极钝化背面电池）是过去几年主流技术，但目前已被TOPCon（隧穿氧化层钝化接触）取代成为新一代高效电池主流。单晶硅的掺镓技术已经取代掺硼电池（解决LID光致衰减的问题）。(2)多晶硅电池——效率较低（量产18%~20%），蓝色花斑外观，成本低但市场份额已快速缩小至10%以下，产线基本关停。(3)薄膜电池——碲化镉CdTe（First Solar为代表，效率10%~17%，弱光好，适合BIPV建筑光伏一体化，对光吸收率高，膜层极薄仅数微米）、铜铟镓硒CIGS（效率达21%~23%，柔性可弯曲）、非晶硅a-Si（效率低约6%~8%，但弱光响应好适合计算器/玩具/小型应用）。\n组件构成：钢化玻璃（低铁超白高透光率3.2mm/2.0mm半钢化玻璃）→EVA/POE胶膜（封装材料，340~460g/m²）+电池片（串焊互联，M10（182mm）/G12（210mm）硅片尺寸，60片/66片/72片/78片封装标准组件）→背板（玻璃/含氟背板TPT/TPE/KPK）→铝边框（阳极氧化铝合金6063 T5）。组件接线盒内装旁路二极管（防止热斑效应）。\n逆变器：将光伏组件发出的直流电（DC）转换为符合电网质量要求的交流电（AC）。核心功能：(1)MPPT最大功率点跟踪——在日照强度和环境温度变化下使光伏组件始终工作在最大功率输出点。扰动观察法P&O、电导增量法INC是主要算法。(2)并网逆变——输出电流与电网电压同频同相（单位功率因数并网），支持无功调节（逆变器可发容性及感性无功，参与AVC无功电压调节）。(3)孤岛检测——电网失电时逆变器自动停止供电，保证检修安全（过/欠压、过/欠频被动检测法和主动频移AFD/主动功率扰动法）。\n系统形式：(1)并网系统——光伏组件+逆变器+电网，不配储能，余电上网。适用于户用/工商业屋顶。(2)离网系统——光伏组件+充电控制器+蓄电池+逆变器，独立供电，适用于无电网区域。(3)混合系统——光伏+储能+电网，支持自发自用/余电上网/备电。\n关键指标：组件效率=（组件峰值功率Wp）/（组件面积m²×1000W/m²）；系统PR（Performance Ratio，系统发电性能比率）=实际发电量/理论发电量，优质系统PR可达80%~85%；年衰减率：首年≤2%，后续线性≤0.55%/年。标准：IEC 61215组件设计鉴定、IEC 61730组件安全鉴定。", module:"m5", submodule:"5.1 光伏发电", related:[] },
  { id:"2402", title:"光伏逆变器分类", tags:["光伏逆变器","组串式"], content:"光伏逆变器按技术架构和应用场景分为三类：(1)集中式逆变器——单机功率MW级（500kW~3.15MW/台），适用于大型地面电站（戈壁/沙漠光伏项目）。多路光伏组串并联输入后汇流至直流母线，经一台大功率逆变器逆变并网。优点：单瓦成本低（0.04~0.08元/W）、功率密度高、系统结构简单。缺点：MPPT路数少（集中式通常只有1~2路MPPT），组串失配损失（一个组串的阴影遮挡或故障将导致整条MPPT支路出力下降）；故障影响面大，检修时需整机停机。(2)组串式逆变器——单机功率10~350kW，适用于工商业分布式/大型地面电站（是目前市场绝对主流，占新增装机70%以上）。每台逆变器带几路MPPT（单路MPPT对应1~2串光伏组串，组串级MPPT最大限度减小阴影遮挡和组件朝向差异造成的失配损失），各台逆变器独立并联接入电网。优点：MPPT精度高、灵活扩展、故障影响小（单台故障不影响其他）。华为和阳光电源的组串式逆变器全球出货量最大。关键参数：最大效率≥98.5%（Si IGBT）、≥99%（SiC MOSFET逐步扩大应用），中国效率认证≥98%。防护等级IP66/C5防腐。(3)微型逆变器——组件级功率优化（每块组件配一台300W~2kW微型逆变器，每块组件独立MPPT和并网，彻底解决组串失配和阴影遮挡。组件间无直流高压，符合美国NEC 2017快速关断要求（AFCI和RSD快速关断，30s内将直流电压降到30V以下安全保障）。缺点：单瓦成本高（0.5~1.0元/W），适用于户用（欧洲/北美市场为主）。Enphase（美国微型逆变器龙头）全球市场份额高，禾迈/Hoymiles（杭州禾迈股份，中国微型逆变器头部企业，出货量多）。\n关键技术参数：额定输出功率（kW）、最大效率/中国效率（%）、MPPT电压范围（V，典型200~1000V/200~1500V）、MPPT路数和每路输入组串数量、最大直流输入电压（V，组串式1100V/1500V，集中式1500V为大型电站标准DC电压等级）、交流输出制式（三相380V//400V模块支持三相四线或三相三线。（公共电网并网一般采用三相三线制接线））。保护功能：防孤岛保护、极性反接保护、交流过欠压保护、直流过欠压保护、绝缘阻抗检测（IEC 62109标准要求）、漏电流保护。通信：RS485/WiFi/4G/PLC，对接监控云平台。\n选型建议：户用推荐组串式（5~50kW），组件级优化关注级优化器（SolarEdge为代表）/微型逆变器（适用于欧洲/澳洲户用屋顶，复杂屋顶、多朝向的分布式场景特别合适）；工商业推荐组串式（100~350kW）；大型地面电站推荐组串式（175~350kW+多台并联）+ 可选集中式（技术成熟稳定，适用于基础条件良好的平坦场地）。", module:"m5", submodule:"5.1 光伏发电", related:["→ 关联：产品知识库 §9.6 — 华为、阳光电源竞品"] },
  { id:"2403", title:"风力发电原理", tags:["风电","双馈","直驱"], content:"风力发电将风的动能转换为机械能再转换为电能：风能→叶片旋转→主轴增速/直驱→发电机发电。切入风速3~4m/s（风机开始并网发电的最低风速），额定风速10~15m/s（达到额定功率），切出风速25m/s（保护停机，超过此风速时变桨收桨，叶片顺桨90°以保护风机不受损坏）。\n主流机型：(1)双馈异步发电机（DFIG，Doubly-Fed Induction Generator）——定子直接并网，转子通过背靠背PWM变流器（转子侧变流器RSC+网侧变流器GSC）接入电网（四象限变频器，功率为发电机额定功率的1/3，双向能量流动）。变流器容量小（约机组容量的30%），成本低。转速可调范围±30%同步速，即0.7~1.3pu。齿轮箱升速（低速轴~15rpm→高速轴1500rpm，典型增速比1:100左右）。(2)直驱永磁同步发电机（DD-PMSG，Direct Drive Permanent Magnet Synchronous Generator）——无齿轮箱（风机叶轮直接连接低速永磁同步发电机，发电机极数极多）+全功率变流器。发电机为多极永磁同步机（100~200极，转子外径很大），通过全功率变流器（机组容量100%）并网。全功率变流器电网适应性更好（LVRT高电压穿越/低电压穿越能力更强、全功率范围有功无功解耦控制）。优点：可靠性高（无齿轮箱故障点）、维护成本低、效率高（低速同样保持高效率）；缺点：发电机体积大重量大（永磁材料用量大，成本受稀土价格影响大）、全功率变流器成本高。主流大型机组制造商推荐大容量海上风机用半直驱混合型（中速传动比1:10~30，永磁发电机+一级行星齿轮增速箱，保留了直驱和双驱的双向优势，如金风科技中速永磁（GP21系列/6S平台）。\n海上风电关键设备：(1)海上风电机组——单机容量从3MW发展到8~10MW（海上），16MW已投运，20MW正在研发。海上风机防腐要求C5-M/ CX（IEC 61400标准要求含海上环境高防腐保护），IP防护等级高。(2)海上升压站——汇集海上风电场各风机发出的中压电能（35kV/66kV），升压至220kV/330kV（升压变压器容量可达500MVA）并通过海缆送出。(3)海底电缆——220kV交流XLPE海缆（海上交流送出常用，距离<80km以内），±200kV/±320kV/±525kV柔性直流海缆（远距离海缆输电场景，如海上风电场离岸距离>80~100km时采用柔直送出方案）。\n控制技术：变桨控制（调节叶片攻角控制风能捕获量，叶片通过变桨轴承与轮毂连接，液压变桨或电动变桨执行机构）、偏航控制（机舱自动对风，风速风向仪信号驱动偏航电机带动回转轴承使机舱对准风向）、转矩控制（根据当前风速确定发电机转矩转速最优Cp风能利用系数曲线，在Cp最大曲线下最优追踪风力）。\n风电场接入：大规模风电场需满足GB/T 19963风电场接入电力系统技术规定和国网/南网风电场并网导则要求，具备低电压穿越LVRT（L和H标准型用用风电场在端电压降低不同程度时保证风机不脱网运行的能力曲线）和高电压穿越HVRT能力（高压线故障或机组本身造成的过电压穿越能力）。", module:"m5", submodule:"5.2 风力发电", related:[] },
  { id:"2404", title:"磷酸铁锂电池储能", tags:["LFP","储能","电池"], content:"磷酸铁锂电池（LiFePO₄，LFP电池）是当前电化学储能电站的主流技术路线（新增储能装机占比>95%），因其高安全性、长循环寿命和低成本优势成为储能领域的首选。\n电化学特性：正极材料为磷酸铁锂（橄榄石结构），负极材料为石墨。标称电压3.2V，工作电压范围2.5~3.65V。能量密度：电芯级140~180Wh/kg（磷酸铁锂电芯能量密度已接近理论极限170~180Wh/kg，系统级需乘以电芯成组效率——pack成组效率约70%~80%，液冷pack+Cells+Busbar等结构配重后系统级能量密度约100~130Wh/kg。（对比三元锂NCM/NCA电芯级200~280Wh/kg））。循环寿命：3000~8000次（100% DOD放电深度，即每次放电到最低允许电压。三元锂典型为2000~3000次。浅充浅放策略会进一步延长电池日历寿命到15~20年，等效储能系统设计寿命预期）。热稳定性好（分解温度>500℃），不易发生热失控（三元锂NCM热失控阈值温度约180℃），安全性显著优于三元锂电池。\n储能系统组成：(1)电池簇——电池模组（每个模组由多只电芯（8~24串/1P8S~1P24S）通过串联+并联方式组成，含CMU电芯级监控单元）+高压盒（含主正继电器、主负继电器、预充继电器和预充电阻、熔断器）+电池管理系统BMU（电池簇管理单元，采集模组电压温度数据，计算SOC/SOH）。电池簇通过直流汇流柜汇流后接入PCS变流器直流侧。(2)电池管理系统BMS——三级架构：①从控/采集板（电芯级电压温度采集、均衡控制（被动均衡，功耗几十mW/节））；②主控（簇级，SOC计算、充放电管理和报警保护、通信上送）；③总控（阵列级，与PCS/EMS通信调度、汇集管理）。BMS核心功能：SOC/SOH估算（卡尔曼滤波/安时积分法+开路电压修正）、过压/欠压/过温/低温/过流保护、均衡管理（被动均衡为主，电流30~120mA）、绝缘监测（直流母线与地之间的绝缘电阻监测，低于规范阈值报警停机）。(3)温控系统——液冷（冷板式/BTU水冷机组，冷却液乙二醇水溶液，温控效果好温差<5℃，是目前10MWh以上储能系统方案的主流，工厂预装液冷管路的液冷pack，减少现场工程量）或风冷（空调直吹/风道，简单但温差较大（>8℃）且散热效率低，主要应用在小功率储能系统）。\n标准规范：GB/T 36276电力储能用锂离子电池、GB/T 36548电化学储能系统接入电网测试规范、GB/T 36558电力系统电化学储能系统通用技术条件。电池运输需满足UN 38.3（锂电池航空/陆路/海运运输安全要求）。", module:"m5", submodule:"5.3 储能技术", related:["→ 关联：产品知识库 §9.3 储能设备"] },
  { id:"2405", title:"储能PCS变流器", tags:["PCS","储能变流器"], content:"PCS（Power Conversion System，储能变流器）是储能系统的核心设备，作为电池与电网之间的接口（接口在直流侧接入电池柜汇流，交流侧通过并网变压器（隔离变压器/非隔离）接入电网），实现AC/DC双向能量变换和功率控制。\n工作原理：PCS采用IGBT全控器件+VSC电压源型变流器拓扑，双向四象限运行（PWM整流/逆变、功率因数可调）。充电工况：PCS运行于整流模式（电网AC→直流母线DC→电池，PCS控制直流输出电流/电压给电池充电）。放电工况：PCS运行于逆变模式（电池DC→直流母线→电网AC，PCS控制交流侧有功和无功输出）。线路拓扑：AC/DC双向变流器（两电平拓扑，适用低压小功率. 三电平NPC/I型/NPC T型拓扑适合中大功率，提高效率降低输出谐波和du/dt——开关管承受电压为母线电压一半）+ LC/LCL并网滤波器。\n关键控制模式：(1)构网型控制（Grid-forming，GFM）——PCS模拟同步发电机的下垂特性和惯性响应，自建电压幅值和频率参考（电压源特性），主动支撑电网电压和频率。构网型PCS支持离网孤岛运行模式，在黑启动时作为电压源为所在微电网系统建立电压和频率，由零起建立微电网系统电压（类似大型发电机组自启动）。构网型有功/无功功率下垂系数模拟同步发电机外特性P-f/Q-V曲线，参与一次调频和一次调压响应。构网型并网尤其适合高比例可再生能源系统（系统短路容量和惯量均下降，需要构网变流器提供主动支撑、惯性模拟和长时过流能力）。(2)跟网型控制（Grid-following，GFL）——PCS采用锁相环PLL跟踪电网电压相位（电流源特性），快速响应调度AGC或EMS指令调节有功和无功功率（有功调节响应几毫秒~数十毫秒，无功调节响应容量由PCS额定容量和运行点决定）。跟网型PCS输出电流谐波和功率解耦控制性能较好，但弱电网场景下（短路容量比SCR<3），PLL同步性能劣化（容易失锁），在高比例新能源电网中支撑能力受限。\n关键参数：额定功率50~3500kW（模块化并联扩容，功率模块可并联至MW级），直流电压范围DC750~1500V（与电池簇电压匹配，1500Vdc为当前大储主流），响应时间<30ms（有功/无功指令响应，从接到指令到实际输出达到目标值90%的时间），充放电切换时间<100ms（两组不同工况切换，如从100%充电到100%放电的转换时间），效率>97%（含变压器），THDi<3%（高质量电流并网指标）。冷却方式：风冷（中小功率）或液冷（大功率模块/大容量MW级）。\n标准规范：GB/T 34120电化学储能系统储能变流器技术规范、NB/T 42014电化学储能变流器并网性能测试规范。", module:"m5", submodule:"5.3 储能技术", related:["→ 关联：产品知识库 §9.3 储能设备"] },
  { id:"2406", title:"氢燃料电池", tags:["氢能","燃料电池","PEMFC"], content:"氢燃料电池是将氢气和氧气（空气中的氧气）通过电化学反应直接转化为电能的装置，产物为水，不产生CO₂等碳排放。PEMFC（Proton Exchange Membrane Fuel Cell，质子交换膜燃料电池）是目前技术最成熟、应用最广泛的氢燃料电池类型。\n工作原理：阳极（燃料极）通入氢气H₂，在催化剂（Pt铂/碳载体催化剂层）作用下分解为H⁺质子（通过质子交换膜PEM从阳极传递到阴极）和电子（通过外电路负载流向阴极，电子产生直流电）。阴极（空气极）通入空气，催化剂使氧气O₂与透过膜的H⁺质子以及外电路传递来的电子结合生成水。总反应：2H₂+O₂→2H₂O+电能+热能。燃料电池电堆开路电压约1V（单电池理论开路电压约1.23V），工作电压约0.6~0.8V（根据极化损失：活化极化+欧姆极化+浓差极化下燃料极与空气极之间的电动势偏移）。因此需要将多个单电池串联成电堆达到所需电压等级。\n系统组成：(1)电堆（燃料电池堆）=多个单电池串联（金属双极板/石墨双极板、膜电极组件CCM、气体扩散层GDL、密封件）；(2)空气供应系统（空气压缩机+膨胀器+空气过滤器/空滤+中冷器+加湿器）；(3)氢气供应系统（储氢瓶→减压阀→比例阀→喷射器/引射器→氢气循环泵/排氢阀）；(4)热管理系统（去离子水泵+散热器+节温器+去离子器，PEMFC效率40%~60%，约一半的能量转化为热能需排散）；(5)电力变换DC/DC（将燃料电池输出不稳定的直流电压升压/稳压至母线和逆变系统所需电压电流）+逆变器或其他。\n关键参数：电堆功率密度（kw/L，目前车用电堆约4.0~6.0kW/L），系统效率（40%~60%，LHV低热值效率），寿命（车用5000~30000h，固定式发电站可达60000~80000h），冷启动能力（-30℃低温启动），额定功率系统H₂消耗：1kg氢气可发约15~20kWh电。\n对比其他制氢-储氢-用氢方案：(1)碱性电解水制氢（成熟技术，能耗4.5~5.5kWh/Nm³H₂，设备成本最低——约3000元/kW，效率75%~85%，但碱性电解水不适合与可再生能源随机波动功率直接耦合）；(2)PEM电解水制氢（高电流密度，动态响应快，适应风电光伏的功率快速波动，系统效率70%~80%，设备成本较高约5000~8000元/kW）；(3)固态氧化物电解SOEC（高温电解，效率可达85%以上，仍处于示范和商业化早期）。\n储氢方式：高压气态储氢（35/70MPa IV型碳纤维全缠绕瓶，技术成熟，目前车用主流），低温液态储氢（-253℃液化，体积能量密度为气态高压氢的~2倍，适用于大规模储运和液氢重卡），固态储氢（金属氢化物如镁基/稀土系/钛系储氢材料，安全性好，重量能量密度低，适合固定式储氢和MW级储能调峰场合）。\n标准规范：GB/T 37244质子交换膜燃料电池汽车用氢气、GB/T 34593燃料电池发动机氢气排放测试方法、ISO 19880加氢站通用要求。", module:"m5", submodule:"5.4 氢能与燃料电池", related:[] },
  { id:"2407", title:"微电网系统", tags:["微电网","EMS","孤岛"], content:"微电网（Microgrid）是由分布式电源（光伏/风电/燃气轮机/柴油发电等）、储能系统、负荷及监控保护装置组成的局域配电网系统，具有并网和离网两种运行模式，能实现自我控制、保护和管理。\n系统组成：(1)分布式电源（DG）——光伏组件阵列（通过逆变器接入交流微电网或通过DC/DC变换器接入直流微电网）+风力发电+柴油发电机（应急备用）+燃气轮机/燃气内燃机（CHP冷热电三联供，能量综合利用率可达70%~90%）。(2)储能系统（ESS）——磷酸铁锂电池PACK+PCS+EMU（储能单元）+超级电容（用于平抑快速功率波动，吸收微秒~秒级高频波动分量配以双向DC/DC变换储能接口）。(3)负荷——重要负荷（一级负荷，由微电网控制器确保供电可靠性）和可切除负荷（三级负荷，离网孤岛且电源出力不足时由微电网能量管理系统执行可控负荷切除）。(4)能量管理系统（MG-EMS，微网能量管理系统）——微电网最核心的决策和管理层。微电网能量管理系统实现发电预测（光伏/风电短期出力预测）、负荷预测、储能优化调度（充电/放电/待机状态及功率分配策略，分时电价套利和需量管理策略）、并/离网切换控制（无缝切换<20ms：并网转离网/离网转并网，要求并网断路器重合闸时刻确认同期条件，以防非同期合闸造成冲击）、功率平衡控制（实时动态平衡DG出力+储能出力+可调负荷与用能需求的平衡）。控制策略：主从控制（一台主力储能PCS做主控下垂控制R=V模式，其他DG和储能从功率指令P/Q指令，并离网状态下控制模式切换处理），对等控制（下垂控制，多台PCS自主协同，无需互联通信依赖本地信息的有功-频率/无功-电压下垂曲线分配功率）。\n运行模式：(1)并网运行——微电网与公共电网连接，从电网购电或余电上网。储能系统一般采用削峰填谷策略（充电：谷时段从电网充电（低谷电价），放电：高峰时段放电（峰时高电价），通过峰谷套利回收投资。需量管理也是微电网储能PCS的另一种收益模式：控制器监测变压器功率，投入储能系统放电削减用电需求的总峰值需量，节省基本电费）。(2)离网孤岛运行——当公共电网故障或因计划孤岛检修任务，微电网与公共电网断开连接，由微电网内部分布式电源和储能系统自给自足供电。无缝切换是关键技术要求（微电网从并网模式切换到离网模式的瞬间暂态双模式切换：并网模式下PCS一般是跟网型电流控制，离网模式下PCS需要切换为构网型电压控制转离网模式建立电压参考，切换时间<20ms保证了负荷不会因模式切换而短时断电）。(3)并离网切换——从并网（大电网支撑）变为离网（微电网自己构建）的无缝切换，要求快速且负载不中断供电。\n保护与控制：微电网需配置反孤岛保护（并网模式下，电网失电时自动或受控检测断开并网连接点，满足安全要求）、低频/低压减载、并网同期检测。通信协议：支持IEC 61850/IEC 104/Modbus等电力标准。\n标准规范：GB/T 38995微电网接入电力系统技术要求、GB/T 36270微电网监控系统技术规范、NB/T 10135微电网规划设计导则。国内微电网示范：珠海东澳岛兆瓦级智能微电网、新疆吐鲁番新能源微电网、西藏阿里地区微电网光储柴项目等。", module:"m5", submodule:"5.5 微电网", related:[] },
  { id:"2408", title:"双碳目标与新型电力系统", tags:["双碳","新型电力系统"], content:"双碳目标是中国对全球气候治理作出的庄严承诺：2030年前实现碳达峰（二氧化碳排放量达到历史最高值后进入持续下降通道），2060年前实现碳中和（人为排放的二氧化碳与通过植树造林、碳捕集封存CCS/碳捕集利用与封存CCUS等技术吸收的二氧化碳相抵消）。\n新型电力系统是双碳目标的核心支撑，以新能源为主体，具有如下特征：\n(1)高比例新能源——风电、光伏装机将占总装机的80%以上（2030年风光总装机超12亿kW，新能源发电量占比将超过20%、2060年新能源电量渗透率超过60%以上甚至更高水平），新能源成为主力电源。电源结构从可控的化石能源（煤电、气电、核电、水电）转变为间歇性强的新能源（光伏和风电出力主要取决于天气——不同时间和季节的随机性、间歇性和波动性，日周期内光伏在无光照时段出力为零）。\n(2)高比例电力电子——传统电力系统中同步发电机（惯性大，固有旋转惯量为系统提供频率支撑，短路容量大，抗电网扰动强）与新电力系统中新能源通过变流器并网（电力电子接口，缺乏惯性支撑、短路容量小——SCR短路比下降、弱电网特性显著——由此带来频率稳定和宽频振荡等问题），电力电子设备占比从当前的约10%上升到未来可能的70%以上。带来的核心问题：系统惯量下降（频率调节能力变弱）；宽频振荡风险（次同步振荡/超同步振荡）；电压支撑能力不足（短路容量下降带来的暂态过电压风险）。构网型技术（Grid-forming Converter）是解决方向。\n(3)源网荷储互动——传统电力“源随荷动”（发电侧跟随用电负荷实时变化）模式转变为“源网荷储协同互动”模式：电源侧（各类电源协调互补）、电网侧（特高压骨干网架+智能配电网）、负荷侧（用户参与需求响应，电动车V2G反向送电，工商业用户响应实时电价）、储能侧（抽水蓄能+电化学储能多时间尺度协调，发挥削峰填谷/一次调频/二次调频/事故应急备用等功能）。\n(4)电力市场改革——中长期市场+现货市场+辅助服务市场（调频/调峰/备用/黑启动）。储能、需求响应、虚拟电厂参与市场交易。绿证和碳交易市场协同。\n关键路径：水电（西南水电基地开发，截至截至2023年约4.2亿kW，2035年有望达到4.7亿kW以上）、风电（三北风电基地+海上风电）、光伏（沙漠戈壁荒漠大基地+整县推进户用+工商业分布式）、储能（抽水蓄能14亿kW规划+新型储能各技术路线并重，新型储能指除抽水蓄能以外的新型电化学储能/压缩空气/飞轮等新型储能）；终端用能电气化（电动汽车（到2030年新能源汽车渗透率将超过60%以上）、电采暖、工业电窑炉）、氢能（绿氢替代灰氢，在工业脱碳和储运领域发挥重要作用）。\n标准参考：国务院《2030年前碳达峰行动方案》（国发〔2021〕23号）、国家发改委/国家能源局《关于加快建设全国统一电力市场体系的指导意见》（发改体改〔2022〕118号）、《新型电力系统发展蓝皮书》（国家能源局2023年6月发布）。", module:"m5", submodule:"5.6 双碳政策", related:[] },
